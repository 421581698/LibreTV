services:
  libretv:
    build: .
    # 版本管理：镜像 tag 与 package.json 的 version 保持一致
    # - 使用者：不设置 LIBRETV_IMAGE 即拉取 ghcr.io/librespark/libretv:latest（首次部署用 docker compose pull）
    # - 开发者：docker compose up -d --build 会在本地构建并打上同名 tag
    # - 需要固定版本时设置 LIBRETV_IMAGE=ghcr.io/librespark/libretv:<版本>
    image: ${LIBRETV_IMAGE:-ghcr.io/librespark/libretv:latest}
    container_name: libretv
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - collector_net
    # 无状态服务：观看历史在浏览器 IndexedDB、设置在 localStorage，无需挂载卷
    environment:
      # 必填：访问密码（在 .env 中设置，缺失时 compose 启动即报错提醒）
      - PASSWORD=${PASSWORD:?请在 .env 中设置 PASSWORD}
      # 可选：FMHY / Scrapling 采集服务（启用 collector profile 后使用）
      - SCRAPLING_API_BASE=${SCRAPLING_API_BASE:-http://scrapling-collector:8000}
      - SCRAPLING_API_TOKEN=${SCRAPLING_API_TOKEN:-}
      # 可选：会话/代理签名密钥（多实例部署建议显式设置：openssl rand -hex 32）
      # - PROXY_SECRET=your-secret
      # 可选：Cookie Secure 策略覆盖（true=强制开启 / false=强制关闭；不设置时按请求协议自动推导，HTTP 部署无需配置）
      # - COOKIE_SECURE=true
      # 可选：预置采集站（JSON 数组），用户端自动出现且默认勾选
      # - DEFAULT_SOURCES=[{"name":"示例源","url":"https://example.com/api.php/provide/vod"}]
      # 可选：预置直播源（M3U 订阅，JSON 数组），epg 为可选节目单地址
      # - DEFAULT_LIVE_SOURCES=[{"name":"示例直播源","url":"https://example.com/list.m3u","epg":"https://example.com/epg.xml.gz"}]
      # 可选：预置数据源订阅（SourceList JSON 链接，一次下发点播源 + 直播源）
      # refreshDays 为该订阅的静默刷新周期初始值（1-365 天，缺省 1 天），可省略；用户在面板改过后以面板为准
      # - DEFAULT_SUBSCRIPTIONS=["https://example.com/sources.json", {"url":"https://example.com/list.json","name":"名称","refreshDays":10}]
      # 可选：首页推荐数据源默认值（douban / bangumi / hot-list），仅对未主动选择过的用户生效
      # - DEFAULT_RECOMMEND_SOURCE=douban
      # 可选：自建内网 IPTV 放行（对拉列表、测活、拉流三个阶段同时生效，默认关闭以维持 SSRF 防护）
      # - LIVE_ALLOW_PRIVATE=1
      # 可选：代理上游请求超时（毫秒）与重试次数
      # - REQUEST_TIMEOUT=8000
      # - MAX_RETRIES=1
      # 可选：每个搜索源最多抓取的页数（1-50，默认 5），调大会显著增加上游请求量
      # - SEARCH_MAX_PAGES=5
      # 可选：单个搜索源的总死线（毫秒，3s-60s，默认 10000），到点中断该源并标记超时
      # - SEARCH_SOURCE_TIMEOUT_MS=10000
      # 可选：代理请求 UA（豆瓣防盗链等场景）
      # - USER_AGENT=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/122.0.0.0 Safari/537.36
      # 可选：影视榜单推荐源（60s API）实例地址，官方公共实例有限流
      # - 60S_API_BASE=https://60s.crystelf.top


  # Optional isolated Python runtime for FMHY discovery + Scrapling crawling.
  # Start explicitly with: docker compose --profile collector up -d --build
  scrapling-collector:
    profiles: ["collector"]
    build:
      context: ./services/scrapling-collector
    container_name: libretv-scrapling-collector
    restart: unless-stopped
    networks:
      collector_net:
        ipv4_address: ${SCRAPLING_COLLECTOR_IP:-172.30.60.10}
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid
    shm_size: 256m
    cap_drop:
      - ALL
    cap_add:
      # Entrypoint needs CHOWN for the mounted volume and SETGID/SETUID for gosu.
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1g
    cpus: 2.0
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "1"
      net.ipv6.conf.default.disable_ipv6: "1"
    environment:
      - SCRAPLING_API_TOKEN=${SCRAPLING_API_TOKEN:-}
      # Keep every outbound collector operation disabled until the host firewall has been installed and verified.
      - SCRAPLING_EGRESS_FIREWALL_CONFIRMED=${SCRAPLING_EGRESS_FIREWALL_CONFIRMED:-0}
      - SCRAPLING_DB_PATH=${SCRAPLING_DB_PATH:-/data/collector.sqlite3}
      - SEEDHUB_PURGE_LEGACY_CATALOG=${SEEDHUB_PURGE_LEGACY_CATALOG:-1}
      - PORT=8000
    expose:
      - "8000"
    volumes:
      - scrapling_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  scrapling-worker:
    profiles: ["collector"]
    build:
      context: ./services/scrapling-collector
    container_name: libretv-scrapling-worker
    restart: unless-stopped
    command: ["python", "worker.py"]
    networks:
      collector_net:
        ipv4_address: ${SCRAPLING_WORKER_IP:-172.30.60.11}
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid
    shm_size: 256m
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1g
    cpus: 2.0
    environment:
      - SCRAPLING_API_TOKEN=${SCRAPLING_API_TOKEN:-}
      - SCRAPLING_EGRESS_FIREWALL_CONFIRMED=${SCRAPLING_EGRESS_FIREWALL_CONFIRMED:-0}
      - SCRAPLING_DB_PATH=${SCRAPLING_DB_PATH:-/data/collector.sqlite3}
      - SEEDHUB_PURGE_LEGACY_CATALOG=${SEEDHUB_PURGE_LEGACY_CATALOG:-1}
    volumes:
      - scrapling_data:/data
    depends_on:
      scrapling-collector:
        condition: service_healthy

volumes:
  scrapling_data:

networks:
  collector_net:
    name: libretv_scrapling_net
    driver: bridge
    ipam:
      config:
        - subnet: ${SCRAPLING_NETWORK_SUBNET:-172.30.60.0/24}
