name = "libretv-pr60-protected-preview"
main = ".open-next/worker.js"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat", "nodejs_compat_populate_process_env", "global_fetch_strictly_public"]
assets = { directory = ".open-next/assets" }

# Isolated password-protected PR #60 preview. Never aliases production or the public preview.
workers_dev = true
preview_urls = false

[vars]
CMS_SEARCH_API = "https://caiji.dyttzyapi.com/api.php/provide/vod"
API_60S_BASE = "https://60s.bggdbh.workers.dev"
LLM_MODEL = "glm-4-flash"
AUTH_DISABLED = "false"

# PASSWORD is provisioned separately as a Cloudflare Worker secret by the protected-preview workflow.
