name = "libretv-homepage-preview"
main = ".open-next/worker.js"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
assets = { directory = ".open-next/assets" }

# Preview Worker 使用独立 workers.dev 地址；此 Preview 明确关闭应用层密码登录。
workers_dev = true
preview_urls = false

[vars]
# HOME_V2 在构建时通过 GitHub Actions 环境变量注入；此处保留运行时配置。
CMS_SEARCH_API = "https://caiji.dyttzyapi.com/api.php/provide/vod"
API_60S_BASE = "https://60s.bggdbh.workers.dev"
LLM_MODEL = "glm-4-flash"
# 仅对独立 Preview Worker 关闭登录；Production 配置保持不变。
AUTH_DISABLED = "true"

# 不要在此文件写 API 密钥或其他敏感值；必要的服务密钥仍通过 Worker Secrets 单独配置。
