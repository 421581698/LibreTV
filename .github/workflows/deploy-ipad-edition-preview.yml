                  viewport: { width: 1194, height: 834 },
                  deviceScaleFactor: 2,
                  isMobile: true,
                  hasTouch: true,
                  colorScheme,
                });
                const page = await context.newPage();
                const errors = [];
                page.on("pageerror", error => errors.push(error.message));
                // Use deterministic, clearly synthetic CMS data so detail/player baselines
                // exercise real page content without depending on third-party source uptime.
                if (["detail", "detail-tmdb", "detail-bangumi", "watch"].includes(route.name)) {
                  const fixtureDetail = {
                    episodes: ["https://media.preview.invalid/fixture.mp4"],
                    episodeItems: [{ title: "预览播放条目", url: "https://media.preview.invalid/fixture.mp4", duration: "00:30" }],
                    videoInfo: {
                      title: "iPad Preview 样片",
                      cover: "https://media.preview.invalid/cms-poster.svg",
                      desc: "用于 iPad Edition 详情页与播放页视觉验收的合成测试数据，不代表真实片源。",
                      typeName: "电视剧",
                      year: "2026",
                      area: "测试环境",
                      sourceKey: "friday-cms",
                      sourceName: "Preview Fixture",
                      sourceUrl: "https://preview.invalid/api.php/provide/vod",
                    },
                  };
                  await page.route("**/api/status", route => route.fulfill({
                    status: 200,
                    contentType: "application/json",
                    body: JSON.stringify({
                      passwordRequired: false, verified: true, version: "ipad-preview-fixture",
                      defaultSources: [], defaultLiveSources: [], defaultSubscriptions: [],
                      defaultRecommendSource: null, defaultImageMode: "direct",
                    }),
                  }));
                  await page.route("**/api/detail?*", route => route.fulfill({
                    status: 200,
                    contentType: "application/json",
                    body: JSON.stringify(fixtureDetail),
                  }));
                  const posterSvg = '<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#253b5c"/><stop offset="1" stop-color="#090d18"/></linearGradient></defs><rect width="1200" height="1800" fill="url(#g)"/><circle cx="600" cy="650" r="260" fill="#d9b66c" opacity=".65"/><text x="600" y="1370" fill="#fff" font-size="76" text-anchor="middle">LIBRETV PREVIEW</text></svg>';
                  await page.route("https://media.preview.invalid/**", route => {
                    if (route.request().url().endsWith(".mp4")) {
                      return route.fulfill({ status: 200, contentType: "video/mp4", body: Buffer.alloc(0) });
                    }
                    return route.fulfill({ status: 200, contentType: "image/svg+xml", body: posterSvg });
                  });
                  if (route.name === "detail-tmdb") {
                    await page.route("**/api/tmdb/details?*", route => route.fulfill({
                      status: 200, contentType: "application/json",
                      body: JSON.stringify({
                        id: 12345, title: "TMDB 预览样片", original_title: "TMDB Preview",
                        overview: "TMDB 详情视觉回归测试数据。", poster_path: "/preview-poster.svg",
                        backdrop_path: null, vote_average: 8.6, release_date: "2026-01-01",
