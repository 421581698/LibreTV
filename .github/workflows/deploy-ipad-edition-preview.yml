                  }
                  if (route.name === "detail-bangumi") {
                    await page.route("**/api/bangumi/subject?*", route => route.fulfill({
                      status: 200, contentType: "application/json",
                      body: JSON.stringify({
                        id: 425, name: "Bangumi Preview", name_cn: "Bangumi 预览样片",
                        summary: "Bangumi 详情视觉回归测试数据。", date: "2026-04-01",
                        platform: "TV", total_episodes: 12, images: { large: "https://media.preview.invalid/bangumi-poster.svg" },
                        rating: { score: 8.8, total: 100 }, tags: [{ name: "科幻" }, { name: "冒险" }],
