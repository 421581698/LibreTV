name: Deploy LibreTV iPad Edition Preview (Ubuntu 24.04)
# Preview-only visual audit activation; never targets the production Worker. [deploy-ipad-edition-preview]
# Poster proxy verification follows the iPad homepage image reliability fix.
# Rendered PNG poster pixels are now a required gate; unreadable slots fail closed.
# [deploy-ipad-edition-preview] Verify glass material, touch gestures and rendered poster pixels across iPad viewports.
# Every relevant push to this feature branch queues the isolated Preview; deployment still waits for Verify on the exact same SHA.
# Layout diagnostics are passed explicitly into the browser evaluation context for report serialization.

on:
  push:
    branches:
      - feature/libretv-ipad-edition-product
    paths:
      - ".github/workflows/deploy-ipad-edition-preview.yml"
      - ".github/workflows/ipad-edition-verify.yml"
      - "src/app/ipad-edition/**"
      - "src/components/ipad-edition/**"
      - "src/components/home/V4SpatialScreen.tsx"
      - "src/components/home/V4HomepageHero.tsx"
      - "src/components/home/V4HomepageContent.tsx"
      - "src/components/home/home-inline-play.test.ts"
      - "src/components/home/homepage-playback-regression.test.ts"
      - "src/components/smart-image.tsx"
      - "src/lib/poster/**"
      - "src/lib/ipad-edition/**"
      - "src/lib/search.ts"
      - "src/lib/search.test.ts"
      - "src/lib/douban-weekly.ts"
      - "src/app/api/douban/route.ts"
      - "src/app/api/tmdb/**"
      - "src/app/api/poster-fallback/route.ts"
      - "src/lib/tmdb.ts"
      - "src/lib/client-api.ts"
      - "src/lib/env-sources.ts"
      - "src/app/api/detail/route.ts"
      - "src/app/api/detail/route.test.ts"
      - "src/app/page.tsx"
      - "src/app/watch/page.tsx"
      - "src/lib/movie-title-match.ts"
      - "src/lib/movie-title-match.test.ts"
      - "wrangler.ipad-edition-preview.toml"
  workflow_dispatch:
    inputs:
      confirm_preview_deploy:
        description: "确认只部署独立 iPad Edition Preview Worker（必须先通过同一提交的 Verify）"
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"

# Matched CSS provenance is captured via CSS.styleSheetAdded before querying computed rule origins.

permissions:
  contents: read
  actions: read

concurrency:
  group: libretv-ipad-edition-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    if: ${{ github.ref == 'refs/heads/feature/libretv-ipad-edition-product' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.confirm_preview_deploy == 'yes')) }}
    name: Build and deploy isolated iPad Edition Preview
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: preview
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Require successful Verify for this exact commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
          GH_BRANCH: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          const url = new URL(`https://api.github.com/repos/${process.env.GH_REPOSITORY}/actions/runs`);
          url.searchParams.set("branch", process.env.GH_BRANCH);
          url.searchParams.set("per_page", "100");
          const headers = {
            accept: "application/vnd.github+json",
            authorization: `Bearer ${process.env.GH_TOKEN}`,
            "x-github-api-version": "2022-11-28",
          };
          let verify;
          for (let attempt = 1; attempt <= 20; attempt += 1) {
            const response = await fetch(url, { headers });
            if (!response.ok) throw new Error(`Cannot inspect Verify runs: HTTP ${response.status}`);
            const payload = await response.json();
            verify = (payload.workflow_runs ?? []).find(run =>
              run.name === "LibreTV iPad Edition Verify" &&
              run.head_sha === process.env.GH_SHA &&
              run.head_branch === process.env.GH_BRANCH &&
              run.conclusion === "success"
            );
            if (verify) break;
            if (attempt < 20) {
              console.log(`Waiting for successful Verify on exact SHA ${process.env.GH_SHA} (attempt ${attempt}/20).`);
              await new Promise(resolve => setTimeout(resolve, 15000));
            }
          }
          if (!verify) {
            throw new Error(`No successful iPad Edition Verify run for ${process.env.GH_SHA} after 5 minutes; Preview deployment is blocked.`);
          }
          console.log(`Verified exact commit ${verify.head_sha} with run ${verify.id}.`);
          NODE
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Unit tests
        run: npm test -- --reporter=dot
      - name: Build isolated Worker
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npx opennextjs-cloudflare build
      - name: Verify Preview credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing preview secret: CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing preview secret: CLOUDFLARE_ACCOUNT_ID" && exit 1)
      - name: Deploy dedicated iPad Edition Preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.ipad-edition-preview.toml
      - name: Configure TMDB metadata secret for Preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          METADATA_API_KEY: ${{ secrets.METADATA_API_KEY }}
        run: |
          if [ -n "${TMDB_API_READ_ACCESS_TOKEN:-}" ]; then
            printf '%s' "$TMDB_API_READ_ACCESS_TOKEN" | npx wrangler secret put TMDB_API_READ_ACCESS_TOKEN --config wrangler.ipad-edition-preview.toml
          elif [ -n "${TMDB_API_KEY:-}" ]; then
            printf '%s' "$TMDB_API_KEY" | npx wrangler secret put TMDB_API_KEY --config wrangler.ipad-edition-preview.toml
          elif [ -n "${METADATA_API_KEY:-}" ]; then
            printf '%s' "$METADATA_API_KEY" | npx wrangler secret put METADATA_API_KEY --config wrangler.ipad-edition-preview.toml
          else
            echo "::error::Missing Preview environment secret: configure TMDB_API_READ_ACCESS_TOKEN, TMDB_API_KEY, or METADATA_API_KEY."
            exit 1
          fi
      - name: Verify isolated iPad Edition route
        run: |
          node --input-type=module <<'NODE'
          const url = "https://libretv-ipad-edition-preview.bggdbh.workers.dev/ipad-edition";
          let response;
          let lastError = "no response";
          for (let attempt = 1; attempt <= 12; attempt += 1) {
            try {
              response = await fetch(url, { cache: "no-store", redirect: "manual" });
              if (response.ok) break;
              lastError = "HTTP " + response.status;
            } catch (error) {
              lastError = String(error);
            }
            if (attempt < 12) await new Promise(resolve => setTimeout(resolve, 5000));
          }
          if (!response?.ok) throw new Error("iPad Edition Preview did not respond: " + lastError);
          const contentType = response.headers.get("content-type") || "";
          const html = await response.text();
          if (!contentType.includes("text/html") || html.length < 1000 || !html.toLowerCase().includes("<html")) {
            throw new Error("Preview route did not return a complete HTML document.");
          }
          console.log("Dedicated iPad Edition Preview route returned an HTML document.");
          NODE
      - name: Install Playwright package for simulated iPad visual audit
        timeout-minutes: 5
        run: npm install --no-save --no-package-lock playwright@1.56.1 pngjs@7.0.0
      - name: Install minimal Chromium runtime libraries
        timeout-minutes: 15
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends \
            libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 \
            libx11-xcb1 libxkbcommon0 libxcomposite1 libxdamage1 \
            libxfixes3 libxrandr2 libgbm1 libasound2t64 \
            fonts-noto-cjk
          fc-cache -f
          fc-list :lang=zh | grep -q .
          ldconfig -p | grep -q libatk-1.0.so.0
          ldconfig -p | grep -q libatk-bridge-2.0.so.0
      - name: Install Playwright Chromium browser
        timeout-minutes: 8
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "120000"
          PLAYWRIGHT_DOWNLOAD_NO_PROGRESS: "1"
        run: npx playwright install chromium
      # [deploy-ipad-edition-preview] Re-run after edge-swipe touch handling fix.
      - name: Run iPad viewport and theme visual audit
        timeout-minutes: 18
        run: |
          mkdir -p artifacts/ipad-visual-audit
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs/promises';
          import { PNG } from 'pngjs';

          const target = "https://libretv-ipad-edition-preview.bggdbh.workers.dev/ipad-edition?__layout_debug=1";
          const viewports = [
            { name: "ipad-11-portrait", width: 834, height: 1194, deviceScaleFactor: 2 },
            { name: "ipad-11-landscape", width: 1194, height: 834, deviceScaleFactor: 2 },
            { name: "ipad-pro-13-portrait", width: 1032, height: 1376, deviceScaleFactor: 2 },
            { name: "ipad-pro-13-landscape", width: 1366, height: 1024, deviceScaleFactor: 2 },
            { name: "ipad-split-half", width: 507, height: 834, deviceScaleFactor: 2 },
            { name: "ipad-split-two-thirds", width: 694, height: 834, deviceScaleFactor: 2 },
          ];
          const browser = await chromium.launch({ headless: true });
          const results = [];
          let failures = 0;
          try {
            for (const viewport of viewports) {
              for (const colorScheme of ["light", "dark"]) {
                const context = await browser.newContext({
                  viewport: { width: viewport.width, height: viewport.height },
                  deviceScaleFactor: viewport.deviceScaleFactor,
                  isMobile: true,
                  hasTouch: true,
                  colorScheme,
                });
                const page = await context.newPage();
                // Capture native touch and Pointer Event delivery before application hydration.
                await page.addInitScript(() => {
                  window.__ipadTouchTrace = [];
                  const record = (event) => {
                    const target = event.target instanceof Element
                      ? (event.target.closest('.ipad-nav__edge-swipe-zone, .ipad-nav__sidebar, .ipad-edition')?.className ?? event.target.tagName)
                      : String(event.target);
                    window.__ipadTouchTrace.push({
                      type: event.type,
                      pointerType: 'pointerType' in event ? event.pointerType : undefined,
                      pointerId: 'pointerId' in event ? event.pointerId : undefined,
                      isPrimary: 'isPrimary' in event ? event.isPrimary : undefined,
                      x: 'clientX' in event ? event.clientX : ('touches' in event && event.touches[0] ? event.touches[0].clientX : undefined),
                      y: 'clientY' in event ? event.clientY : ('touches' in event && event.touches[0] ? event.touches[0].clientY : undefined),
                      cancelable: event.cancelable,
                      defaultPrevented: event.defaultPrevented,
                      target,
                    });
                    if (window.__ipadTouchTrace.length > 120) window.__ipadTouchTrace.shift();
                  };
                  for (const type of ['pointerdown','pointermove','pointerup','pointercancel','touchstart','touchmove','touchend','touchcancel']) {
                    document.addEventListener(type, record, { capture: true, passive: false });
                  }
                });
                // Force the application theme class, not merely the browser media preference.
                await page.addInitScript((scheme) => {
                  const applyTheme = () => {
                    const root = document.documentElement;
                    if (!root) return;
                    root.classList.toggle('dark', scheme === 'dark');
                    root.style.colorScheme = scheme;
                  };
                  if (document.documentElement) applyTheme();
                  else document.addEventListener('DOMContentLoaded', applyTheme, { once: true });
                }, colorScheme);
                const consoleErrors = [];
                const apiDiagnostics = [];
                const apiDiagnosticTasks = [];
                const apiRequestStartedAt = new Map();
                const isHomepageApi = (url) => /^\/api\/(douban|hot-list|bangumi\/calendar|tmdb\/discover)$/.test(new URL(url).pathname);
                page.on("pageerror", error => consoleErrors.push(error.message));
                page.on("request", request => {
                  if (isHomepageApi(request.url())) apiRequestStartedAt.set(request, Date.now());
                });
                page.on("requestfailed", request => {
                  if (!isHomepageApi(request.url())) return;
                  apiDiagnostics.push({
                    type: "requestfailed",
                    pathname: new URL(request.url()).pathname,
                    durationMs: apiRequestStartedAt.has(request) ? Date.now() - apiRequestStartedAt.get(request) : null,
                    error: request.failure()?.errorText ?? "unknown",
                  });
                });
                page.on("response", apiResponse => {
                  if (!isHomepageApi(apiResponse.url())) return;
                  const task = (async () => {
                    const pathname = new URL(apiResponse.url()).pathname;
                    const entry = {
                      type: "response",
                      pathname,
                      status: apiResponse.status(),
                      durationMs: apiRequestStartedAt.has(apiResponse.request())
                        ? Date.now() - apiRequestStartedAt.get(apiResponse.request())
                        : null,
                    };
                    try {
                      // Bound body reads so a stalled upstream cannot block the audit report.
                      const body = await new Promise((resolve, reject) => {
                        const timeout = setTimeout(() => resolve(null), 5000);
                        apiResponse.text().then(value => {
                          clearTimeout(timeout);
                          resolve(value);
                        }, error => {
                          clearTimeout(timeout);
                          reject(error);
                        });
                      });
                      if (body === null) {
                        entry.bodyReadTimeoutMs = 5000;
                      } else {
                        let payload;
                        try {
                          payload = JSON.parse(body);
                          entry.payloadKeys = payload && typeof payload === "object" ? Object.keys(payload) : [];
                          if (Array.isArray(payload?.items)) entry.itemCount = payload.items.length;
                          if (Array.isArray(payload?.days)) {
                            entry.dayCount = payload.days.length;
                            entry.calendarItemCount = payload.days.reduce((sum, day) => sum + (Array.isArray(day?.items) ? day.items.length : 0), 0);
                          }
                          if (!apiResponse.ok()) entry.body = body.slice(0, 1200);
                        } catch (error) {
                          entry.jsonParseError = String(error);
                          entry.body = body.slice(0, 1200);
                        }
                      }
                    } catch (error) {
                      entry.bodyReadError = String(error);
                    }
                    apiDiagnostics.push(entry);
                  })();
                  apiDiagnosticTasks.push(task);
                });
                const response = await page.goto(target, { waitUntil: "domcontentloaded", timeout: 60000 });
                await page.locator('[data-ipad-edition="true"]').waitFor({ state: "attached", timeout: 30000 });
                await page.waitForFunction((scheme) => document.querySelector('.ipad-edition')?.getAttribute('data-environment') === scheme, colorScheme, { timeout: 30000 });
                await page.locator('.ipad-nav__topbar-inner').waitFor({ state: "visible", timeout: 30000 });
                // Exercise the real navigation controls in every viewport/theme pair.
            // Wait for React to attach client event props before clicking: domcontentloaded
            // can occur before hydration, which otherwise creates a false timeout.
            let sidebarInteractionPassed = false;
            const sidebarInteraction = { opened: false, escapeClosed: false, scrimClosed: false, edgeSwipeOpened: false, edgeSwipeClosed: false };
            try {
              await page.waitForFunction(() => {
                const button = document.querySelector('.ipad-nav__menu-button');
                return Boolean(button && Object.keys(button).some(key => key.startsWith('__reactProps$')));
              }, undefined, { timeout: 20000 });
              const menuButton = page.locator('.ipad-nav__menu-button');
              await menuButton.click();
              await page.waitForFunction(() => document.querySelector('.ipad-nav__menu-button')?.getAttribute('aria-expanded') === 'true', undefined, { timeout: 10000 });
              await page.locator('.ipad-nav__sidebar.is-open').waitFor({ state: 'visible', timeout: 10000 });
              sidebarInteraction.opened = await page.locator('.ipad-nav__sidebar.is-open').isVisible();
              await page.keyboard.press('Escape');
              await page.waitForFunction(() => document.querySelector('.ipad-nav__menu-button')?.getAttribute('aria-expanded') === 'false');
              await page.waitForFunction(() => !document.querySelector('.ipad-nav__sidebar')?.classList.contains('is-open'));
              sidebarInteraction.escapeClosed = await page.locator('.ipad-nav__sidebar.is-open').count() === 0;
              await menuButton.click();
              const scrim = page.locator('.ipad-nav__scrim');
              await scrim.waitFor({ state: 'visible', timeout: 10000 });
              await scrim.click({ position: { x: Math.max(300, viewport.width - 32), y: Math.floor(viewport.height / 2) } });
              await page.waitForFunction(() => document.querySelector('.ipad-nav__menu-button')?.getAttribute('aria-expanded') === 'false');
              await page.waitForFunction(() => !document.querySelector('.ipad-nav__sidebar')?.classList.contains('is-open'));
              sidebarInteraction.scrimClosed = await page.locator('.ipad-nav__sidebar.is-open').count() === 0;
              // Verify genuine touch-pointer edge-swipe open and only attempt close after a proven open.
              const touchSession = await context.newCDPSession(page);
              sidebarInteraction.diagnostics = await page.evaluate(() => {
                const edge = document.querySelector('.ipad-nav__edge-swipe-zone');
                const root = document.querySelector('.ipad-edition');
                const hit = document.elementFromPoint(8, 260);
                const rect = element => {
                  if (!element) return null;
                  const r = element.getBoundingClientRect();
                  return { x:r.x, y:r.y, width:r.width, height:r.height };
                };
                return {
                  edgeRect: rect(edge),
                  hitAtEdge: hit?.className ?? hit?.tagName ?? null,
                  hitIsEdge: Boolean(edge && hit && (hit === edge || edge.contains(hit))),
                  edgeTouchAction: edge ? getComputedStyle(edge).touchAction : null,
                  rootTouchAction: root ? getComputedStyle(root).touchAction : null,
                  rootPresent: Boolean(root),
                };
              });
              try {
                await touchSession.send('Emulation.setTouchEmulationEnabled', { enabled: true, maxTouchPoints: 1 });
                await touchSession.send('Input.dispatchTouchEvent', { type: 'touchStart', touchPoints: [{ x: 8, y: 260, id: 1, force: 1 }] });
                await touchSession.send('Input.dispatchTouchEvent', { type: 'touchMove', touchPoints: [{ x: 96, y: 260, id: 1, force: 1 }] });
                await touchSession.send('Input.dispatchTouchEvent', { type: 'touchMove', touchPoints: [{ x: 180, y: 260, id: 1, force: 1 }] });
                await touchSession.send('Input.dispatchTouchEvent', { type: 'touchEnd', touchPoints: [] });
                await page.waitForFunction(() => document.querySelector('.ipad-nav__menu-button')?.getAttribute('aria-expanded') === 'true', undefined, { timeout: 5000 });
                // Wait for the rendered CSS state, not only React's aria-expanded state.
                await page.waitForFunction(() => {
                  const sidebar = document.querySelector('.ipad-nav__sidebar');
                  if (!sidebar) return false;
                  const style = getComputedStyle(sidebar);
                  const rect = sidebar.getBoundingClientRect();
                  return style.display !== 'none' && style.visibility === 'visible' && rect.width > 0;
                }, undefined, { timeout: 1200 }).catch(() => {});
                sidebarInteraction.edgeSwipeOpened = await page.locator('.ipad-nav__sidebar.is-open').isVisible();
                if (sidebarInteraction.edgeSwipeOpened) {
                  await touchSession.send('Input.dispatchTouchEvent', { type: 'touchStart', touchPoints: [{ x: 220, y: 260, id: 1, force: 1 }] });
                  await touchSession.send('Input.dispatchTouchEvent', { type: 'touchMove', touchPoints: [{ x: 120, y: 260, id: 1, force: 1 }] });
                  await touchSession.send('Input.dispatchTouchEvent', { type: 'touchMove', touchPoints: [{ x: 32, y: 260, id: 1, force: 1 }] });
                  await touchSession.send('Input.dispatchTouchEvent', { type: 'touchEnd', touchPoints: [] });
                  await page.waitForFunction(() => document.querySelector('.ipad-nav__menu-button')?.getAttribute('aria-expanded') === 'false', undefined, { timeout: 5000 });
                  sidebarInteraction.edgeSwipeClosed = await page.locator('.ipad-nav__sidebar.is-open').count() === 0;
                } else {
                  sidebarInteraction.edgeSwipeClosed = false;
                  sidebarInteraction.closeSkippedBecauseOpenFailed = true;
                }
              } finally {
                await touchSession.detach();
                sidebarInteraction.diagnostics.trace = await page.evaluate(() => window.__ipadTouchTrace ?? []);
                sidebarInteraction.diagnostics.finalState = await page.evaluate(() => ({
                  expanded: document.querySelector('.ipad-nav__menu-button')?.getAttribute('aria-expanded') ?? null,
                  sidebarClass: document.querySelector('.ipad-nav__sidebar')?.className ?? null,
                  sidebarVisible: Boolean(document.querySelector('.ipad-nav__sidebar')?.getBoundingClientRect().width &&
                    getComputedStyle(document.querySelector('.ipad-nav__sidebar')).visibility === 'visible' &&
                    getComputedStyle(document.querySelector('.ipad-nav__sidebar')).display !== 'none'),
                  computedStyle: (() => {
                    const sidebar = document.querySelector('.ipad-nav__sidebar');
                    if (!sidebar) return null;
                    const style = getComputedStyle(sidebar);
                    const rect = sidebar.getBoundingClientRect();
                    return {
                      position: style.position,
                      display: style.display,
                      visibility: style.visibility,
                      width: style.width,
                      rectWidth: rect.width,
                      transform: style.transform,
                      transitionProperty: style.transitionProperty,
                      transitionDuration: style.transitionDuration,
                    };
                  })(),
                  dragging: document.querySelector('.ipad-edition')?.getAttribute('data-ipad-sidebar-dragging') ?? null,
                }));
              }
              sidebarInteractionPassed = sidebarInteraction.opened && sidebarInteraction.escapeClosed &&
                sidebarInteraction.scrimClosed && sidebarInteraction.edgeSwipeOpened && sidebarInteraction.edgeSwipeClosed;
            } catch (error) {
              sidebarInteraction.error = String(error);
              sidebarInteractionPassed = false;
              console.error('Sidebar interaction audit failed for ' + viewport.name + '-' + colorScheme + ': ' + String(error));
            }
            // Always restore the page to its neutral state before capturing the visual baseline.
            // A failed gesture must not leave the sidebar/scrim covering the screenshot.
            await page.evaluate(() => {
              const button = document.querySelector('.ipad-nav__menu-button');
              if (button?.getAttribute('aria-expanded') === 'true') button.click();
            });
            await page.waitForFunction(() => document.querySelector('.ipad-nav__menu-button')?.getAttribute('aria-expanded') === 'false', undefined, { timeout: 5000 });
            await page.evaluate(() => window.scrollTo({ top: 0, behavior: 'instant' }));
            await page.waitForTimeout(180);
            // Wait for real homepage content before inspecting all poster-bearing cards.
                const homepageReadiness = await page.waitForFunction(() => {
                  const busyRail = document.querySelector('.ipad-edition__poster-grid[aria-busy="true"]');
                  const heroTitle = document.querySelector('.ipad-edition__cinema-hero-copy h1')?.textContent ?? '';
                  const animeLoading = (document.querySelector('#ipad-anime-calendar')?.textContent ?? '').includes('正在读取每日放送');
                  return !busyRail && !animeLoading && !heroTitle.includes('正在为你准备影院');
                }, undefined, { timeout: 30000 })
                  .then(() => ({ ready: true, timeoutMs: 30000 }))
                  .catch(error => ({ ready: false, timeoutMs: 30000, error: String(error) }));
                // Re-assert the requested theme after application hydration has completed.
                await page.evaluate((scheme) => {
                  document.documentElement.classList.toggle('dark', scheme === 'dark');
                  document.documentElement.style.colorScheme = scheme;
                }, colorScheme);
                // Include movie, series, new-release and anime slots. A missing SmartImage
                // element is still a failed poster slot and must remain in the denominator.
                await page.evaluate(async () => {
                  const slots = Array.from(document.querySelectorAll('[data-ipad-poster-slot]'));
                  const images = slots.map(slot => slot.querySelector('img')).filter(Boolean);
                  const waitForImage = (image) => new Promise(resolve => {
                    if (image.complete) return resolve();
                    const finish = () => resolve();
                    image.addEventListener('load', finish, { once: true });
                    image.addEventListener('error', finish, { once: true });
                    image.loading = 'eager';
                    if (image.complete) finish();
                  });
                  await Promise.race([
                    Promise.all(images.map(waitForImage)),
                    new Promise(resolve => setTimeout(resolve, 45000)),
                  ]);
                });
                await page.locator('section[aria-label="iPad 页面布局诊断"] pre').waitFor({ state: "attached", timeout: 10000 });
                await page.waitForTimeout(1000);
                const layoutDiagnostics = await page.evaluate(() => {
                  const panel = document.querySelector('section[aria-label="iPad 页面布局诊断"]');
