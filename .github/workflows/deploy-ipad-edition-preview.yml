                        effectiveOpacity *= Number.parseFloat(getComputedStyle(node).opacity || "1");
                      }
                      return style.visibility === "hidden" && effectiveOpacity <= 0.05 &&
                        style.pointerEvents === "none";
                    };
                    return Boolean(shell?.classList.contains("cinema-controls-hidden") &&
                      hidden(info) && hidden(progress));
                  }, undefined, { timeout: 7000, polling: 50 });
                  autoHideReached = true;
                } catch {
                  // Capture the actual timer/scrub/media state below so a failed
                  // auto-hide assertion diagnoses the cause instead of aborting
                  // before the remaining touch/fullscreen regression checks run.
                }
                const autoHideDiagnostics = await page.evaluate(() => {
                  const shell = document.querySelector(".netflix-watch-shell");
                  const video = document.querySelector(".netflix-player-frame video");
                  const info = document.querySelector(".watch-cinema-info");
                  const progress = document.querySelector(".watch-cinema-progress");
                  const snapshot = element => {
                    if (!element) return null;
                    const style = getComputedStyle(element);
                    return { opacity: style.opacity, visibility: style.visibility,
                      pointerEvents: style.pointerEvents, rect: element.getBoundingClientRect().toJSON() };
                  };
                  return {
                    shellClass: shell?.className ?? null,
                    scrubClass: shell?.classList.contains("cinema-controls-scrubbing") ?? null,
                    debug: shell?.dataset.controlsHideDebug ?? null,
                    video: video ? { paused: video.paused, ended: video.ended, currentTime: video.currentTime } : null,
                    info: snapshot(info), progress: snapshot(progress),
                  };
                });
                console.log(JSON.stringify({ name: viewport.name + "-" + colorScheme + "-auto-hide-state",
                  autoHideReached, autoHideDiagnostics }));
                if (!autoHideReached) failures += 1;
                const fullyHiddenPlaybackChrome = await page.evaluate(() => {
                  const selectors = [".watch-topbar", ".cinema-center-controls", ".watch-cinema-info",
                    ".watch-cinema-progress", ".cinema-v4-actions"];
                  return Object.fromEntries(selectors.map(selector => {
                    const node = document.querySelector(selector);
                    const style = node ? getComputedStyle(node) : null;
                    let effectiveOpacity = 1;
                    for (let ancestor = node; ancestor instanceof HTMLElement; ancestor = ancestor.parentElement) {
                      effectiveOpacity *= Number.parseFloat(getComputedStyle(ancestor).opacity || "1");
                    }
                    return [selector, style ? { opacity: Number(style.opacity), effectiveOpacity, visibility: style.visibility,
                      pointerEvents: style.pointerEvents } : null];
                  }));
                });
                const qualityPanelClosed = await page.locator(".cinema-v4-quality-panel, .player-quality-controls").count() === 0;
                const hiddenChromePassed = qualityPanelClosed && Object.values(fullyHiddenPlaybackChrome).every(state =>
                  state && state.visibility === "hidden" && state.effectiveOpacity <= 0.05 && state.pointerEvents === "none"
                );
                console.log(JSON.stringify({ name: viewport.name + "-" + colorScheme + "-auto-hide", hiddenChromePassed, fullyHiddenPlaybackChrome }));
                if (!hiddenChromePassed) failures += 1;

                if (!autoHideReached) {
                  // Keep the independent touch-reveal/toggle checks meaningful
                  // even when the timer assertion fails: seed the expected hidden
                  // visual state, while preserving the failure above.
                  await page.evaluate(() => document.querySelector(".netflix-watch-shell")?.classList.add("cinema-controls-hidden"));
                }
                const frameRect = await page.locator(".netflix-player-frame").boundingBox();
                if (!frameRect) throw new Error("Player frame has no touchable bounds.");
                const touchX = frameRect.x + Math.max(28, frameRect.width * 0.12);
                const touchY = frameRect.y + Math.max(28, frameRect.height * 0.18);
                await page.touchscreen.tap(touchX, touchY);
                await page.waitForFunction(() => {
                  const shell = document.querySelector(".netflix-watch-shell");
                  const info = document.querySelector(".watch-cinema-info");
                  return Boolean(shell && !shell.classList.contains("cinema-controls-hidden") &&
                    info && getComputedStyle(info).visibility === "visible" &&
                    Number(getComputedStyle(info).opacity) > 0.95);
                }, undefined, { timeout: 5000 });
                const touchRevealPassed = !(await page.locator(".netflix-watch-shell").evaluate(node =>
                  node.classList.contains("cinema-controls-hidden")
                ));
                console.log(JSON.stringify({ name: viewport.name + "-" + colorScheme + "-touch-reveal", touchRevealPassed }));
                if (!touchRevealPassed) failures += 1;

                // A second tap on the empty video surface explicitly dismisses
                // the visible controls; a third tap must reveal them again.
                await page.touchscreen.tap(touchX, touchY);
                await page.waitForFunction(() => document.querySelector(".netflix-watch-shell")?.classList.contains("cinema-controls-hidden"), undefined, { timeout: 3000 });
                await page.touchscreen.tap(touchX, touchY);
                await page.waitForFunction(() => !document.querySelector(".netflix-watch-shell")?.classList.contains("cinema-controls-hidden"), undefined, { timeout: 3000 });
                const touchTogglePassed = await page.locator(".netflix-watch-shell").evaluate(node =>
                  !node.classList.contains("cinema-controls-hidden")
                );
                console.log(JSON.stringify({ name: viewport.name + "-" + colorScheme + "-touch-toggle", touchTogglePassed }));
                if (!touchTogglePassed) failures += 1;

                // The topbar button and F shortcut must both request fullscreen
                // on the watch shell, never only on the ArtPlayer/video child.
                await page.evaluate(() => {
                  const shell = document.querySelector(".netflix-watch-shell");
                  if (!shell) throw new Error("Watch shell is missing for fullscreen test.");
                  window.__shellFullscreenRequests = 0;
                  Object.defineProperty(shell, "requestFullscreen", {
                    configurable: true,
                    value: () => {
                      window.__shellFullscreenRequests += 1;
                      return Promise.resolve();
                    },
                  });
                });
                await page.locator('.cinema-v4-actions button:has-text("全屏")').click();
                await page.waitForFunction(() => window.__shellFullscreenRequests === 1, undefined, { timeout: 3000 });
                await page.evaluate(() => document.activeElement instanceof HTMLElement && document.activeElement.blur());
                await page.keyboard.press("f");
                await page.waitForFunction(() => window.__shellFullscreenRequests === 2, undefined, { timeout: 3000 });
                const unifiedFullscreenEntrypoints = await page.evaluate(() => window.__shellFullscreenRequests === 2);
                console.log(JSON.stringify({ name: viewport.name + "-" + colorScheme + "-unified-fullscreen-entrypoints", unifiedFullscreenEntrypoints }));
                if (!unifiedFullscreenEntrypoints) failures += 1;

                // Regression: a second real pointer drag must unlock without
                // creating a stale scrub lock after the synthesized click.
                const scrubControl = page.locator(".watch-cinema-progress");
                const scrubRect = await scrubControl.boundingBox();
                if (!scrubRect) throw new Error("Seek surface missing in repeated-drag test.");
                await page.mouse.move(scrubRect.x + scrubRect.width * 0.33, scrubRect.y + scrubRect.height / 2);
                await page.mouse.down();
                await page.waitForFunction(() =>
                  document.querySelector(".netflix-watch-shell")?.classList.contains("cinema-controls-scrubbing"),
                  undefined, { timeout: 5000 });
                const scrubPreviewVisibleDuringDrag = await page.locator(".watch-cinema-scrub-preview").isVisible();
                await page.mouse.move(scrubRect.x + scrubRect.width * 0.42, scrubRect.y + scrubRect.height / 2, { steps: 6 });
                await page.mouse.up();
                await page.waitForFunction(() =>
                  !document.querySelector(".netflix-watch-shell")?.classList.contains("cinema-controls-scrubbing"),
                  undefined, { timeout: 5000 });
                const scrubStateAfterRelease = await page.evaluate(() => ({
                  locked: Boolean(document.querySelector(".netflix-watch-shell")?.classList.contains("cinema-controls-scrubbing")),
                  controlsVisible: !document.querySelector(".netflix-watch-shell")?.classList.contains("cinema-controls-hidden"),
                }));
                const scrubInteraction = {
                  previewVisibleDuringDrag: scrubPreviewVisibleDuringDrag,
                  unlockedAfterRelease: !scrubStateAfterRelease.locked,
                  controlsRemainVisibleAfterClick: scrubStateAfterRelease.controlsVisible,
                };
                console.log(JSON.stringify({ name: viewport.name + "-" + colorScheme + "-scrub-interaction", scrubInteraction }));
                if (!Object.values(scrubInteraction).every(Boolean)) failures += 1;

                for (const panelState of ["closed", "open"]) {
                  if (panelState === "open") {
                    await page.locator(".cinema-v4-source-control").click();
                    await page.locator(".netflix-watch-utility-panel.is-open").waitFor({ state: "visible", timeout: 10000 });
                    // Measure the settled panel, including both fading control groups.
                    await page.waitForFunction(() =>
                      [".cinema-center-controls", ".watch-cinema-info"].every(selector => {
                        const node = document.querySelector(selector);
                        return node && Number(getComputedStyle(node).opacity) <= 0.01;
                      }), undefined, { timeout: 3000 });
                  } else {
                    await page.locator(".netflix-watch-utility-panel").waitFor({ state: "attached", timeout: 10000 });
                  }
                  await page.evaluate(() => new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve))));
                  const metrics = await page.evaluate((expectedPanelState) => {
                    const selectors = {
                      shell: ".netflix-watch-shell",
                      topbar: ".netflix-watch-overlay-topbar",
                      sourceControls: ".netflix-watch-utility-panel .netflix-source-card",
                      qualityControls: ".netflix-player-frame .cinema-v4-quality-panel",
                      frame: ".netflix-player-frame",
                      player: ".netflix-player-frame .artplayer, .netflix-player-frame .art-video-player",
                      video: ".netflix-player-frame video",
                      centerControls: ".cinema-center-controls",
                      info: ".watch-cinema-info",
                      utilityPanel: ".netflix-watch-utility-panel",
                      panelClose: ".netflix-watch-panel-heading button",
                      panelScrim: ".netflix-watch-panel-scrim",
                    };
                    const element = selector => document.querySelector(selector);
                    const rect = node => {
                      if (!node) return null;
                      const r = node.getBoundingClientRect();
                      return { x: Math.round(r.x), y: Math.round(r.y), right: Math.round(r.right), bottom: Math.round(r.bottom), width: Math.round(r.width), height: Math.round(r.height) };
                    };
                    const visible = node => {
                      if (!node) return false;
                      const style = getComputedStyle(node);
                      const r = node.getBoundingClientRect();
                      return style.display !== "none" && style.visibility !== "hidden" && Number(style.opacity) > 0.01 && r.width > 0 && r.height > 0;
                    };
                    const intersects = (a,b) => Boolean(a && b && a.x < b.right && a.right > b.x && a.y < b.bottom && a.bottom > b.y);
                    const nodes = Object.fromEntries(Object.entries(selectors).map(([key,selector]) => [key,element(selector)]));
                    const boxes = Object.fromEntries(Object.entries(nodes).map(([key,node]) => [key,rect(node)]));
                    const styles = Object.fromEntries(["topbar","centerControls","info","utilityPanel"].map(key => {
                      const node = nodes[key];
                      const style = node ? getComputedStyle(node) : null;
                      return [key, style ? { position: style.position, zIndex: style.zIndex, display: style.display, visibility: style.visibility, opacity: style.opacity } : null];
                    }));
                    const video = nodes.video;
                    const videoRect = rect(video);
                    const frame = boxes.frame;
                    const within = (inner,outer) => Boolean(inner && outer && inner.x >= outer.x - 1 && inner.y >= outer.y - 1 && inner.right <= outer.right + 1 && inner.bottom <= outer.bottom + 1);
                    const panelOpen = expectedPanelState === "open";
                    return {
                      viewport: { width: innerWidth, height: innerHeight },
                      boxes,
                      styles,
                      visibility: Object.fromEntries(Object.entries(nodes).map(([key,node]) => [key,visible(node)])),
                      overlaps: {
                        infoWithCenterControls: intersects(boxes.info,boxes.centerControls),
                        topbarWithInfo: intersects(boxes.topbar,boxes.info),
                        topbarWithSourceControls: intersects(boxes.topbar,boxes.sourceControls),
                      },
                      videoWithinFrame: video ? within(videoRect,frame) : null,
                      frameCoversViewport: Boolean(frame && frame.x <= 1 && frame.y <= 1 && frame.right >= innerWidth - 1 && frame.bottom >= innerHeight - 1),
                      infoWithinViewport: within(boxes.info,{x:0,y:0,right:innerWidth,bottom:innerHeight}),
                      topbarWithinViewport: within(boxes.topbar,{x:0,y:0,right:innerWidth,bottom:innerHeight}),
                      panelWithinViewport: panelOpen ? within(boxes.utilityPanel,{x:0,y:0,right:innerWidth,bottom:innerHeight}) : null,
                      panelOpen,
                    };
                  }, panelState);
                  const failed = !response?.ok() ||
                    !metrics.boxes.shell || !metrics.boxes.topbar || !metrics.boxes.frame ||
                    !metrics.boxes.centerControls || !metrics.boxes.info || !metrics.boxes.utilityPanel ||
                    !metrics.frameCoversViewport || !metrics.infoWithinViewport || !metrics.topbarWithinViewport ||
                    metrics.overlaps.infoWithCenterControls || metrics.overlaps.topbarWithInfo ||
                    (metrics.videoWithinFrame === false) ||
                    (panelState === "closed" && (!metrics.visibility.info || !metrics.visibility.centerControls || metrics.visibility.utilityPanel)) ||
                    (panelState === "open" && (!metrics.boxes.sourceControls || metrics.overlaps.topbarWithSourceControls || !metrics.visibility.sourceControls || metrics.visibility.qualityControls || !metrics.visibility.utilityPanel || metrics.visibility.info || metrics.visibility.centerControls || !metrics.visibility.panelClose || !metrics.visibility.panelScrim || !metrics.panelWithinViewport)) ||
                    errors.length > 0;
                  const name = viewport.name + "-" + colorScheme + "-panel-" + panelState;
                  await page.screenshot({
                    path: "artifacts/ipad-visual-audit/player-geometry/" + name + ".png",
                    fullPage: false,
                    animations: "disabled",
                  });
                  results.push({ name, status: response?.status() ?? null, failed, metrics, errors });
                  console.log(JSON.stringify(results.at(-1)));
                  if (failed) failures += 1;
                  if (panelState === "open") {
                    await page.locator(".netflix-watch-panel-heading button").click();
                    await page.waitForFunction(() => !document.querySelector(".netflix-watch-utility-panel")?.classList.contains("is-open"), undefined, { timeout: 5000 });
                    await page.waitForFunction(() => {
                      const panel = document.querySelector('.netflix-watch-utility-panel');
                      const close = panel?.querySelector('.netflix-watch-panel-heading button');
                      if (!panel || panel.classList.contains('is-open')) return false;
                      if (!close) return true;
                      let opacity = 1;
                      for (let node = close; node instanceof HTMLElement; node = node.parentElement) {
                        const style = getComputedStyle(node);
                        if (style.display === 'none' || style.visibility === 'hidden') return true;
                        opacity *= Number.parseFloat(style.opacity || '1');
                      }
                      const rect = close.getBoundingClientRect();
                      return opacity <= 0.01 || rect.width <= 0 || rect.height <= 0;
                    }, undefined, { timeout: 5000, polling: 50 });
                    const closeButtonDismissed = await page.evaluate(() => {
                      const panel = document.querySelector('.netflix-watch-utility-panel');
                      const close = panel?.querySelector('.netflix-watch-panel-heading button');
                      if (!panel || panel.classList.contains('is-open')) return false;
                      if (!close) return true;
                      let opacity = 1;
                      for (let node = close; node instanceof HTMLElement; node = node.parentElement) {
                        const style = getComputedStyle(node);
                        if (style.display === 'none' || style.visibility === 'hidden') return true;
                        opacity *= Number.parseFloat(style.opacity || '1');
                      }
                      const rect = close.getBoundingClientRect();
                      return opacity <= 0.01 || rect.width <= 0 || rect.height <= 0;
                    });
                    if (!closeButtonDismissed) failures += 1;

                    await page.locator(".cinema-v4-source-control").click();
                    await page.locator(".netflix-watch-utility-panel.is-open").waitFor({ state: "visible", timeout: 10000 });
                    // The compact panel can cover the old fixed tap point. Tap the exposed backdrop below it.
                    const scrim = page.locator(".netflix-watch-panel-scrim");
                    const panelBox = await page.locator(".netflix-watch-utility-panel.is-open").boundingBox();
                    const scrimBox = await scrim.boundingBox();
                    if (!panelBox || !scrimBox) throw new Error("Missing open panel or backdrop");
                    const panelBottom = panelBox.y + panelBox.height - scrimBox.y;
                    await scrim.click({ position: { x: scrimBox.width / 2, y: (panelBottom + scrimBox.height) / 2 } });
                    await page.waitForFunction(() => !document.querySelector(".netflix-watch-utility-panel")?.classList.contains("is-open"), undefined, { timeout: 5000 });
                    const scrimDismissed = await page.locator(".netflix-watch-utility-panel").evaluate(node => !node.classList.contains("is-open"));
                    if (!scrimDismissed) failures += 1;
                    console.log(JSON.stringify({ name: name + "-dismissal", closeButtonDismissed, scrimDismissed }));
                  }
                }
                await context.close();
              }
            }
          } finally {
            await browser.close();
            await fs.writeFile(
              "artifacts/ipad-visual-audit/player-geometry/report.json",
              JSON.stringify({ mode: "simulated Chromium; synthetic media fixture; not real iPad Safari", total: results.length, failures, results }, null, 2),
            );
          }
          if (failures) process.exitCode = 1;
          NODE
      - name: TestSprite CLI Preview acceptance (optional)
        if: ${{ !cancelled() && steps.deploy_preview.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 20
        env:
          TESTSPRITE_API_KEY: ${{ secrets.TESTSPRITE_API_KEY }}
          TESTSPRITE_PROJECT_ID: ${{ vars.TESTSPRITE_PROJECT_ID }}
          TESTSPRITE_NO_UPDATE_NOTIFIER: '1'
          TESTSPRITE_NO_TELEMETRY: '1'
        run: |
          set -euo pipefail
          mkdir -p artifacts/ipad-visual-audit
          report=artifacts/ipad-visual-audit/testsprite-status.txt
          echo "NOT RUN — optional TestSprite acceptance" > "$report"
          trap 'cat "$report" >> "$GITHUB_STEP_SUMMARY"' EXIT
          case "${TESTSPRITE_API_KEY:-}" in
            sk-user-*|sk-member-*|tsp_*) ;;
            *)
              echo "::notice title=TestSprite::NOT RUN — missing or invalid optional credential"
              exit 0
              ;;
          esac
          if [ -z "${TESTSPRITE_PROJECT_ID:-}" ]; then
            echo "::notice title=TestSprite::NOT RUN — optional project ID not configured"
            exit 0
          fi
          echo "FAILED OR INCOMPLETE — optional TestSprite acceptance" > "$report"
          npm install -g @testsprite/testsprite-cli@0.17.0
          testsprite setup --from-env --yes
          testsprite ci run --project "$TESTSPRITE_PROJECT_ID" --target-url "https://libretv-ipad-edition-preview.bggdbh.workers.dev" --fail-on-skipped --summary-file artifacts/ipad-visual-audit/testsprite-summary.json
          echo "PASSED — optional TestSprite CLI completed successfully" > "$report"
      - name: Upload iPad visual audit screenshots and report
        if: ${{ always() && steps.install_playwright.outcome == 'success' && steps.install_chromium.outcome == 'success' && steps.deploy_preview.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: ipad-edition-visual-audit
          path: artifacts/ipad-visual-audit/
          if-no-files-found: error
          retention-days: 14

