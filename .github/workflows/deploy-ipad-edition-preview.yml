                  await page.locator(".netflix-player-frame").waitFor({ state: "visible", timeout: 30000 });
                  // The legacy title row is intentionally hidden by Cinema V4.
                  // Validate the actual Cinema V4 heading and playback controls.
                  await page.locator(".ipad-edition-watch .cinema-v4-heading").waitFor({ state: "visible", timeout: 30000 });
                  await page.locator(".watch-cinema-info").waitFor({ state: "visible", timeout: 30000 });
                  await page.locator(".watch-cinema-progress").waitFor({ state: "visible", timeout: 30000 });
                  // The old UI must not merely be CSS-hidden: it must be absent from the React tree.
                  const oldChromeCount = await page.locator(".netflix-title-row, .netflix-watch-tools, .watch-cinema-rate").count();
                  if (oldChromeCount !== 0) throw new Error("Cinema rendered legacy watch UI: " + oldChromeCount);
                  await page.locator(".cinema-v4-actions").waitFor({ state: "visible", timeout: 30000 });
                  if (await page.locator(".cinema-v4-actions").count() !== 1) throw new Error("Cinema toolbar duplicated");
                }
                const metrics = await page.evaluate((routeName) => {
                  const root = document.querySelector(".ipad-edition");
                  const layoutMode = root?.dataset.ipadLayout ?? 'compact';
                  const sidebarOpen = root?.dataset.ipadSidebarOpen === 'true';
                  const nav = sidebarOpen ? document.querySelector('.ipad-nav__sidebar.is-open') : document.querySelector('.ipad-nav__topbar');
                  const skeletonCount = document.querySelectorAll(".ipad-edition__poster-skeleton").length;
                  const collection = document.querySelector(".ipad-edition__collection-grid");
                  const emptyMessage = document.querySelector(".ipad-edition__rail-message");
                  return {
                    rootPresent: Boolean(root),
                    rootEnvironment: root?.dataset.environment ?? null,
                    documentWidth: document.documentElement.scrollWidth,
                    viewportWidth: document.documentElement.clientWidth,
                    contentTextLength: (root?.textContent ?? "").trim().length,
                    hasNavigationChrome: Boolean(nav),
                    navigationMode: root?.dataset.ipadLayout ?? 'compact',
                    loadingSkeletonCount: skeletonCount,
                    collectionItemCount: collection?.children.length ?? 0,
                    hasTerminalCollectionState: Boolean(collection || emptyMessage),
                    hasDetailTitle: Boolean(document.querySelector(".ipad-cinema-hero h1")),
                    detailArtwork: (() => {
                      const hero = document.querySelector(".ipad-cinema-hero");
                      const image = hero?.querySelector(".ipad-cinema-hero__poster, .ipad-cinema-hero__image");
                      if (!hero || !image) return { present: false, coversHero: false, naturalWidth: 0 };
                      const heroRect = hero.getBoundingClientRect();
                      const imageRect = image.getBoundingClientRect();
                      return {
                        present: image.getClientRects().length > 0 && imageRect.width > 0 && imageRect.height > 0,
                        coversHero: imageRect.left <= heroRect.left + 1 && imageRect.top <= heroRect.top + 1 &&
                          imageRect.right >= heroRect.right - 1 && imageRect.bottom >= heroRect.bottom - 1,
                        naturalWidth: image.naturalWidth || 0,
                        naturalHeight: image.naturalHeight || 0,
