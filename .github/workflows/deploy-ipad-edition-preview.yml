                      colorBuckets.add([red >> 4, green >> 4, blue >> 4].join(","));
                      samples += 1;
                    }
                  }
                  const meanLuminance = samples ? sum / samples : 0;
                  const variance = samples ? Math.max(0, sumSquares / samples - meanLuminance ** 2) : 0;
                  const standardDeviation = Math.sqrt(variance);
                  const nearBlackRatio = samples ? darkPixels / samples : 1;
                  const blankBlack = samples === 0 ||
                    (meanLuminance < 8 && standardDeviation < 4 && nearBlackRatio > 0.995);
                  posterPixelChecks.push({
                    index: item.index,
                    slotType: item.slotType,
                    inspected: samples > 0,
                    width: Math.max(0, right - left),
                    height: Math.max(0, bottom - top),
                    meanLuminance: Number(meanLuminance.toFixed(2)),
                    luminanceStdDev: Number(standardDeviation.toFixed(2)),
                    nearBlackRatio: Number(nearBlackRatio.toFixed(4)),
                    colorBucketCount: colorBuckets.size,
                    blankBlack,
                    naturalWidth: item.naturalWidth,
                    naturalHeight: item.naturalHeight,
                    complete: item.complete,
                    source: item.source,
                  });
                }
                metrics.posterPixelInspectionSource = "per-poster-viewport-composited-screenshot";
                metrics.posterInspectionBudgetMs = posterInspectionBudgetMs;
                metrics.posterInspectionDurationMs = Date.now() - posterInspectionStartedAt;
                metrics.posterInspectionBudgetExceeded = posterInspectionBudgetExceeded;
                metrics.posterPixelChecks = posterPixelChecks;
                metrics.posterPixelInspectionUnavailableCount = posterPixelChecks.filter(item => !item.inspected).length;
                metrics.blankBlackPosterCount = posterPixelChecks.filter(item => item.blankBlack).length;
                metrics.posterPixelInspectionPassed = posterPixelChecks.length === metrics.posterSlotCount &&
                  metrics.posterPixelInspectionUnavailableCount === 0 && metrics.blankBlackPosterCount === 0;

                // Audit the real viewport, not a stitched full-page capture. Chromium can
                // reposition fixed elements while stitching a fullPage screenshot, making
                // the top navigation appear over unrelated poster rows even though its
                // measured viewport position is correct.
                await page.locator("#ipad-popular-series").scrollIntoViewIfNeeded();
                await page.evaluate(() => new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve))));
                const scrollAudit = await page.evaluate(() => {
                  const nav = document.querySelector(".ipad-nav__topbar")?.getBoundingClientRect();
                  const labels = Array.from(document.querySelectorAll("#ipad-popular-series .ipad-edition__poster-card strong, #ipad-popular-series .ipad-edition__poster-card small"));
                  const visibleLabels = labels.map((element) => {
                    const rect = element.getBoundingClientRect();
                    const visible = rect.width > 0 && rect.height > 0 && rect.bottom > 0 && rect.top < window.innerHeight;
                    const overlapsNavigation = Boolean(nav && visible && nav.left < rect.right && nav.right > rect.left && nav.top < rect.bottom && nav.bottom > rect.top);
                    return { text: element.textContent?.trim() ?? "", top: Math.round(rect.top), bottom: Math.round(rect.bottom), visible, overlapsNavigation };
                  });
                  return {
                    scrollY: Math.round(window.scrollY),
                    navigationTop: nav ? Math.round(nav.top) : null,
                    navigationBottom: nav ? Math.round(nav.bottom) : null,
                    visiblePosterLabels: visibleLabels.filter(item => item.visible).length,
                    overlappingPosterLabels: visibleLabels.filter(item => item.overlapsNavigation),
                    navigationViewportValid: Boolean(nav && nav.top >= 0 && nav.bottom <= window.innerHeight),
                  };
                });
                metrics.scrollAudit = scrollAudit;
                const name = viewport.name + "-" + colorScheme;
                await page.evaluate(() => window.scrollTo(0, 0));
                await page.evaluate(() => new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve))));
                await page.screenshot({ path: "artifacts/ipad-visual-audit/" + name + ".png", fullPage: false, animations: "disabled" });
                const failed = !sidebarInteractionPassed || sidebarInteraction.diagnostics.finalState?.computedStyle?.position !== "fixed" || response?.ok() !== true || metrics.horizontalOverflow || !metrics.shell || !metrics.main || metrics.main.y > 220 || metrics.main.width < viewport.width * 0.7 || !homepageReadiness.ready || metrics.homepageStillLoading || metrics.animeCalendarStillLoading || metrics.posterCount < 1 || metrics.posterSlotCount < 1 || metrics.posterImageLoadRate < 0.75 || !metrics.posterPixelInspectionPassed || !metrics.heroPosterResolution?.loaded || !metrics.heroPosterResolution.meets1200px || metrics.heroTextOverlapsNavigation || metrics.heroOverlapsNavigation || !Number.isFinite(metrics.heroClearancePx) || metrics.heroClearancePx < 8 || metrics.heroCtaWhiteSpace !== "nowrap" || (viewport.width >= 700 && Math.abs(metrics.heroContentCenterOffsetPx ?? Infinity) > (metrics.hero?.height ?? 0) * 0.12) || metrics.heroClearancePx > 144 || !metrics.hero || metrics.hero.y < 0 || metrics.hero.y > Math.min(160, viewport.height * 0.25) || !metrics.themePairValid || !scrollAudit.navigationViewportValid || scrollAudit.overlappingPosterLabels.length > 0;
                if (failed) failures += 1;
                await Promise.allSettled(apiDiagnosticTasks);
                results.push({ name, httpStatus: response?.status() ?? null, failed, sidebarInteractionPassed, sidebarInteraction, metrics, pageErrors: consoleErrors, apiDiagnostics });
                console.log(JSON.stringify(results.at(-1)));
                await context.close();
              }
            }
          } catch (error) {
            failures += 1;
            results.push({ fatalError: String(error), completedViewportThemePairs: results.length });
            console.error("Fatal iPad visual audit error:", error);
          } finally {
            await browser.close();
            await fs.writeFile("artifacts/ipad-visual-audit/report.json", JSON.stringify({
              target,
              mode: "simulated Chromium viewport audit; not real iPad Safari",
              total: results.length,
              failures,
              fatalError: failures && results.at(-1)?.fatalError ? results.at(-1).fatalError : null,
              results,
            }, null, 2));
          }
          if (failures) process.exitCode = 1;
          NODE
      - name: Verify clean Preview URL without layout debug parameter
        timeout-minutes: 8
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const url = "https://libretv-ipad-edition-preview.bggdbh.workers.dev/ipad-edition";
          const browser = await chromium.launch({ headless: true });
          const results = [];
          try {
            for (const colorScheme of ["light", "dark"]) {
              const context = await browser.newContext({
                viewport: { width: 1194, height: 834 },
                deviceScaleFactor: 2,
                isMobile: true,
                hasTouch: true,
                colorScheme,
              });
              const page = await context.newPage();
              const errors = [];
              page.on("pageerror", error => errors.push(error.message));
              const response = await page.goto(url, { waitUntil: "domcontentloaded", timeout: 60000 });
              await page.locator('[data-ipad-edition="true"]').waitFor({ state: "attached", timeout: 30000 });
              await page.locator(".ipad-edition__cinema-hero").waitFor({ state: "visible", timeout: 30000 });
              await page.locator(".ipad-nav__topbar").waitFor({ state: "visible", timeout: 30000 });
              // The environment engine attaches its data attributes in a client effect.
              // Wait for the requested scheme before asserting clean-URL theme readiness.
              await page.waitForFunction(
                (scheme) => document.querySelector(".ipad-edition")?.getAttribute("data-environment") === scheme,
                colorScheme,
                { timeout: 15000 },
              );
              const metrics = await page.evaluate(() => ({
                hasDebugOverlay: Boolean(document.querySelector('[aria-label="iPad 页面布局诊断"]')),
                hasDebugQuery: new URLSearchParams(location.search).has("__layout_debug"),
                rootEnvironment: document.querySelector(".ipad-edition")?.dataset.environment ?? null,
                viewportWidth: document.documentElement.clientWidth,
                documentWidth: document.documentElement.scrollWidth,
                heroWidth: Math.round(document.querySelector(".ipad-edition__cinema-hero")?.getBoundingClientRect().width ?? 0),
              }));
              const failed = !response?.ok() || metrics.hasDebugOverlay || metrics.hasDebugQuery ||
                metrics.rootEnvironment !== colorScheme || metrics.documentWidth > metrics.viewportWidth + 1 ||
                metrics.heroWidth < metrics.viewportWidth * 0.7 || errors.length > 0;
              results.push({ colorScheme, status: response?.status() ?? null, failed, metrics, errors });
              console.log(JSON.stringify(results.at(-1)));
              await context.close();
              if (failed) throw new Error("Clean Preview audit failed for " + colorScheme);
            }
          } finally {
            await browser.close();
          }
          NODE
      - name: Capture iPad subpage visual baselines
        timeout-minutes: 12
        run: |
          mkdir -p artifacts/ipad-visual-audit/subpages
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs/promises';

          const base = "https://libretv-ipad-edition-preview.bggdbh.workers.dev";
          const routes = [
            { name: "search", path: "/ipad-edition/search", chrome: true, heading: true },
            { name: "movies", path: "/ipad-edition/movies", chrome: true, heading: true },
            { name: "series", path: "/ipad-edition/series", chrome: true, heading: true },
            { name: "anime", path: "/ipad-edition/anime", chrome: true, heading: true },
            { name: "detail", path: "/ipad-edition/detail?source=friday-cms&id=ipad-preview-fixture&title=iPad%20Preview%20%E6%A0%B7%E7%89%87&sourceUrl=https%3A%2F%2Fpreview.invalid%2Fapi.php%2Fprovide%2Fvod", chrome: true, heading: false },
            { name: "watch", path: "/ipad-edition/watch?source=friday-cms&id=ipad-preview-fixture&index=0&title=iPad%20Preview%20%E6%A0%B7%E7%89%87&sourceUrl=https%3A%2F%2Fpreview.invalid%2Fapi.php%2Fprovide%2Fvod", chrome: false, heading: false },
          ];
          const browser = await chromium.launch({ headless: true });
          const results = [];
          try {
            for (const route of routes) {
              for (const colorScheme of ["light", "dark"]) {
                const context = await browser.newContext({
                  viewport: { width: 1194, height: 834 },
                  deviceScaleFactor: 2,
                  isMobile: true,
                  hasTouch: true,
                  colorScheme,
                });
                const page = await context.newPage();
                const errors = [];
                page.on("pageerror", error => errors.push(error.message));
                // Use deterministic, clearly synthetic CMS data so detail/player baselines
                // exercise real page content without depending on third-party source uptime.
                if (["detail", "watch"].includes(route.name)) {
                  const fixtureDetail = {
                    episodes: ["https://media.preview.invalid/fixture.mp4"],
                    episodeItems: [{ title: "预览播放条目", url: "https://media.preview.invalid/fixture.mp4", duration: "00:30" }],
                    videoInfo: {
                      title: "iPad Preview 样片",
                      desc: "用于 iPad Edition 详情页与播放页视觉验收的合成测试数据，不代表真实片源。",
                      typeName: "电视剧",
                      year: "2026",
                      area: "测试环境",
                      sourceKey: "friday-cms",
                      sourceName: "Preview Fixture",
                      sourceUrl: "https://preview.invalid/api.php/provide/vod",
                    },
                  };
                  await page.route("**/api/status", route => route.fulfill({
                    status: 200,
                    contentType: "application/json",
                    body: JSON.stringify({
                      passwordRequired: false, verified: true, version: "ipad-preview-fixture",
                      defaultSources: [], defaultLiveSources: [], defaultSubscriptions: [],
                      defaultRecommendSource: null, defaultImageMode: "direct",
                    }),
                  }));
                  await page.route("**/api/detail?*", route => route.fulfill({
                    status: 200,
                    contentType: "application/json",
                    body: JSON.stringify(fixtureDetail),
                  }));
                  await page.route("https://media.preview.invalid/**", route => route.fulfill({
                    status: 200, contentType: "video/mp4", body: Buffer.alloc(0),
                  }));
                }
                await page.addInitScript((scheme) => {
                  const apply = () => {
                    document.documentElement.classList.toggle("dark", scheme === "dark");
                    document.documentElement.style.colorScheme = scheme;
                  };
                  if (document.documentElement) apply();
                  else document.addEventListener("DOMContentLoaded", apply, { once: true });
                }, colorScheme);
                const response = await page.goto(base + route.path, { waitUntil: "domcontentloaded", timeout: 60000 });
                await page.locator('[data-ipad-edition="true"]').waitFor({ state: "attached", timeout: 30000 });
                await page.waitForFunction(
                  (scheme) => document.querySelector(".ipad-edition")?.getAttribute("data-environment") === scheme,
                  colorScheme,
                  { timeout: 30000 },
                );
                if (route.heading) {
                  await page.locator(".ipad-edition__page-heading h1").waitFor({ state: "visible", timeout: 30000 });
                }
                // Collection pages must reach a terminal data state before a screenshot is accepted.
                // A heading alone can appear while the grid is still showing loading skeletons.
                if (["movies", "series", "anime"].includes(route.name)) {
                  await page.waitForFunction(() => {
                    const skeletons = document.querySelectorAll(".ipad-edition__poster-skeleton").length;
                    const content = document.querySelector(".ipad-edition__collection-grid");
                    const message = document.querySelector(".ipad-edition__rail-message");
                    return skeletons === 0 && Boolean(content || message);
                  }, undefined, { timeout: 30000 });
                }
                // The player route hides the global chrome; the detail route keeps the iPad shell navigation.
                // Detail and player screenshots below use deterministic mocked CMS data so their actual
                // content layouts are exercised without depending on a live third-party source.
                if (route.name === "detail") {
                  await page.locator(".movie-detail-title").waitFor({ state: "visible", timeout: 30000 });
                  await page.getByRole("heading", { name: "iPad Preview 样片" }).waitFor({ state: "visible", timeout: 30000 });
                  await page.locator(".movie-episode-card").first().waitFor({ state: "visible", timeout: 30000 });
                }
                if (route.name === "watch") {
                  await page.locator(".netflix-watch").waitFor({ state: "visible", timeout: 30000 });
                  await page.locator(".netflix-player-frame").waitFor({ state: "visible", timeout: 30000 });
                  // The title-row H1 is hidden by the shared page-heading rule; assert the
                  // visible title in the player metadata panel instead.
                  const playerTitle = page.locator(".netflix-watch .watch-cinema-meta h2");
                  await playerTitle.waitFor({ state: "visible", timeout: 30000 });
                  if ((await playerTitle.innerText()).trim() !== "iPad Preview 样片") {
                    throw new Error("Visible player title did not match the mocked CMS fixture.");
                  }
                }
                const metrics = await page.evaluate((routeName) => {
                  const root = document.querySelector(".ipad-edition");
                  const nav = document.querySelector(".ipad-nav__topbar");
                  const skeletonCount = document.querySelectorAll(".ipad-edition__poster-skeleton").length;
                  const collection = document.querySelector(".ipad-edition__collection-grid");
                  const emptyMessage = document.querySelector(".ipad-edition__rail-message");
                  return {
                    rootPresent: Boolean(root),
                    rootEnvironment: root?.dataset.environment ?? null,
                    documentWidth: document.documentElement.scrollWidth,
                    viewportWidth: document.documentElement.clientWidth,
                    contentTextLength: (root?.textContent ?? "").trim().length,
                    hasTopbar: Boolean(nav),
                    loadingSkeletonCount: skeletonCount,
                    collectionItemCount: collection?.children.length ?? 0,
                    hasTerminalCollectionState: Boolean(collection || emptyMessage),
                    hasDetailTitle: Boolean(document.querySelector(".movie-detail-title")),
                    episodeCardCount: document.querySelectorAll(".movie-episode-card").length,
                    hasPlayerFrame: Boolean(document.querySelector(".netflix-player-frame")),
                    hasWatchContent: Boolean(document.querySelector(".netflix-watch")),
                    hasVisiblePlayerTitle: (() => {
                      const title = document.querySelector(".netflix-watch .watch-cinema-meta h2");
                      return Boolean(title && title.getClientRects().length > 0 && getComputedStyle(title).visibility !== "hidden");
                    })(),
                    visiblePlayerTitleText: document.querySelector(".netflix-watch .watch-cinema-meta h2")?.textContent?.trim() ?? null,
                    visualScope: routeName === "detail" ? "full-detail-content-with-mocked-cms-fixture"
                      : routeName === "watch" ? "player-page-with-mocked-cms-fixture"
                      : "page-content",
                  };
                }, route.name);
                const failed = !response?.ok() || !metrics.rootPresent ||
                  metrics.rootEnvironment !== colorScheme ||
                  metrics.documentWidth > metrics.viewportWidth + 1 ||
                  metrics.contentTextLength < 8 ||
                  metrics.hasTopbar !== route.chrome ||
                  (["movies", "series", "anime"].includes(route.name) &&
                    (metrics.loadingSkeletonCount > 0 || !metrics.hasTerminalCollectionState)) ||
                  (route.name === "detail" && (!metrics.hasDetailTitle || metrics.episodeCardCount < 1)) ||
                  (route.name === "watch" && (!metrics.hasPlayerFrame || !metrics.hasWatchContent ||
                    !metrics.hasVisiblePlayerTitle || metrics.visiblePlayerTitleText !== "iPad Preview 样片")) ||
                  errors.length > 0;
                const name = route.name + "-" + colorScheme;
                await page.screenshot({
                  path: "artifacts/ipad-visual-audit/subpages/" + name + ".png",
                  fullPage: false,
                  animations: "disabled",
                });
                results.push({ name, route: route.path, status: response?.status() ?? null, failed, metrics, errors });
                console.log(JSON.stringify(results.at(-1)));
                await context.close();
                if (failed) throw new Error("iPad subpage visual baseline failed: " + name);
              }
            }
          } finally {
            await browser.close();
            await fs.writeFile(
              "artifacts/ipad-visual-audit/subpages/report.json",
              JSON.stringify({ viewport: { width: 1194, height: 834 }, total: results.length, results }, null, 2),
            );
          }
          NODE
      - name: Upload iPad visual audit screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipad-edition-visual-audit
          path: artifacts/ipad-visual-audit/
          if-no-files-found: error
          retention-days: 14

