name: Deploy LibreTV iPad Edition Preview (Ubuntu 24.04)
# Preview-only visual audit activation; never targets the production Worker.
# Poster proxy verification follows the iPad homepage image reliability fix.
# [deploy-ipad-edition-preview] Re-run with corrected poster readiness measurement.

on:
  workflow_dispatch:
    inputs:
      confirm_preview_deploy:
        description: "确认只部署独立 iPad Edition Preview Worker"
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"
  push:
    branches:
      - feature/libretv-ipad-edition-foundation
      - feature/libretv-ipad-edition-product

permissions:
  contents: read

concurrency:
  group: libretv-ipad-edition-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    if: ${{ (github.ref == 'refs/heads/feature/libretv-ipad-edition-foundation' || github.ref == 'refs/heads/feature/libretv-ipad-edition-product') && ((github.event_name == 'workflow_dispatch' && inputs.confirm_preview_deploy == 'yes') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-ipad-edition-preview]'))) }}
    name: Build and deploy isolated iPad Edition Preview
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: preview
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Unit tests
        run: npm test -- --reporter=dot
      - name: Build isolated Worker
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npx opennextjs-cloudflare build
      - name: Verify Preview credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing preview secret: CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing preview secret: CLOUDFLARE_ACCOUNT_ID" && exit 1)
      - name: Deploy dedicated iPad Edition Preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.ipad-edition-preview.toml
      - name: Verify isolated iPad Edition route
        run: |
          node --input-type=module <<'NODE'
          const url = "https://libretv-ipad-edition-preview.bggdbh.workers.dev/ipad-edition";
          let response;
          let lastError = "no response";
          for (let attempt = 1; attempt <= 12; attempt += 1) {
            try {
              response = await fetch(url, { cache: "no-store", redirect: "manual" });
              if (response.ok) break;
              lastError = "HTTP " + response.status;
            } catch (error) {
              lastError = String(error);
            }
            if (attempt < 12) await new Promise(resolve => setTimeout(resolve, 5000));
          }
          if (!response?.ok) throw new Error("iPad Edition Preview did not respond: " + lastError);
          const html = await response.text();
          if (!html.includes("影院大堂") || !html.includes("LibreTV")) {
            throw new Error("Preview returned HTML but did not render the iPad Edition shell.");
          }
          console.log("Dedicated iPad Edition Preview route is reachable and renders the cinema shell.");
          NODE
      - name: Install Playwright package for simulated iPad visual audit
        timeout-minutes: 5
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install Chromium system dependencies
        timeout-minutes: 8
        run: npx playwright install-deps chromium
      - name: Install Playwright Chromium browser
        timeout-minutes: 8
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "120000"
          PLAYWRIGHT_DOWNLOAD_NO_PROGRESS: "1"
        run: npx playwright install chromium
      - name: Run iPad viewport and theme visual audit
        run: |
          mkdir -p artifacts/ipad-visual-audit
          node --input-type=module <<'NODE'
          import { chromium, devices } from 'playwright';
          import fs from 'node:fs/promises';

          const target = "https://libretv-ipad-edition-preview.bggdbh.workers.dev/ipad-edition";
          const viewports = [
            { name: "ipad-11-portrait", width: 834, height: 1194, deviceScaleFactor: 2 },
            { name: "ipad-11-landscape", width: 1194, height: 834, deviceScaleFactor: 2 },
            { name: "ipad-pro-13-portrait", width: 1032, height: 1376, deviceScaleFactor: 2 },
            { name: "ipados-desktop", width: 1366, height: 1024, deviceScaleFactor: 1 },
          ];
          const browser = await chromium.launch({ headless: true });
          const results = [];
          let failures = 0;
          try {
            for (const viewport of viewports) {
              for (const colorScheme of ["light", "dark"]) {
                const context = await browser.newContext({
                  viewport: { width: viewport.width, height: viewport.height },
                  deviceScaleFactor: viewport.deviceScaleFactor,
                  isMobile: viewport.name !== "ipados-desktop",
                  hasTouch: viewport.name !== "ipados-desktop",
                  colorScheme,
                });
                const page = await context.newPage();
                // Force the application theme class, not merely the browser media preference.
                await page.addInitScript((scheme) => {
                  const applyTheme = () => {
                    const root = document.documentElement;
                    if (!root) return;
                    root.classList.toggle('dark', scheme === 'dark');
                    root.style.colorScheme = scheme;
                  };
                  if (document.documentElement) applyTheme();
                  else document.addEventListener('DOMContentLoaded', applyTheme, { once: true });
                }, colorScheme);
                const consoleErrors = [];
                page.on("pageerror", error => consoleErrors.push(error.message));
                const response = await page.goto(target, { waitUntil: "domcontentloaded", timeout: 60000 });
                await page.locator('[data-ipad-edition="true"]').waitFor({ state: "attached", timeout: 30000 });
                await page.locator('.ipad-edition__liquid-glass-host .glass').waitFor({ state: "visible", timeout: 30000 });
                // Wait for real homepage content before inspecting all poster-bearing cards.
                await page.waitForFunction(() => {
                  const busyRail = document.querySelector('.ipad-edition__poster-grid[aria-busy="true"]');
                  const heroTitle = document.querySelector('.ipad-edition__hero-copy h1')?.textContent ?? '';
                  return !busyRail && !heroTitle.includes('正在为你准备影院');
                }, { timeout: 30000 }).catch(() => {});
                // Re-assert the requested theme after application hydration has completed.
                await page.evaluate((scheme) => {
                  document.documentElement.classList.toggle('dark', scheme === 'dark');
                  document.documentElement.style.colorScheme = scheme;
                }, colorScheme);
                // Include movie, series, new-release and anime slots. A missing SmartImage
                // element is still a failed poster slot and must remain in the denominator.
                await page.evaluate(async () => {
                  const slots = Array.from(document.querySelectorAll('[data-ipad-poster-slot]'));
                  const images = slots.map(slot => slot.querySelector('img')).filter(Boolean);
                  const waitForImage = (image) => new Promise(resolve => {
                    if (image.complete) return resolve();
                    const finish = () => resolve();
                    image.addEventListener('load', finish, { once: true });
                    image.addEventListener('error', finish, { once: true });
                    image.loading = 'eager';
                    if (image.complete) finish();
                  });
                  await Promise.race([
                    Promise.all(images.map(waitForImage)),
                    new Promise(resolve => setTimeout(resolve, 45000)),
                  ]);
                });
                const metrics = await page.evaluate((scheme) => {
                  const root = document.querySelector('[data-ipad-edition="true"]');
                  const main = document.querySelector('.ipad-edition__main');
                  const topbar = document.querySelector('.ipad-edition__topbar');
                  const capsule = document.querySelector('.ipad-edition__top-links');
                  const hero = document.querySelector('.ipad-edition__hero');
                  const heroCopy = document.querySelector('.ipad-edition__hero-copy');
                  const rect = element => {
                    if (!element) return null;
                    const r = element.getBoundingClientRect();
                    return { x: Math.round(r.x), y: Math.round(r.y), width: Math.round(r.width), height: Math.round(r.height) };
                  };
                  const luminance = value => {
                    const match = value.match(/rgba?\(([^)]+)\)/);
                    if (!match) return null;
                    const channels = match[1].split(',').slice(0, 3).map(Number);
                    if (channels.length !== 3 || channels.some(Number.isNaN)) return null;
                    const [r, g, b] = channels.map(v => {
                      const c = v / 255;
                      return c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4;
                    });
                    return 0.2126 * r + 0.7152 * g + 0.0722 * b;
                  };
                  const glass = document.querySelector('.ipad-edition__liquid-glass-host .glass');
                  const warp = glass?.querySelector('.glass__warp') ?? null;
                  const glassStyle = glass ? getComputedStyle(glass) : null;
                  const navLink = capsule?.querySelector(':scope > a') ?? null;
                  const activeNavLink = capsule?.querySelector(':scope > a.is-active') ?? navLink;
                  const navStyle = navLink ? getComputedStyle(navLink) : null;
                  const activeNavStyle = activeNavLink ? getComputedStyle(activeNavLink) : null;
                  const icon = navLink?.querySelector('svg') ?? null;
                  const iconStyle = icon ? getComputedStyle(icon) : null;
                  const glassBackground = glassStyle?.backgroundColor ?? '';
                  const navColor = navStyle?.color ?? '';
                  const activeNavColor = activeNavStyle?.color ?? '';
                  const iconStroke = iconStyle?.stroke ?? '';
                  const glassBackgroundLuminance = luminance(glassBackground);
                  const navTextLuminance = luminance(navColor);
                  const activeNavTextLuminance = luminance(activeNavColor);
                  const glassRadius = Number.parseFloat(glassStyle?.borderTopLeftRadius ?? '0');
                  const glassBackdropFilter = glassStyle?.backdropFilter ?? 'none';
                  const glassWebkitBackdropFilter = glassStyle?.webkitBackdropFilter ?? 'none';
                  const theme = {
                    glassPresent: Boolean(glass),
                    glassWarpPresent: Boolean(warp),
                    glassBackground,
                    glassBackgroundLuminance,
                    glassBorder: glassStyle?.borderTopColor ?? '',
                    glassRadius,
                    glassBackdropFilter,
                    glassWebkitBackdropFilter,
                    navColor,
                    navTextLuminance,
                    activeNavColor,
                    activeNavTextLuminance,
                    iconStroke,
                    validForRequestedScheme: scheme === 'light'
                      ? glassBackgroundLuminance !== null && glassBackgroundLuminance > 0.72 &&
                        navTextLuminance !== null && navTextLuminance < 0.3 &&
                        activeNavTextLuminance !== null && activeNavTextLuminance < 0.3
                      : glassBackgroundLuminance !== null && glassBackgroundLuminance < 0.08 &&
                        navTextLuminance !== null && navTextLuminance > 0.7 &&
                        activeNavTextLuminance !== null && activeNavTextLuminance > 0.7,
                    glassBlurValid: /blur\\(/.test(glassBackdropFilter) || /blur\\(/.test(glassWebkitBackdropFilter),
                    glassGeometryValid: glassRadius >= 18 && Boolean(glassStyle?.borderTopColor),
                    iconUsesThemeColor: Boolean(icon && (iconStyle?.stroke === 'currentcolor' || iconStyle?.stroke === navColor)),
                  };
                  const slots = Array.from(document.querySelectorAll('[data-ipad-poster-slot]'));
                  const posterChecks = slots.map(slot => {
                    const image = slot.querySelector('img');
                    const sourceAddress = (slot.getAttribute('data-poster-url') ?? '').trim();
                    if (!image) return { slotType: slot.getAttribute('data-ipad-poster-slot') ?? 'unknown', hasImageElement: false, emptyAddress: !sourceAddress, svgPlaceholder: false, loaded: false, visible: false, pixelVisible: false };
                    const source = image.currentSrc || image.getAttribute('src') || image.src || '';
                    const svgPlaceholder = /^data:image\/svg\+xml/i.test(source);
                    const style = getComputedStyle(image);
                    const box = image.getBoundingClientRect();
                    const visible = box.width > 2 && box.height > 2 && style.display !== 'none' && style.visibility !== 'hidden' && Number(style.opacity) > 0.1;
                    const loaded = image.complete && image.naturalWidth > 0 && image.naturalHeight > 0 && !svgPlaceholder;
                    let pixelVisible = false;
                    if (loaded && visible) {
                      try {
                        const canvas = document.createElement('canvas');
                        canvas.width = 8; canvas.height = 8;
                        const context = canvas.getContext('2d', { willReadFrequently: true });
                        context.drawImage(image, 0, 0, 8, 8);
                        const pixels = context.getImageData(0, 0, 8, 8).data;
                        const samples = new Set();
                        for (let i = 0; i < pixels.length; i += 4) {
                          if (pixels[i + 3] > 8) samples.add(pixels[i] + ',' + pixels[i + 1] + ',' + pixels[i + 2]);
                        }
                        pixelVisible = samples.size > 2;
                      } catch {
                        pixelVisible = false;
                      }
                    }
                    return {
                      slotType: slot.getAttribute('data-ipad-poster-slot') ?? 'unknown',
                      hasImageElement: true, emptyAddress: !sourceAddress, svgPlaceholder,
                      loaded, visible, pixelVisible,
                      naturalWidth: image.naturalWidth, naturalHeight: image.naturalHeight,
                      renderedWidth: Math.round(box.width), renderedHeight: Math.round(box.height),
                      source: source.slice(0, 180),
                    };
                  });
                  const posters = Array.from(document.querySelectorAll('.ipad-edition__poster-card'));
                  const animeCards = Array.from(document.querySelectorAll('.ipad-edition__anime-card'));
                  const top = topbar?.getBoundingClientRect();
                  const copy = heroCopy?.getBoundingClientRect();
                  const heroTextOverlapsNavigation = Boolean(top && copy && top.left < copy.right && top.right > copy.left && top.top < copy.bottom && top.bottom > copy.top);
                  const realLoaded = posterChecks.filter(item => item.loaded && item.visible && item.pixelVisible).length;
                  const posterSlotBreakdown = Object.fromEntries([...new Set(posterChecks.map(item => item.slotType))].map(type => {
                    const matching = posterChecks.filter(item => item.slotType === type);
                    const loaded = matching.filter(item => item.loaded && item.visible && item.pixelVisible).length;
                    return [type, { total: matching.length, realLoaded: loaded, loadRate: matching.length ? Number((loaded / matching.length).toFixed(3)) : 0 }];
                  }));
                  return {
                    viewportWidth: window.innerWidth,
                    documentWidth: document.documentElement.scrollWidth,
                    bodyWidth: document.body.scrollWidth,
                    horizontalOverflow: Math.max(document.documentElement.scrollWidth, document.body.scrollWidth) > window.innerWidth + 2,
                    shell: rect(root), main: rect(main), topbar: rect(topbar), hero: rect(hero), heroCopy: rect(heroCopy),
                    heroTextOverlapsNavigation,
                    homepageStillLoading: Boolean(document.querySelector('.ipad-edition__poster-grid[aria-busy="true"]')) || (document.querySelector('.ipad-edition__hero-copy h1')?.textContent ?? '').includes('正在为你准备影院'),
                    posterCount: posters.length,
                    animeCardCount: animeCards.length,
                    posterSlotCount: posterChecks.length,
                    posterSlotBreakdown,
                    posterImageElementCount: posterChecks.filter(item => item.hasImageElement).length,
                    emptyPosterAddressCount: posterChecks.filter(item => item.emptyAddress).length,
                    missingPosterImageElementCount: posterChecks.filter(item => !item.hasImageElement).length,
                    svgPlaceholderCount: posterChecks.filter(item => item.svgPlaceholder).length,
                    realPosterImagesLoaded: realLoaded,
                    visiblePosterImages: posterChecks.filter(item => item.visible).length,
                    pixelVisiblePosterImages: posterChecks.filter(item => item.pixelVisible).length,
                    pixelInspectionUnavailableCount: posterChecks.filter(item => item.loaded && item.visible && !item.pixelVisible).length,
                    posterImageLoadRate: posterChecks.length ? Number((realLoaded / posterChecks.length).toFixed(3)) : 0,
                    posterChecks,
                    popularHeading: Boolean(document.querySelector('#ipad-popular-movies-title')),
                    theme,
                  };
                }, colorScheme);
                const themeKey = viewport.name;
                const themeBaselines = globalThis.__ipadThemeBaselines ?? (globalThis.__ipadThemeBaselines = {});
                if (colorScheme === 'light') {
                  themeBaselines[themeKey] = metrics.theme;
                  metrics.themePairValid = metrics.theme.validForRequestedScheme;
                } else {
                  const light = themeBaselines[themeKey];
                  metrics.themeDifference = light ? {
                    glassBackgroundChanged: light.glassBackground !== metrics.theme.glassBackground,
                    navigationColorChanged: light.navColor !== metrics.theme.navColor,
                    activeNavigationColorChanged: light.activeNavColor !== metrics.theme.activeNavColor,
                    glassBlurPresentInBothThemes: light.glassBlurValid && metrics.theme.glassBlurValid,
                  } : null;
                  metrics.themePairValid = Boolean(light && light.validForRequestedScheme && metrics.theme.validForRequestedScheme &&
                    light.glassPresent && metrics.theme.glassPresent &&
                    light.glassWarpPresent && metrics.theme.glassWarpPresent &&
                    light.glassBlurValid && metrics.theme.glassBlurValid &&
                    light.glassGeometryValid && metrics.theme.glassGeometryValid &&
                    metrics.themeDifference.glassBackgroundChanged &&
                    metrics.themeDifference.navigationColorChanged &&
                    metrics.themeDifference.activeNavigationColorChanged &&
                    metrics.themeDifference.glassBlurPresentInBothThemes);
                }
                const name = viewport.name + "-" + colorScheme;
                await page.screenshot({ path: "artifacts/ipad-visual-audit/" + name + ".png", fullPage: true, animations: "disabled" });
                const failed = response?.ok() !== true || metrics.horizontalOverflow || !metrics.shell || !metrics.main || metrics.main.width < viewport.width * 0.7 || metrics.homepageStillLoading || metrics.posterCount < 1 || metrics.posterSlotCount < 1 || metrics.posterImageLoadRate < 0.75 || metrics.heroTextOverlapsNavigation || !metrics.themePairValid;
                if (failed) failures += 1;
                results.push({ name, httpStatus: response?.status() ?? null, failed, metrics, pageErrors: consoleErrors });
                console.log(JSON.stringify(results.at(-1)));
                await context.close();
              }
            }
          } finally {
            await browser.close();
          }
          await fs.writeFile("artifacts/ipad-visual-audit/report.json", JSON.stringify({ target, mode: "simulated Chromium viewport audit; not real iPad Safari", total: results.length, failures, results }, null, 2));
          if (failures) process.exitCode = 1;
          NODE
      - name: Upload iPad visual audit screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipad-edition-visual-audit
          path: artifacts/ipad-visual-audit/
          if-no-files-found: warn
          retention-days: 14
