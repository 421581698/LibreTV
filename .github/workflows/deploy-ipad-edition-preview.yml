name: Deploy LibreTV iPad Edition Preview

on:
  workflow_dispatch:
    inputs:
      confirm_preview_deploy:
        description: "确认只部署独立 iPad Edition Preview Worker"
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"
  push:
    branches:
      - feature/libretv-ipad-edition-foundation

permissions:
  contents: read

concurrency:
  group: libretv-ipad-edition-preview
  cancel-in-progress: false

jobs:
  deploy-preview:
    if: ${{ github.ref == 'refs/heads/feature/libretv-ipad-edition-foundation' && ((github.event_name == 'workflow_dispatch' && inputs.confirm_preview_deploy == 'yes') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-ipad-edition-preview]'))) }}
    name: Build and deploy isolated iPad Edition Preview
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: preview
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Unit tests
        run: npm test -- --reporter=dot
      - name: Build isolated Worker
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npx opennextjs-cloudflare build
      - name: Verify Preview credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing preview secret: CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing preview secret: CLOUDFLARE_ACCOUNT_ID" && exit 1)
      - name: Deploy dedicated iPad Edition Preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.ipad-edition-preview.toml
