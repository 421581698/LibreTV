                      posterInspectionBudgetMs - (Date.now() - posterInspectionStartedAt),
                    );
                    renderedViewportPng = PNG.sync.read(await page.screenshot({
                      fullPage: false,
                      animations: "disabled",
                      // Full viewport compositing can exceed 1.5s on large 2x iPad
                      // captures. Allow a bounded 5s while preserving the 60s audit budget.
                      timeout: Math.max(1, Math.min(5000, remainingPosterBudgetMs)),
                    }));
                  } catch (error) {
                    const slotType = await page.locator('[data-ipad-poster-slot]').nth(index)
                      .getAttribute('data-ipad-poster-slot').catch(() => 'unknown');
                    posterPixelChecks.push({
                      index,
                      slotType: slotType ?? 'unknown',
                      inspected: false,
                      reason: 'poster-screenshot-failed: ' + String(error).slice(0, 300),
                      blankBlack: false,
                    });
                    console.error('Poster pixel screenshot failed for slot ' + index + ': ' + String(error));
                    continue;
                  }
                  if ((index + 1) % 5 === 0 || index + 1 === posterSlots) {
                    console.log(`Poster pixel audit progress: ${index + 1}/${posterSlots} slots in ${Date.now() - posterInspectionStartedAt}ms.`);
                  }
                  const item = await page.evaluate((slotIndex) => {
                    const slots = Array.from(document.querySelectorAll('[data-ipad-poster-slot]'));
                    const slot = slots[slotIndex];
                    const image = slot?.querySelector('img');
                    if (!slot || !image) {
                      return {
                        index: slotIndex,
                        slotType: slot?.getAttribute('data-ipad-poster-slot') ?? 'unknown',
                        missingImage: true,
                      };
                    }
                    const rect = image.getBoundingClientRect();
                    return {
                      index: slotIndex,
                      slotType: slot.getAttribute('data-ipad-poster-slot') ?? 'unknown',
                      missingImage: false,
                      x: rect.left,
                      y: rect.top,
                      width: rect.width,
                      height: rect.height,
                      naturalWidth: image.naturalWidth,
                      naturalHeight: image.naturalHeight,
                      complete: image.complete,
                      source: (image.currentSrc || image.src || '').slice(0, 180),
                    };
                  }, index);

                  if (item.missingImage) {
                    posterPixelChecks.push({
                      index: item.index,
                      slotType: item.slotType,
                      inspected: false,
                      reason: "missing-image-element",
                      blankBlack: false,
                    });
                    continue;
                  }

                  const screenshotScaleX = renderedViewportPng.width / viewport.width;
                  const screenshotScaleY = renderedViewportPng.height / viewport.height;
                  const left = Math.max(0, Math.floor(item.x * screenshotScaleX));
                  const top = Math.max(0, Math.floor(item.y * screenshotScaleY));
                  const right = Math.min(renderedViewportPng.width, Math.ceil((item.x + item.width) * screenshotScaleX));
                  const bottom = Math.min(renderedViewportPng.height, Math.ceil((item.y + item.height) * screenshotScaleY));
                  let sum = 0;
                  let sumSquares = 0;
                  let darkPixels = 0;
                  let samples = 0;
                  const colorBuckets = new Set();
                  for (let y = top; y < bottom; y += 1) {
                    for (let x = left; x < right; x += 1) {
                      const offset = (y * renderedViewportPng.width + x) * 4;
                      const alpha = renderedViewportPng.data[offset + 3] / 255;
                      if (alpha < 0.9) continue;
                      const red = renderedViewportPng.data[offset];
                      const green = renderedViewportPng.data[offset + 1];
                      const blue = renderedViewportPng.data[offset + 2];
                      const luminance = 0.2126 * red + 0.7152 * green + 0.0722 * blue;
                      sum += luminance;
                      sumSquares += luminance * luminance;
                      if (luminance <= 16) darkPixels += 1;
                      colorBuckets.add([red >> 4, green >> 4, blue >> 4].join(","));
                      samples += 1;
                    }
                  }
                  const meanLuminance = samples ? sum / samples : 0;
                  const variance = samples ? Math.max(0, sumSquares / samples - meanLuminance ** 2) : 0;
                  const standardDeviation = Math.sqrt(variance);
                  const nearBlackRatio = samples ? darkPixels / samples : 1;
                  const blankBlack = samples === 0 ||
                    (meanLuminance < 8 && standardDeviation < 4 && nearBlackRatio > 0.995);
                  posterPixelChecks.push({
                    index: item.index,
                    slotType: item.slotType,
                    inspected: samples > 0,
                    width: Math.max(0, right - left),
                    height: Math.max(0, bottom - top),
                    meanLuminance: Number(meanLuminance.toFixed(2)),
                    luminanceStdDev: Number(standardDeviation.toFixed(2)),
                    nearBlackRatio: Number(nearBlackRatio.toFixed(4)),
                    colorBucketCount: colorBuckets.size,
                    blankBlack,
                    naturalWidth: item.naturalWidth,
                    naturalHeight: item.naturalHeight,
                    complete: item.complete,
                    source: item.source,
                  });
                }
                metrics.posterPixelInspectionSource = "per-poster-viewport-composited-screenshot";
                metrics.posterInspectionBudgetMs = posterInspectionBudgetMs;
                metrics.posterInspectionDurationMs = Date.now() - posterInspectionStartedAt;
                metrics.posterInspectionBudgetExceeded = posterInspectionBudgetExceeded;
                metrics.posterPixelChecks = posterPixelChecks;
                metrics.posterPixelInspectionUnavailableCount = posterPixelChecks.filter(item => !item.inspected).length;
                metrics.blankBlackPosterCount = posterPixelChecks.filter(item => item.blankBlack).length;
                metrics.posterPixelInspectionPassed = posterPixelChecks.length === metrics.posterSlotCount &&
                  metrics.posterPixelInspectionUnavailableCount === 0 && metrics.blankBlackPosterCount === 0;

                // Audit the real viewport, not a stitched full-page capture. Chromium can
                // reposition fixed elements while stitching a fullPage screenshot, making
                // the top navigation appear over unrelated poster rows even though its
                // measured viewport position is correct.
                await page.locator("#ipad-popular-series").scrollIntoViewIfNeeded();
                await page.evaluate(() => new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve))));
                const scrollAudit = await page.evaluate(() => {
                  const layoutMode = document.querySelector('.ipad-edition')?.getAttribute('data-ipad-layout') ?? 'compact';
                  const navElement = document.querySelector('.ipad-nav__topbar-inner') || document.querySelector('.ipad-nav__topbar');
                  const nav = navElement?.getBoundingClientRect();
                  const main = document.querySelector('.ipad-edition__main')?.getBoundingClientRect();
                  const labels = Array.from(document.querySelectorAll("#ipad-popular-series .ipad-edition__poster-card strong, #ipad-popular-series .ipad-edition__poster-card small"));
                  const visibleLabels = labels.map((element) => {
                    const rect = element.getBoundingClientRect();
                    const visible = rect.width > 0 && rect.height > 0 && rect.bottom > 0 && rect.top < window.innerHeight;
                    const overlapsNavigation = Boolean(nav && visible &&
                      nav.left < rect.right && nav.right > rect.left && nav.top < rect.bottom && nav.bottom > rect.top);
                    return {
                      text: element.textContent?.trim() ?? "",
                      left: Math.round(rect.left),
                      right: Math.round(rect.right),
                      top: Math.round(rect.top),
                      bottom: Math.round(rect.bottom),
                      visible,
                      overlapsNavigation,
                    };
                  });
                  return {
                    layoutMode,
                    scrollY: Math.round(window.scrollY),
                    navigationLeft: nav ? Math.round(nav.left) : null,
                    navigationRight: nav ? Math.round(nav.right) : null,
                    navigationTop: nav ? Math.round(nav.top) : null,
                    navigationBottom: nav ? Math.round(nav.bottom) : null,
                    mainLeft: main ? Math.round(main.left) : null,
                    mainRight: main ? Math.round(main.right) : null,
                    visiblePosterLabels: visibleLabels.filter(item => item.visible).length,
                    overlappingPosterLabels: visibleLabels.filter(item => item.overlapsNavigation),
                    contentClearsSidebar: Boolean(main && !document.querySelector('.ipad-nav__sidebar.is-open')),
                    navigationViewportValid: Boolean(nav && nav.top >= 0 && nav.bottom <= window.innerHeight),
                  };
                });
                metrics.scrollAudit = scrollAudit;
                const name = viewport.name + "-" + colorScheme;
                await page.evaluate(() => window.scrollTo(0, 0));
                await page.evaluate(() => new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve))));
                await page.screenshot({ path: "artifacts/ipad-visual-audit/" + name + ".png", fullPage: false, animations: "disabled" });
                // The navigation capsule intentionally floats above the full-bleed hero artwork.
                // Gate on copy/navigation collision, not artwork/navigation intersection or a
                // positive gap between the hero and fixed navigation. Hero copy is bottom-anchored
                // by design, so do not require its center to match the hero's geometric center.
                const failed = !sidebarInteractionPassed || sidebarInteraction.diagnostics.finalState?.computedStyle?.position !== "fixed" || response?.ok() !== true || metrics.horizontalOverflow || !metrics.shell || !metrics.main || metrics.main.y > 220 || metrics.main.width < viewport.width * 0.7 || !homepageReadiness.ready || !heroArtworkReadiness.ready || metrics.homepageStillLoading || metrics.animeCalendarStillLoading || metrics.posterCount < 1 || metrics.posterSlotCount < 1 || metrics.cardGeometryInvalidCount > 0 || metrics.posterImageLoadRate < 0.75 || !metrics.posterPixelInspectionPassed || !metrics.heroPosterResolution?.loaded || !metrics.heroPosterResolution.meets1200px || metrics.heroTextOverlapsNavigation || metrics.heroCtaWhiteSpace !== "nowrap" || !metrics.hero || metrics.hero.y < 0 || metrics.hero.y > Math.min(160, viewport.height * 0.25) || !metrics.heroArtworkEdgeCoverage?.every(Boolean) || !metrics.themePairValid || !scrollAudit.navigationViewportValid || !scrollAudit.contentClearsSidebar || scrollAudit.overlappingPosterLabels.length > 0;
                if (failed) failures += 1;
                await Promise.allSettled(apiDiagnosticTasks);
                results.push({ name, httpStatus: response?.status() ?? null, failed, sidebarInteractionPassed, sidebarInteraction, metrics, pageErrors: consoleErrors, apiDiagnostics });
                console.log(JSON.stringify(results.at(-1)));
                await context.close();
              }
            }
          } catch (error) {
            failures += 1;
            results.push({ fatalError: String(error), completedViewportThemePairs: results.length });
            console.error("Fatal iPad visual audit error:", error);
          } finally {
            await browser.close();
            await fs.writeFile("artifacts/ipad-visual-audit/report.json", JSON.stringify({
              target,
              mode: "simulated Chromium viewport audit; not real iPad Safari",
              total: results.length,
              failures,
              fatalError: failures && results.at(-1)?.fatalError ? results.at(-1).fatalError : null,
              results,
            }, null, 2));
          }
          if (failures) process.exitCode = 1;
          NODE
      - name: Verify clean Preview URL without layout debug parameter
        if: ${{ !cancelled() && steps.deploy_preview.outcome == 'success' && steps.install_playwright.outcome == 'success' && steps.install_chromium.outcome == 'success' }}
        timeout-minutes: 8
        run: |
          node --input-type=module <<'NODE'
          import { createRequire } from 'node:module';
          const require = createRequire(process.env.RUNNER_TEMP + '/ipad-audit/package.json');
          const { chromium } = require('playwright');
          const url = "https://libretv-ipad-edition-preview.bggdbh.workers.dev/ipad-edition";
          const browser = await chromium.launch({ headless: true });
          const results = [];
          try {
            for (const colorScheme of ["light", "dark"]) {
              const context = await browser.newContext({
                viewport: { width: 1194, height: 834 },
                deviceScaleFactor: 2,
                isMobile: true,
                hasTouch: true,
                colorScheme,
              });
              const page = await context.newPage();
              const errors = [];
              page.on("pageerror", error => errors.push(error.message));
              const response = await page.goto(url, { waitUntil: "domcontentloaded", timeout: 60000 });
              await page.locator('[data-ipad-edition="true"]').waitFor({ state: "attached", timeout: 30000 });
              await page.locator(".ipad-edition__cinema-hero").waitFor({ state: "visible", timeout: 30000 });
              await page.locator('.ipad-nav__topbar').waitFor({ state: 'visible', timeout: 30000 });
              await page.locator('.ipad-nav__sidebar.is-open').waitFor({ state: 'hidden', timeout: 30000 });
              // The environment engine attaches its data attributes in a client effect.
              // Wait for the requested scheme before asserting clean-URL theme readiness.
              await page.waitForFunction(
                (scheme) => document.querySelector(".ipad-edition")?.getAttribute("data-environment") === scheme,
                colorScheme,
                { timeout: 15000 },
              );
              const metrics = await page.evaluate(() => ({
                hasDebugOverlay: Boolean(document.querySelector('[aria-label="iPad 页面布局诊断"]')),
                hasDebugQuery: new URLSearchParams(location.search).has("__layout_debug"),
                rootEnvironment: document.querySelector(".ipad-edition")?.dataset.environment ?? null,
                viewportWidth: document.documentElement.clientWidth,
                documentWidth: document.documentElement.scrollWidth,
                heroWidth: Math.round(document.querySelector(".ipad-edition__cinema-hero")?.getBoundingClientRect().width ?? 0),
              }));
              const failed = !response?.ok() || metrics.hasDebugOverlay || metrics.hasDebugQuery ||
                metrics.rootEnvironment !== colorScheme || metrics.documentWidth > metrics.viewportWidth + 1 ||
                metrics.heroWidth < metrics.viewportWidth * 0.7 || errors.length > 0;
              results.push({ colorScheme, status: response?.status() ?? null, failed, metrics, errors });
              console.log(JSON.stringify(results.at(-1)));
              await context.close();
              if (failed) throw new Error("Clean Preview audit failed for " + colorScheme);
            }
          } finally {
            await browser.close();
          }
          NODE
      - name: Capture iPad subpage visual baselines
        if: ${{ !cancelled() && steps.deploy_preview.outcome == 'success' && steps.install_playwright.outcome == 'success' && steps.install_chromium.outcome == 'success' }}
        timeout-minutes: 12
        run: |
          mkdir -p artifacts/ipad-visual-audit/subpages
          node --input-type=module <<'NODE'
          import { createRequire } from 'node:module';
          const require = createRequire(process.env.RUNNER_TEMP + '/ipad-audit/package.json');
          const { chromium } = require('playwright');
          import fs from 'node:fs/promises';

          const base = "https://libretv-ipad-edition-preview.bggdbh.workers.dev";
          const routes = [
            { name: "search", path: "/ipad-edition/search", chrome: true, heading: true },
            { name: "movies", path: "/ipad-edition/movies", chrome: true, heading: true },
            { name: "series", path: "/ipad-edition/series", chrome: true, heading: true },
            { name: "anime", path: "/ipad-edition/anime", chrome: true, heading: true },
            { name: "detail", path: "/ipad-edition/detail?source=friday-cms&id=ipad-preview-fixture&title=iPad%20Preview%20%E6%A0%B7%E7%89%87&sourceUrl=https%3A%2F%2Fpreview.invalid%2Fapi.php%2Fprovide%2Fvod", chrome: true, heading: false },
            { name: "detail-tmdb", path: "/ipad-edition/detail?tmdbId=12345&tmdbType=movie&title=TMDB%20%E9%A2%84%E8%A7%88%E6%A0%B7%E7%89%87", chrome: true, heading: false },
            { name: "detail-bangumi", path: "/ipad-edition/detail?bangumiId=425&title=Bangumi%20%E9%A2%84%E8%A7%88%E6%A0%B7%E7%89%87", chrome: true, heading: false },
            { name: "watch", path: "/ipad-edition/watch?source=friday-cms&id=ipad-preview-fixture&index=0&title=iPad%20Preview%20%E6%A0%B7%E7%89%87&sourceUrl=https%3A%2F%2Fpreview.invalid%2Fapi.php%2Fprovide%2Fvod", chrome: false, heading: false },
          ];
          const browser = await chromium.launch({ headless: true });
          const results = [];
          try {
            for (const route of routes) {
              for (const colorScheme of ["light", "dark"]) {
