name: Scrapling Collector

on:
  push:
    branches:
      - feat/iphone-inline-play-top-search-2026-11-09
      - feat/resource-intelligence-center-v2
      - integration/**
    paths:
      - "services/scrapling-collector/**"
      - "services/scrapling-collector/stats.py"
      - "services/scrapling-collector/tests/test_stats.py"
      - "src/app/api/resource-collector/**"
      - "src/lib/resource-collector-client.ts"
      - "src/lib/resource-collector-client.test.ts"
      - "src/lib/api-guard.ts"
      - "src/lib/api-guard.test.ts"
      - "src/components/home/home-inline-play.test.ts"
      - "src/lib/resource-collector-client.ts"
      - "src/lib/resource-collector-client.test.ts"
      - "src/lib/api-guard.ts"
      - "src/lib/api-guard.test.ts"
      - "src/components/home/home-inline-play.test.ts"
      - "docker-compose.yml"
      - "render.yaml"
      - "scripts/scrapling-egress-firewall.sh"
      - ".github/workflows/scrapling-collector.yml"
  pull_request:
    paths:
      - "services/scrapling-collector/**"
      - "src/app/api/resource-collector/**"
      - "src/components/source-manager.tsx"
      - "docker-compose.yml"
      - "render.yaml"
      - "scripts/scrapling-egress-firewall.sh"
      - ".github/workflows/scrapling-collector.yml"
  workflow_dispatch:
    inputs:
      run_live_acceptance:
        description: Run operator-approved AI, real 4K playback and live crawl acceptance
        required: true
        default: false
        type: boolean
      crawl_target:
        description: Number of approved live crawl jobs
        required: true
        default: "1000"
        type: choice
        options: ["1000", "2000", "5000", "10000"]
      media_seconds:
        description: Required continuous 4K decode/playback duration
        required: true
        default: "60"
        type: choice
        options: ["60", "120", "300"]

permissions:
  contents: read

jobs:
  collector-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/scrapling-collector
    env:
      SCRAPLING_API_TOKEN: collector-ci-token
      SCRAPLING_DB_PATH: /tmp/libretv-scrapling-ci.sqlite3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/scrapling-collector/requirements.txt
      - name: Install collector dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile Python service
        run: python -m py_compile app.py registry_queue.py worker.py ai_rules.py tests/ai_rules_acceptance.py tests/media_acceptance.py tests/browser_playback_acceptance.py tests/live_crawl_scale.py tests/test_ai_rules.py tests/test_worker_ai_rules.py
      - name: Run collector unit tests
        run: python -m unittest discover -s tests -v
      - name: Stress test 1k, 2k, 5k, and 10k independent durable queue jobs
        run: |
          for target in 1000 2000 5000 10000; do
            python tests/load_queue.py --target "$target" --workers 4
          done
      - name: Validate Docker Compose collector profile
        working-directory: .
        env:
          PASSWORD: collector-ci-password
          SCRAPLING_API_TOKEN: collector-ci-token
        run: docker compose -f docker-compose.yml --project-directory . --profile collector config --quiet
      - name: Validate Render Blueprint YAML syntax
        working-directory: .
        run: |
          ruby -e 'require "yaml"; YAML.safe_load_file("render.yaml", permitted_classes: [], aliases: false); YAML.safe_load_file(".github/workflows/collector-live-acceptance.yml", permitted_classes: [], aliases: false); puts "Render Blueprint and live acceptance workflow YAML syntax passed"'
      - name: Validate host firewall scripts syntax
        run: |
          bash -n ../../scripts/scrapling-egress-firewall.sh
          bash -n ../../scripts/test-scrapling-egress-firewall.sh
      - name: Build isolated collector image
        run: docker build --tag libretv-scrapling-collector:ci .
      - name: Run live Docker egress firewall attack tests
        working-directory: .
        run: bash scripts/test-scrapling-egress-firewall.sh
      - name: Smoke test durable worker startup
        working-directory: .
        run: |
          docker run --rm --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --tmpfs /data:rw,nosuid,nodev,size=64m \
            --shm-size 256m --pids-limit 128 --memory 1g --cpus 2.0 \
            -e SCRAPLING_API_TOKEN=collector-ci-token \
            -e SCRAPLING_DB_PATH=/data/worker-smoke.sqlite3 \
            -e SCRAPLING_EGRESS_FIREWALL_CONFIRMED=0 \
            libretv-scrapling-collector:ci python worker.py --once
      - name: Run isolated collector API smoke test
        working-directory: .
        run: |
          set -euo pipefail
          docker run -d --name libretv-scrapling-api-smoke \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --tmpfs /data:rw,nosuid,nodev,size=64m \
            --shm-size 256m --pids-limit 128 --memory 1g --cpus 2.0 \
            --cap-drop ALL --cap-add CHOWN --cap-add SETGID --cap-add SETUID --security-opt no-new-privileges \
            -e SCRAPLING_API_TOKEN=collector-ci-token \
            -e SCRAPLING_DB_PATH=/data/collector.sqlite3 \
            -e SCRAPLING_EGRESS_FIREWALL_CONFIRMED=1 \
            -e SCRAPLING_EGRESS_MARKER_PATH=/data/missing-firewall-proof.json \
            -e PORT=8000 \
            -p 127.0.0.1:18000:8000 \
            libretv-scrapling-collector:ci
          trap 'docker rm -f libretv-scrapling-api-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18000/health >/dev/null; then break; fi
            if [ "$attempt" -eq 30 ]; then
              docker logs libretv-scrapling-api-smoke
              exit 1
            fi
            sleep 2
          done
          python - <<'PY'
          import json
          import urllib.error
          import urllib.request

          base = "http://127.0.0.1:18000"

          def request(path, method="GET", token=None, body=None):
              headers = {}
              if token:
                  headers["Authorization"] = "Bearer " + token
              data = json.dumps(body).encode() if body is not None else None
              if data is not None:
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(base + path, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=5) as response:
                      return response.status, response.read().decode()
              except urllib.error.HTTPError as error:
                  return error.code, error.read().decode()

          status, body = request("/health")
          assert status == 200 and json.loads(body)["ok"] is True, (status, body)

          status, _ = request("/v1/jobs")
          assert status == 401, ("unauthenticated jobs must be rejected", status)
          status, _ = request("/v1/registry/resources")
          assert status == 401, ("unauthenticated Registry access must be rejected", status)

          token = "collector-ci-token"
          status, body = request("/v1/jobs", token=token)
          assert status == 200 and json.loads(body)["jobs"] == [], (status, body)
          status, body = request("/v1/registry/resources", token=token)
          assert status == 200 and json.loads(body)["resources"] == [], (status, body)

          payload = {"payload": {"url": "https://example.com", "mode": "http", "limit": 1},
                     "idempotency_key": "ci:collector:smoke"}
          status, first = request("/v1/tasks/submit", method="POST", token=token, body=payload)
          status2, second = request("/v1/tasks/submit", method="POST", token=token, body=payload)
          first_job, second_job = json.loads(first), json.loads(second)
          assert status == status2 == 200 and first_job["id"] == second_job["id"], (status, first, status2, second)
          status, body = request("/v1/jobs/" + first_job["id"] + "/cancel", method="POST", token=token)
          assert status == 200 and json.loads(body)["status"] == "cancelled", (status, body)

          bulk_payload = {"jobs": [
              {"job_type": "crawl", "payload": {"url": "https://example.com/a", "mode": "http", "limit": 1},
               "idempotency_key": "ci:collector:bulk:a"},
              {"job_type": "crawl", "payload": {"url": "https://example.com/b", "mode": "http", "limit": 1},
               "idempotency_key": "ci:collector:bulk:b"},
          ]}
          status, bulk_body = request("/v1/jobs/bulk", method="POST", token=token, body=bulk_payload)
          bulk_jobs = json.loads(bulk_body)["jobs"]
          assert status == 200 and len(bulk_jobs) == 2 and bulk_jobs[0]["id"] != bulk_jobs[1]["id"], (status, bulk_body)
          status, repeated_body = request("/v1/jobs/bulk", method="POST", token=token, body=bulk_payload)
          repeated_jobs = json.loads(repeated_body)["jobs"]
          assert status == 200 and [job["id"] for job in repeated_jobs] == [job["id"] for job in bulk_jobs], (status, repeated_body)

          status, _ = request("/v1/discover")
          assert status == 401, ("unauthenticated discovery must be rejected", status)

          token = "collector-ci-token"
          status, body = request("/v1/discover", token=token)
          assert status == 503 and "current-boot" in body, ("discovery must fail closed", status, body)

          status, body = request("/v1/crawl", method="POST", token=token,
                                 body={"url": "https://example.com", "mode": "http", "limit": 101})
          assert status == 503 and "current-boot" in body, ("crawl must fail closed", status, body)

          status, body = request("/v1/candidates/" + ("a" * 32) + "/validate",
                                 method="POST", token=token)
          assert status == 503 and "current-boot" in body, ("validation must fail closed", status, body)

          print("Collector container API smoke passed: health, auth, and default-deny egress gate.")
          PY

  live-acceptance:
    needs: collector-tests
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_live_acceptance == true) || ((github.event_name == 'push' || github.event_name == 'pull_request') && vars.COLLECTOR_LIVE_ACCEPTANCE_ENABLED == 'true' && (github.ref == 'refs/heads/integration/collector-ai-rules-4k-scale-2026-11-16' || (github.event_name == 'pull_request' && github.event.pull_request.number == 92))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: collector-acceptance
    env:
      SCRAPLING_API_TOKEN: ${{ secrets.SCRAPLING_API_TOKEN }}
      SCRAPLING_EGRESS_FIREWALL_CONFIRMED: "1"
      COLLECTOR_WORKER_CONCURRENCY: "4"
      COLLECTOR_AI_GATEWAY_URL: ${{ secrets.COLLECTOR_AI_GATEWAY_URL }}
      COLLECTOR_AI_API_KEY: ${{ secrets.COLLECTOR_AI_API_KEY }}
      COLLECTOR_AI_MODEL: ${{ secrets.COLLECTOR_AI_MODEL }}
      COLLECTOR_AI_ALLOWED_HOSTS: ${{ secrets.COLLECTOR_AI_ALLOWED_HOSTS }}
      MEDIA_ACCEPTANCE_URL: ${{ secrets.MEDIA_ACCEPTANCE_URL }}
      MEDIA_ACCEPTANCE_ALLOWED_HOSTS: ${{ secrets.MEDIA_ACCEPTANCE_ALLOWED_HOSTS }}
      BROWSER_MEDIA_ACCEPTANCE_URL: ${{ secrets.BROWSER_MEDIA_ACCEPTANCE_URL }}
      BROWSER_MEDIA_ACCEPTANCE_ALLOWED_HOSTS: ${{ secrets.BROWSER_MEDIA_ACCEPTANCE_ALLOWED_HOSTS }}
      MEDIA_ACCEPTANCE_SECONDS: ${{ inputs.media_seconds || '60' }}
      LIVE_CRAWL_ALLOWED_HOSTS: ${{ secrets.LIVE_CRAWL_ALLOWED_HOSTS }}
      LIVE_CRAWL_URLS: ${{ secrets.LIVE_CRAWL_URLS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate operator acceptance fixtures
        run: |
          test -n "$SCRAPLING_API_TOKEN"
          test -n "$MEDIA_ACCEPTANCE_URL"
          test -n "$MEDIA_ACCEPTANCE_ALLOWED_HOSTS"
          test -n "$BROWSER_MEDIA_ACCEPTANCE_URL"
          test -n "$BROWSER_MEDIA_ACCEPTANCE_ALLOWED_HOSTS"
          test -n "$LIVE_CRAWL_ALLOWED_HOSTS"
          test -n "$LIVE_CRAWL_URLS"
          test -n "$COLLECTOR_AI_GATEWAY_URL"
          test -n "$COLLECTOR_AI_API_KEY"
          test -n "$COLLECTOR_AI_MODEL"
          test -n "$COLLECTOR_AI_ALLOWED_HOSTS"
      - name: Build isolated stack
        run: docker compose --profile collector up -d --build
      - name: Install and verify current-boot host firewall
        run: sudo bash scripts/scrapling-egress-firewall.sh
      - name: Copy real acceptance harnesses into isolated Collector
        run: |
          docker cp services/scrapling-collector/tests/ai_rules_acceptance.py libretv-scrapling-collector:/tmp/ai_rules_acceptance.py
          docker cp services/scrapling-collector/tests/media_acceptance.py libretv-scrapling-collector:/tmp/media_acceptance.py
          docker cp services/scrapling-collector/tests/browser_playback_acceptance.py libretv-scrapling-collector:/tmp/browser_playback_acceptance.py
          docker cp services/scrapling-collector/tests/live_crawl_scale.py libretv-scrapling-collector:/tmp/live_crawl_scale.py
          printf '%s' "$LIVE_CRAWL_URLS" > /tmp/collector-approved-live-urls.txt
          docker cp /tmp/collector-approved-live-urls.txt libretv-scrapling-collector:/tmp/approved-live-urls.txt
      - name: Verify AI rule generation, versioning and automatic repair
        run: |
          docker exec \
            -e SCRAPLING_API_BASE="http://127.0.0.1:10000" \
            -e SCRAPLING_API_TOKEN="$SCRAPLING_API_TOKEN" \
            libretv-scrapling-collector python /tmp/ai_rules_acceptance.py
      - name: Verify real UHD 4K sustained decode
        run: |
          docker exec \
            -e MEDIA_ACCEPTANCE_URL="$MEDIA_ACCEPTANCE_URL" \
            -e MEDIA_ACCEPTANCE_ALLOWED_HOSTS="$MEDIA_ACCEPTANCE_ALLOWED_HOSTS" \
            -e MEDIA_ACCEPTANCE_SECONDS="$MEDIA_ACCEPTANCE_SECONDS" \
            libretv-scrapling-collector python /tmp/media_acceptance.py
      - name: Verify real Chromium 4K continuous playback
        run: |
          docker exec \
            -e MEDIA_ACCEPTANCE_URL="$BROWSER_MEDIA_ACCEPTANCE_URL" \
            -e MEDIA_ACCEPTANCE_ALLOWED_HOSTS="$BROWSER_MEDIA_ACCEPTANCE_ALLOWED_HOSTS" \
            -e MEDIA_ACCEPTANCE_SECONDS="$MEDIA_ACCEPTANCE_SECONDS" \
            libretv-scrapling-collector python /tmp/browser_playback_acceptance.py
      - name: Verify live network crawl scale
        run: |
          docker exec \
            -e SCRAPLING_API_BASE="http://127.0.0.1:10000" \
            -e SCRAPLING_API_TOKEN="$SCRAPLING_API_TOKEN" \
            -e LIVE_CRAWL_ALLOWED_HOSTS="$LIVE_CRAWL_ALLOWED_HOSTS" \
            libretv-scrapling-collector python /tmp/live_crawl_scale.py \
              --urls /tmp/approved-live-urls.txt --target "${{ inputs.crawl_target || '1000' }}"
      - name: Collect isolated stack diagnostics
        if: always()
        run: |
          docker compose --profile collector ps
          docker logs libretv-scrapling-collector 2>&1 | tail -200 || true
          docker logs libretv-scrapling-worker 2>&1 | tail -200 || true
      - name: Tear down isolated stack
        if: always()
        run: docker compose --profile collector down -v
