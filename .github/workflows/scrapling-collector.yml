name: Scrapling Collector

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - feat/iphone-inline-play-top-search-2026-11-09
      - feat/resource-intelligence-center-v2
      - integration/**
    paths:
      - "services/scrapling-collector/**"
      - "services/scrapling-collector/stats.py"
      - "services/scrapling-collector/tests/test_stats.py"
      - "src/app/api/resource-collector/**"
      - "src/lib/resource-collector-client.ts"
      - "src/lib/resource-collector-client.test.ts"
      - "src/lib/api-guard.ts"
      - "src/lib/api-guard.test.ts"
      - "src/components/home/home-inline-play.test.ts"
      - "src/lib/resource-collector-client.ts"
      - "src/lib/resource-collector-client.test.ts"
      - "src/lib/api-guard.ts"
      - "src/lib/api-guard.test.ts"
      - "src/components/home/home-inline-play.test.ts"
      - "docker-compose.yml"
      - "render.yaml"
      - "scripts/scrapling-egress-firewall.sh"
      - ".github/workflows/scrapling-collector.yml"
      - ".github/workflows/collector-live-acceptance.yml"
  pull_request:
    paths:
      - "services/scrapling-collector/**"
      - "src/app/api/resource-collector/**"
      - "src/components/source-manager.tsx"
      - "docker-compose.yml"
      - "render.yaml"
      - "scripts/scrapling-egress-firewall.sh"
      - ".github/workflows/scrapling-collector.yml"
      - ".github/workflows/collector-live-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collector-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: services/scrapling-collector
    env:
      SCRAPLING_API_TOKEN: collector-ci-token
      SCRAPLING_DB_PATH: /tmp/libretv-scrapling-ci.sqlite3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/scrapling-collector/requirements.txt
      - name: Install collector dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Verify installed Patchright browser runtime
        run: python -c "from patchright.sync_api import sync_playwright; print('Patchright import passed')"
      - name: Compile Python service
        run: python -m py_compile app.py registry_queue.py worker.py ai_rules.py tests/ai_rules_acceptance.py tests/media_download.py tests/media_acceptance.py tests/test_media_sandbox.py tests/browser_playback_acceptance.py tests/live_crawl_scale.py tests/test_live_crawl_scale.py tests/test_ai_rules.py tests/test_worker_ai_rules.py
      - name: Run collector unit tests
        run: python -m unittest discover -s tests -v
      - name: Stress test 1k, 2k, 5k, and 10k independent durable queue jobs
        run: |
          for target in 1000 2000 5000 10000; do
            python tests/load_queue.py --target "$target" --workers 4
          done
      - name: Validate Docker Compose collector profile
        working-directory: .
        env:
          PASSWORD: collector-ci-password
          SCRAPLING_API_TOKEN: collector-ci-token
        run: docker compose -f docker-compose.yml --project-directory . --profile collector config --quiet
      - name: Validate Render Blueprint YAML syntax
        working-directory: .
        run: |
          ruby -e 'require "yaml"; YAML.safe_load_file("render.yaml", permitted_classes: [], aliases: false); YAML.safe_load_file(".github/workflows/scrapling-collector.yml", permitted_classes: [], aliases: false); YAML.safe_load_file(".github/workflows/collector-live-acceptance.yml", permitted_classes: [], aliases: false); puts "Render Blueprint and Collector workflow YAML syntax passed"'
      - name: Validate host firewall scripts syntax
        run: |
          bash -n ../../scripts/scrapling-egress-firewall.sh
          bash -n ../../scripts/test-scrapling-egress-firewall.sh
      - name: Build isolated collector image
        timeout-minutes: 30
        run: timeout --signal=TERM --kill-after=30s 29m docker build --progress=plain --tag libretv-scrapling-collector:ci .
      - name: Smoke test isolated Chromium runtime without network
        working-directory: .
        run: |
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=128m \
            --tmpfs /data:rw,nosuid,nodev,size=128m \
            --shm-size 256m --pids-limit 128 --memory 1g --cpus 2.0 \
            libretv-scrapling-collector:ci python -c "from patchright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.launch(headless=True); page=b.new_page(); page.set_content('<video></video>'); assert page.locator('video').count()==1; b.close(); p.stop(); print('Isolated Chromium runtime smoke passed')"
      - name: Run live Docker egress firewall attack tests
        working-directory: .
        run: bash scripts/test-scrapling-egress-firewall.sh
      - name: Run real public 4K decode and Chromium playback acceptance
        working-directory: .
        env:
          SCRAPLING_EGRESS_FIREWALL_CONFIRMED: "1"
          PASSWORD: ci-only-acceptance-password
          MEDIA_ACCEPTANCE_URL: https://upload.wikimedia.org/wikipedia/commons/c/c0/Big_Buck_Bunny_4K.webm
          MEDIA_ACCEPTANCE_ALLOWED_HOSTS: upload.wikimedia.org
          MEDIA_ACCEPTANCE_SECONDS: "60"
        run: |
          set -euo pipefail
          docker compose --profile collector up -d --build scrapling-collector
          trap 'docker compose --profile collector down -v >/dev/null 2>&1 || true' EXIT
          sudo bash scripts/scrapling-egress-firewall.sh
          docker exec -i libretv-scrapling-collector sh -c 'cat > /tmp/media_download.py' < services/scrapling-collector/tests/media_download.py
          docker exec -i libretv-scrapling-collector sh -c 'cat > /tmp/browser_playback_acceptance.py' < services/scrapling-collector/tests/browser_playback_acceptance.py
          docker exec -e MEDIA_ACCEPTANCE_URL="$MEDIA_ACCEPTANCE_URL" -e MEDIA_ACCEPTANCE_ALLOWED_HOSTS="$MEDIA_ACCEPTANCE_ALLOWED_HOSTS" -e MEDIA_ACCEPTANCE_SECONDS="$MEDIA_ACCEPTANCE_SECONDS" libretv-scrapling-collector python /tmp/media_download.py --output /tmp/media-acceptance-sample.mkv
          docker exec libretv-scrapling-collector sh -c 'test -s /tmp/media-acceptance-sample.mkv && cat /tmp/media-acceptance-sample.mkv' > "$RUNNER_TEMP/media-acceptance-sample.mkv"
          test -s "$RUNNER_TEMP/media-acceptance-sample.mkv"
          docker exec libretv-scrapling-collector rm -f /tmp/media-acceptance-sample.mkv
          docker run --rm --network none --read-only --user 10001:10001 --cap-drop ALL \
            --security-opt no-new-privileges \
            --security-opt seccomp="$GITHUB_WORKSPACE/services/scrapling-collector/seccomp-no-socket.json" \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=128m \
            --mount type=bind,src="$RUNNER_TEMP/media-acceptance-sample.mkv",dst=/input/media-acceptance-sample.mkv,readonly \
            --mount type=bind,src="$GITHUB_WORKSPACE/services/scrapling-collector/tests/media_acceptance.py",dst=/opt/media_acceptance.py,readonly \
            --memory 2g --cpus 2 --pids-limit 128 -e HOME=/tmp \
            --entrypoint python libretv-scrapling-collector:ci \
            /opt/media_acceptance.py --input /input/media-acceptance-sample.mkv --requested-seconds "$MEDIA_ACCEPTANCE_SECONDS"
          # Use a separate CC0 4K H.264 fixture for Chromium; FFmpeg retains the 60-second 4K WebM decode fixture.
          docker exec -e BROWSER_MEDIA_ACCEPTANCE_URL="https://cdn.truefilesize.com/mp4/sample-4k.mp4" -e BROWSER_MEDIA_ACCEPTANCE_ALLOWED_HOSTS="cdn.truefilesize.com" -e MEDIA_ACCEPTANCE_SECONDS="$MEDIA_ACCEPTANCE_SECONDS" libretv-scrapling-collector python /tmp/browser_playback_acceptance.py
      - name: Smoke test durable worker startup
        working-directory: .
        run: |
          docker run --rm --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --tmpfs /data:rw,nosuid,nodev,size=64m \
            --shm-size 256m --pids-limit 128 --memory 1g --cpus 2.0 \
            -e SCRAPLING_API_TOKEN=collector-ci-token \
            -e SCRAPLING_DB_PATH=/data/worker-smoke.sqlite3 \
            -e SCRAPLING_EGRESS_FIREWALL_CONFIRMED=0 \
            libretv-scrapling-collector:ci python worker.py --once
      - name: Run isolated collector API smoke test
        working-directory: .
        run: |
          set -euo pipefail
          docker run -d --name libretv-scrapling-api-smoke \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --tmpfs /data:rw,nosuid,nodev,size=64m \
            --shm-size 256m --pids-limit 128 --memory 1g --cpus 2.0 \
            --cap-drop ALL --cap-add CHOWN --cap-add SETGID --cap-add SETUID --security-opt no-new-privileges \
            -e SCRAPLING_API_TOKEN=collector-ci-token \
            -e SCRAPLING_DB_PATH=/data/collector.sqlite3 \
            -e SCRAPLING_EGRESS_FIREWALL_CONFIRMED=1 \
            -e SCRAPLING_EGRESS_MARKER_PATH=/data/missing-firewall-proof.json \
            -e PORT=8000 \
            -p 127.0.0.1:18000:8000 \
            libretv-scrapling-collector:ci
          trap 'docker rm -f libretv-scrapling-api-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18000/health >/dev/null; then break; fi
            if [ "$attempt" -eq 30 ]; then
              docker logs libretv-scrapling-api-smoke
              exit 1
            fi
            sleep 2
          done
          python - <<'PY'
          import json
          import urllib.error
          import urllib.request

          base = "http://127.0.0.1:18000"

          def request(path, method="GET", token=None, body=None):
              headers = {}
              if token:
                  headers["Authorization"] = "Bearer " + token
              data = json.dumps(body).encode() if body is not None else None
              if data is not None:
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(base + path, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=5) as response:
                      return response.status, response.read().decode()
              except urllib.error.HTTPError as error:
                  return error.code, error.read().decode()

          status, body = request("/health")
          assert status == 200 and json.loads(body)["ok"] is True, (status, body)

          status, _ = request("/v1/jobs")
          assert status == 401, ("unauthenticated jobs must be rejected", status)
          status, _ = request("/v1/registry/resources")
          assert status == 401, ("unauthenticated Registry access must be rejected", status)

          token = "collector-ci-token"
          status, body = request("/v1/jobs", token=token)
          assert status == 200 and json.loads(body)["jobs"] == [], (status, body)
          status, body = request("/v1/registry/resources", token=token)
          assert status == 200 and json.loads(body)["resources"] == [], (status, body)

          payload = {"payload": {"url": "https://example.com", "mode": "http", "limit": 1},
                     "idempotency_key": "ci:collector:smoke"}
          status, first = request("/v1/tasks/submit", method="POST", token=token, body=payload)
          status2, second = request("/v1/tasks/submit", method="POST", token=token, body=payload)
          first_job, second_job = json.loads(first), json.loads(second)
          assert status == status2 == 200 and first_job["id"] == second_job["id"], (status, first, status2, second)
          status, body = request("/v1/jobs/" + first_job["id"] + "/cancel", method="POST", token=token)
          assert status == 200 and json.loads(body)["status"] == "cancelled", (status, body)

          bulk_payload = {"jobs": [
              {"job_type": "crawl", "payload": {"url": "https://example.com/a", "mode": "http", "limit": 1},
               "idempotency_key": "ci:collector:bulk:a"},
              {"job_type": "crawl", "payload": {"url": "https://example.com/b", "mode": "http", "limit": 1},
               "idempotency_key": "ci:collector:bulk:b"},
          ]}
          status, bulk_body = request("/v1/jobs/bulk", method="POST", token=token, body=bulk_payload)
          bulk_jobs = json.loads(bulk_body)["jobs"]
          assert status == 200 and len(bulk_jobs) == 2 and bulk_jobs[0]["id"] != bulk_jobs[1]["id"], (status, bulk_body)
          status, repeated_body = request("/v1/jobs/bulk", method="POST", token=token, body=bulk_payload)
          repeated_jobs = json.loads(repeated_body)["jobs"]
          assert status == 200 and [job["id"] for job in repeated_jobs] == [job["id"] for job in bulk_jobs], (status, repeated_body)

          status, _ = request("/v1/discover")
          assert status == 401, ("unauthenticated discovery must be rejected", status)

          token = "collector-ci-token"
          status, body = request("/v1/discover", token=token)
          assert status == 503 and "current-boot" in body, ("discovery must fail closed", status, body)

          status, body = request("/v1/crawl", method="POST", token=token,
                                 body={"url": "https://example.com", "mode": "http", "limit": 101})
          assert status == 503 and "current-boot" in body, ("crawl must fail closed", status, body)

          status, body = request("/v1/candidates/" + ("a" * 32) + "/validate",
                                 method="POST", token=token)
          assert status == 503 and "current-boot" in body, ("validation must fail closed", status, body)

          print("Collector container API smoke passed: health, auth, and default-deny egress gate.")
          PY
