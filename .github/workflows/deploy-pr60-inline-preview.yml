name: Deploy PR #60 iPhone Inline Playback Preview

on:
  push:
    branches:
      - feat/iphone-inline-play-top-search-2026-11-09
    paths:
      - ".github/workflows/deploy-pr60-inline-preview.yml"
      - ".github/workflows/scrapling-collector.yml"
      - "wrangler.pr60-inline-preview.toml"
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.*"
      - "open-next.config.*"
      - "services/scrapling-collector/**"
      - "docker-compose.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: libretv-pr60-inline-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    name: Build and deploy isolated public PR #60 preview
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: preview
    steps:
      - name: Checkout exact PR #60 commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript verification
        run: npm run typecheck

      - name: ESLint verification
        run: npm run lint

      - name: Unit tests
        run: npm test -- --reporter=dot

      - name: Verify isolated public preview configuration
        run: |
          grep -Eq '^[[:space:]]*name[[:space:]]*=[[:space:]]*"libretv-pr60-inline-preview"' wrangler.pr60-inline-preview.toml
          grep -Eq '^[[:space:]]*AUTH_DISABLED[[:space:]]*=[[:space:]]*"true"' wrangler.pr60-inline-preview.toml

      - name: Build isolated PR #60 preview
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npx opennextjs-cloudflare build

      - name: Verify Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing preview secret: CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing preview secret: CLOUDFLARE_ACCOUNT_ID" && exit 1)

      - name: Deploy isolated PR #60 Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.pr60-inline-preview.toml

      - name: Verify public Preview homepage and authentication status
        run: |
          node --input-type=module <<'NODE'
          const base = "https://libretv-pr60-inline-preview.bggdbh.workers.dev";
          async function request(path) {
            let last;
            for (let attempt = 1; attempt <= 8; attempt++) {
              try {
                const response = await fetch(base + path, {
                  redirect: "follow",
                  headers: { "cache-control": "no-cache" },
                  signal: AbortSignal.timeout(15000),
                });
                const body = await response.text();
                console.log(path + " attempt " + attempt + ": HTTP " + response.status + " " + (response.headers.get("content-type") || ""));
                if (response.ok) return { response, body };
                last = new Error(path + " returned HTTP " + response.status + ": " + body.slice(0, 800));
              } catch (error) {
                last = error;
                console.log(path + " attempt " + attempt + " failed: " + String(error));
              }
              if (attempt < 8) await new Promise((resolve) => setTimeout(resolve, 5000));
            }
            throw last;
          }
          const [home, statusResult] = await Promise.all([
            request("/"),
            request("/api/status"),
          ]);
          if (!(home.response.headers.get("content-type") || "").includes("text/html")) {
            throw new Error("Preview homepage is not HTML: " + home.body.slice(0, 800));
          }
          let status;
          try { status = JSON.parse(statusResult.body); }
          catch { throw new Error("/api/status did not return JSON: " + statusResult.body.slice(0, 800)); }
          if (status.passwordRequired !== false || status.verified !== true) {
            throw new Error("Preview should be public: passwordRequired=" + status.passwordRequired + ", verified=" + status.verified);
          }
          console.log("PR #60 Preview verified: homepage is public and no password is required.");
          NODE
