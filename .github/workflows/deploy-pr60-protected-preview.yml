name: Deploy PR #60 Password-Protected Preview

on:
  push:
    branches:
      - feat/iphone-inline-play-top-search-2026-11-09
    paths:
      - ".github/workflows/deploy-pr60-protected-preview.yml"
      - "wrangler.pr60-protected-preview.toml"
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.*"
      - "open-next.config.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: libretv-pr60-protected-preview
  cancel-in-progress: true

jobs:
  deploy-protected-preview:
    name: Build and deploy isolated password-protected PR #60 preview
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: preview
    steps:
      - name: Checkout exact PR #60 commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript verification
        run: npm run typecheck

      - name: ESLint verification
        run: npm run lint

      - name: Unit tests
        run: npm test -- --reporter=dot

      - name: Verify protected preview configuration and secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR60_PREVIEW_PASSWORD: ${{ secrets.PR60_PREVIEW_PASSWORD }}
        run: |
          grep -Eq '^[[:space:]]*name[[:space:]]*=[[:space:]]*"libretv-pr60-protected-preview"' wrangler.pr60-protected-preview.toml
          grep -Eq '^[[:space:]]*AUTH_DISABLED[[:space:]]*=[[:space:]]*"false"' wrangler.pr60-protected-preview.toml
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing preview secret: CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing preview secret: CLOUDFLARE_ACCOUNT_ID" && exit 1)
          test -n "$PR60_PREVIEW_PASSWORD" || (echo "Missing GitHub environment secret: PR60_PREVIEW_PASSWORD" && exit 1)

      - name: Build isolated protected PR #60 preview
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npx opennextjs-cloudflare build

      - name: Deploy isolated protected PR #60 Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.pr60-protected-preview.toml

      - name: Provision password as Worker secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR60_PREVIEW_PASSWORD: ${{ secrets.PR60_PREVIEW_PASSWORD }}
        run: |
          printf '%s' "$PR60_PREVIEW_PASSWORD" | npx wrangler secret put PASSWORD --config wrangler.pr60-protected-preview.toml

      - name: Verify protected homepage and collector authentication boundary
        run: |
          node --input-type=module <<'NODE'
          const base = "https://libretv-pr60-protected-preview.bggdbh.workers.dev";
          async function request(path) {
            const response = await fetch(base + path, {
              redirect: "manual",
              headers: { "cache-control": "no-cache" },
              signal: AbortSignal.timeout(20000),
            });
            const body = await response.text();
            console.log(path + ": HTTP " + response.status + " " + (response.headers.get("content-type") || ""));
            return { response, body };
          }
          const [home, statusResult, collector] = await Promise.all([
            request("/"),
            request("/api/status"),
            request("/api/resource-collector"),
          ]);
          if (!(home.response.headers.get("content-type") || "").includes("text/html")) {
            throw new Error("Protected Preview homepage is not HTML.");
          }
          let status;
          try { status = JSON.parse(statusResult.body); }
          catch { throw new Error("/api/status did not return JSON."); }
          if (status.passwordRequired !== true || status.verified !== false) {
            throw new Error("Protected Preview auth status mismatch: passwordRequired=" + status.passwordRequired + ", verified=" + status.verified);
          }
          if (collector.response.status !== 401) {
            throw new Error("Unauthenticated Collector endpoint must return 401, got " + collector.response.status + ": " + collector.body.slice(0, 300));
          }
          console.log("Protected Preview verified: homepage reachable, password required, unauthenticated Collector request rejected.");
          NODE
