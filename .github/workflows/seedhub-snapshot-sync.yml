name: SeedHub Snapshot Sync (PR84)

on:
  push:
    branches:
      - feature/homepage-cinema-lobby-order-2026-11-11
    paths:
      - 'services/scrapling-collector/seedhub.py'
      - 'services/scrapling-collector/seedhub_snapshot_sync.py'
      - '.github/workflows/seedhub-snapshot-sync.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: seedhub-pr84-snapshot-sync
  cancel-in-progress: false

jobs:
  sync-seedhub:
    name: Fetch real SeedHub catalogues and persist snapshots
    if: ${{ github.ref == 'refs/heads/feature/homepage-cinema-lobby-order-2026-11-11' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout PR84 feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/homepage-cinema-lobby-order-2026-11-11
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/scrapling-collector/requirements.txt

      - name: Install SeedHub parser dependencies
        run: python -m pip install -r services/scrapling-collector/requirements.txt

      - name: Fetch and validate SeedHub catalogue snapshots
        env:
          PYTHONPATH: services/scrapling-collector
        run: python services/scrapling-collector/seedhub_snapshot_sync.py

      - name: Persist snapshots on the PR84 branch
        id: persist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seedhub/movies.json data/seedhub/series.json data/seedhub/anime.json
          if git diff --cached --quiet; then
            echo "No snapshot changes; existing persisted catalogue remains current."
          else
            git commit -m "data(seedhub): refresh real catalogue snapshots"
            git push origin HEAD:feature/homepage-cinema-lobby-order-2026-11-11
          fi

      - name: Set up Node.js for isolated Preview build
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify application types and tests
        run: |
          npm run typecheck
          npm run lint
          npm test -- --reporter=dot

      - name: Build isolated PR84 Preview with the newly persisted snapshots
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npx opennextjs-cloudflare build

      - name: Deploy snapshot-backed PR84 Preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing preview secret: CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing preview secret: CLOUDFLARE_ACCOUNT_ID" && exit 1)
          npx wrangler deploy --config wrangler.pr84-preview.toml
