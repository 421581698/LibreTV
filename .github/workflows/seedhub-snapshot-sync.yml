name: SeedHub Snapshot Sync (PR84)

on:
  push:
    branches:
      - feature/homepage-cinema-lobby-order-2026-11-11
    paths:
      - 'services/scrapling-collector/seedhub.py'
      - 'services/scrapling-collector/seedhub_snapshot_sync.py'
      - '.github/workflows/seedhub-snapshot-sync.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: seedhub-pr84-snapshot-sync
  cancel-in-progress: false

jobs:
  sync-seedhub:
    name: Fetch real SeedHub catalogues and persist snapshots
    if: ${{ github.ref == 'refs/heads/feature/homepage-cinema-lobby-order-2026-11-11' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout PR84 feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/homepage-cinema-lobby-order-2026-11-11
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/scrapling-collector/requirements.txt

      - name: Install SeedHub parser dependencies
        run: python -m pip install -r services/scrapling-collector/requirements.txt

      - name: Fetch and validate SeedHub catalogue snapshots
        env:
          PYTHONPATH: services/scrapling-collector
        run: python services/scrapling-collector/seedhub_snapshot_sync.py

      - name: Persist snapshots on the PR84 branch
        id: persist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seedhub/movies.json data/seedhub/series.json data/seedhub/anime.json
          if git diff --cached --quiet; then
            echo "No snapshot changes; existing persisted catalogue remains current."
          else
            git commit -m "data(seedhub): refresh real catalogue snapshots"
            git push origin HEAD:feature/homepage-cinema-lobby-order-2026-11-11
          fi

      - name: Trigger isolated PR84 Preview deployment with persisted snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/421581698/LibreTV/actions/workflows/deploy-pr84-preview.yml/dispatches \
            -d '{"ref":"feature/homepage-cinema-lobby-order-2026-11-11"}'
