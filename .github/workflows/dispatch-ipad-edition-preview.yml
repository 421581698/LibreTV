name: Dispatch LibreTV iPad Edition Preview

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: "PR #99 部署分支"
        required: true
        type: choice
        options:
          - feature/libretv-ipad-edition-product
          - feature/libretv-ipad-edition-foundation
        default: feature/libretv-ipad-edition-product
      confirm_preview_deploy:
        description: "确认只部署独立 iPad Edition Preview Worker"
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"

permissions:
  contents: read
  actions: read

concurrency:
  group: libretv-ipad-edition-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    if: ${{ inputs.confirm_preview_deploy == 'yes' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: preview
    steps:
      - name: Checkout selected PR #99 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}

      - name: Require successful Verify for this exact commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          echo "Target branch: $TARGET_BRANCH"
          echo "Target commit: $CHECKED_OUT_SHA"
          node --input-type=module <<'NODE'
          const branch = process.env.TARGET_BRANCH;
          const sha = process.env.CHECKED_OUT_SHA || (await import('node:child_process')).execSync('git rev-parse HEAD', { encoding: 'utf8' }).trim();
          const url = new URL(`https://api.github.com/repos/${process.env.GH_REPOSITORY}/actions/runs`);
          url.searchParams.set("branch", branch);
          url.searchParams.set("per_page", "100");
          const response = await fetch(url, {
            headers: {
              accept: "application/vnd.github+json",
              authorization: `Bearer ${process.env.GH_TOKEN}`,
              "x-github-api-version": "2022-11-28",
            },
          });
          if (!response.ok) throw new Error(`Cannot inspect Verify runs: HTTP ${response.status}`);
          const payload = await response.json();
          const verify = (payload.workflow_runs ?? []).find(run =>
            run.name === "LibreTV iPad Edition Verify" &&
            run.head_sha === sha &&
            run.head_branch === branch &&
            run.conclusion === "success"
          );
          if (!verify) throw new Error(`No successful iPad Edition Verify for exact commit ${sha}; deployment blocked.`);
          console.log(`Exact commit verified by run ${verify.id}: ${sha}`);
          NODE
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Unit tests
        run: npm test -- --reporter=dot
      - name: Build isolated Worker
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npx opennextjs-cloudflare build
      - name: Verify Preview credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing preview secret: CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing preview secret: CLOUDFLARE_ACCOUNT_ID" && exit 1)
      - name: Deploy dedicated iPad Edition Preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.ipad-edition-preview.toml
      - name: Verify isolated Preview route
        run: |
          node --input-type=module <<'NODE'
          const url = "https://libretv-ipad-edition-preview.bggdbh.workers.dev/ipad-edition";
          let response;
          let lastError = "no response";
          for (let attempt = 1; attempt <= 12; attempt += 1) {
            try {
              response = await fetch(url, { cache: "no-store", redirect: "manual" });
              if (response.ok) break;
              lastError = "HTTP " + response.status;
            } catch (error) {
              lastError = String(error);
            }
            if (attempt < 12) await new Promise(resolve => setTimeout(resolve, 5000));
          }
          if (!response?.ok) throw new Error("iPad Edition Preview did not respond: " + lastError);
          const html = await response.text();
          if (!(response.headers.get("content-type") || "").includes("text/html") || html.length < 1000 || !html.toLowerCase().includes("<html")) {
            throw new Error("Preview route did not return a complete HTML document.");
          }
          console.log("Dedicated iPad Edition Preview returned HTML successfully.");
          NODE
