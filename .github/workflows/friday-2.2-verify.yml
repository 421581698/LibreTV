name: friday-2.2-verify

on:
  push:
    branches:
      - feature/friday-2.2-architecture
      - fix/friday-orb-clean
    paths:
      - "src/lib/friday/**"
      - "src/components/friday/**"
      - "src/components/AIFloatingBall.tsx"
      - "src/components/header.tsx"
      - "src/app/page.tsx"
      - "src/app/api/chat/route.ts"
      - "public/media/**"
      - "docs/FRIDAY-2.2-TECHNICAL-SPEC.md"
      - ".github/workflows/friday-2.2-verify.yml"
  pull_request:
    branches:
      - main
    paths:
      - "src/lib/friday/**"
      - "src/components/friday/**"
      - "src/components/AIFloatingBall.tsx"
      - "src/components/header.tsx"
      - "src/app/page.tsx"
      - "src/app/api/chat/route.ts"
      - "public/media/**"
      - "docs/FRIDAY-2.2-TECHNICAL-SPEC.md"
      - ".github/workflows/friday-2.2-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        env:
          PASSWORD: ci-test-password
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
