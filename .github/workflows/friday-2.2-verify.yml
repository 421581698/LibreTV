name: friday-2.2-verify

on:
  push:
    branches:
      - feature/friday-playback-feedback-agent-2026-11-08
      - feature/friday-2.2-architecture
      - feature/libretv-eight-screen-glass-2026-11-09
    paths:
      - "src/lib/friday/**"
      - "src/lib/quality.ts"
      - "src/lib/quality.test.ts"
      - "src/lib/types.ts"
      - "src/components/switch-source.tsx"
      - "src/components/friday/**"
      - "src/components/home/**"
      - "src/app/watch/page.tsx"
      - ".github/workflows/friday-2.2-verify.yml"
  pull_request:
    branches:
      - main
      - feature/friday-quality-aware-source-ranking-2026-11-08
      - feature/libretv-v4-pc-light-homepage-2026-11-09
    paths:
      - "src/lib/friday/**"
      - "src/lib/quality.ts"
      - "src/lib/quality.test.ts"
      - "src/lib/types.ts"
      - "src/components/switch-source.tsx"
      - "src/components/friday/**"
      - "src/components/home/**"
      - "src/app/watch/page.tsx"
      - ".github/workflows/friday-2.2-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        env:
          PASSWORD: ci-test-password
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
