name: LibreTV Quality Engine Cloud Browser Matrix

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-engine-cloud-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-matrix:
    name: ${{ matrix.browser }} · desktop + responsive smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Build isolated test target
        env:
          PASSWORD: ci-test-password
          AUTH_DISABLED: 'true'
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build

      - name: Install isolated Playwright runner
        run: npm install --no-save --package-lock=false playwright@1.55.0

      - name: Install browser and OS dependencies
        env:
          QUALITY_BROWSER: ${{ matrix.browser }}
        run: npx playwright install --with-deps "$QUALITY_BROWSER"

      - name: Start isolated production server
        env:
          PASSWORD: ci-test-password
          AUTH_DISABLED: 'true'
          PORT: 8080
        run: |
          npm run start > /tmp/libretv-quality-server.log 2>&1 &
          echo $! > /tmp/libretv-quality-server.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/ >/dev/null; then
              echo "LibreTV isolated server is ready."
              exit 0
            fi
            sleep 2
          done
          cat /tmp/libretv-quality-server.log
          exit 1

      - name: Run browser-specific smoke suite
        env:
          QUALITY_BASE_URL: http://127.0.0.1:8080
          QUALITY_BROWSER: ${{ matrix.browser }}
          QUALITY_ARTIFACT_DIR: artifacts/quality-engine/${{ matrix.browser }}
        run: npm run quality:smoke

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-engine-cloud-${{ matrix.browser }}-${{ github.run_id }}
          path: |
            artifacts/quality-engine/
            /tmp/libretv-quality-server.log
          if-no-files-found: warn
          retention-days: 14
