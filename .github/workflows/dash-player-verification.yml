name: DASH Player Verification

on:
  push:
    branches:
      - feature/player-dash-mpd-support
    paths:
      - "package.json"
      - "package-lock.json"
      - "src/components/player-shell.tsx"
      - "src/lib/media-playback.ts"
      - "src/lib/media-playback.test.ts"
      - "src/lib/dash-request-auth.ts"
      - "src/lib/dash-request-auth.test.ts"
      - "src/lib/types.ts"
      - "scripts/dash-browser-playback-smoke.mjs"
      - ".github/workflows/dash-player-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install project dependencies
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build (no deployment)
        env:
          PASSWORD: ci-test-password
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
      - name: Install isolated Playwright runner
        run: npm install --no-save --package-lock=false playwright@1.55.0
      - name: Install Google Chrome with media codecs
        run: npx playwright install --with-deps chrome
      - name: Verify real DASH browser playback
        run: node scripts/dash-browser-playback-smoke.mjs
