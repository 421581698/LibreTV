name: HLS Browser Playback Smoke

on:
  push:
    branches:
      - feature/homepage-cinema-lobby-order-2026-11-11
      - feature/libretv-ipad-edition-product
    paths:
      - 'src/**'
      - ".github/workflows/deploy-ipad-edition-preview.yml"
      - ".github/workflows/hls-browser-playback-smoke.yml"
      - ".github/workflows/hls-external-smoke.yml"
      - ".github/workflows/scrapling-collector.yml"
      - ".github/workflows/resource-playback-verification.yml"
      - ".github/workflows/ipad-edition-verify.yml"
      - ".github/workflows/ipad-edition-redis-integration.yml"
      - "scripts/ipad-edition-two-instance-cancel-smoke.mjs"
      - 'src/lib/dolby/**'
      - 'src/lib/dolby-vision/**'
      - 'scripts/dolby-vision/**'
      - 'services/dolby-vision-parser/**'
      - 'scripts/hls-browser-playback-smoke.mjs'
      - 'scripts/cinema-v51-browser-audio-smoke.mjs'
      - '.github/workflows/hls-browser-playback-smoke.yml'
      - 'src/lib/m3u8-downloader.ts'
      - 'src/lib/m3u8-parse.ts'
      - 'src/components/player-shell.tsx'
      - 'src/components/live-player.tsx'
  pull_request:
    branches:
      - main
      - feature/libretv-ipad-edition-foundation
    paths:
      - 'src/**'
      - ".github/workflows/deploy-ipad-edition-preview.yml"
      - ".github/workflows/hls-browser-playback-smoke.yml"
      - ".github/workflows/hls-external-smoke.yml"
      - ".github/workflows/scrapling-collector.yml"
      - ".github/workflows/resource-playback-verification.yml"
      - ".github/workflows/ipad-edition-verify.yml"
      - ".github/workflows/ipad-edition-redis-integration.yml"
      - "scripts/ipad-edition-two-instance-cancel-smoke.mjs"
      - 'src/lib/dolby/**'
      - 'src/lib/dolby-vision/**'
      - 'scripts/dolby-vision/**'
      - 'services/dolby-vision-parser/**'
      - 'scripts/hls-browser-playback-smoke.mjs'
      - 'scripts/cinema-v51-browser-audio-smoke.mjs'
      - 'src/components/player-shell.tsx'
      - '.github/workflows/hls-browser-playback-smoke.yml'
      - 'src/lib/m3u8-downloader.ts'
      - 'src/lib/m3u8-parse.ts'
      - 'src/components/live-player.tsx'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-hls-playback:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install project dependencies
        run: npm ci
      - name: Install isolated Playwright runner
        run: npm install --no-save --package-lock=false playwright@1.55.0
      - name: Install Google Chrome with proprietary media codecs
        run: npx playwright install --with-deps chrome
      - name: Install WebKit runtime
        run: npx playwright install --with-deps webkit
      - name: Verify real browser HLS playback
        run: node scripts/hls-browser-playback-smoke.mjs
      - name: Install FFmpeg for real AAC fixture
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
      - name: Verify Cinema V5.1 real PCM DSP and virtual HRTF
        run: node scripts/cinema-v51-browser-audio-smoke.mjs
      - name: Verify Safari HLS PCM mirror, authenticated Packed AAC and A/V clock recovery
        run: npx vitest run src/lib/cinema-v51-safari-hls-audio.test.ts src/lib/cinema-v51-hls-clear-source.test.ts src/lib/cinema-v51-hls-aac.test.ts src/lib/cinema-v51-safari-adts-decoder.test.ts src/lib/cinema-v51-pcm-playback.test.ts
