name: LibreTV iPad Edition Verify

on:
  push:
    branches:
      - feature/libretv-ipad-edition-foundation
      - feature/libretv-ipad-edition-product
    paths:
      - "src/app/ipad-edition/**"
      - "src/components/ipad-edition/**"
      - "src/components/movie-detail-page.tsx"
      - "src/app/watch/page.tsx"
      - "src/lib/client-api.ts"
      - "src/lib/types.ts"
      - "src/lib/utils.ts"
      - "src/lib/ipad-edition/**"
      - "docs/ipad-edition/**"
      - "src/app/layout.tsx"
      - ".github/workflows/ipad-edition-verify.yml"
      - ".github/workflows/deploy-ipad-edition-preview.yml"
  pull_request:
    branches:
      - main
    paths:
      - "src/app/ipad-edition/**"
      - "src/components/ipad-edition/**"
      - "src/lib/ipad-edition/**"
      - "docs/ipad-edition/**"
      - "src/app/layout.tsx"
      - ".github/workflows/ipad-edition-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ipad-edition-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify iPad Edition foundation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: iPad Edition CSS structure audit
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import postcss from 'postcss';

          const path = 'src/app/ipad-edition/ipad-edition.css';
          const css = fs.readFileSync(path, 'utf8');
          const root = postcss.parse(css, { from: path });
          let emptyMedia = 0;
          let legacyHeroSelectors = 0;
          root.walkRules(rule => {
            if (/\.ipad-edition__hero(?:-[\w-]+)?(?![\w-])/.test(rule.selector)) legacyHeroSelectors += 1;
          });
          root.walkAtRules('media', rule => {
            if (!rule.nodes?.length) emptyMedia += 1;
          });
          const importantCount = (css.match(/!important/g) || []).length;
          const importantBudget = 283;
          const forbiddenLegacySystemTheme = /@media\s*\(\s*prefers-color-scheme/i.test(css);
          const requiredSelectors = [
            '.ipad-edition__cinema-hero',
            '.ipad-edition[data-environment="light"]',
            '.dark .ipad-edition__category-grid button',
          ];
          const missing = requiredSelectors.filter(selector => !css.includes(selector));
          console.log(JSON.stringify({ emptyMedia, legacyHeroSelectors, importantCount, importantBudget, forbiddenLegacySystemTheme, missing }));
          if (emptyMedia || legacyHeroSelectors || importantCount > importantBudget || forbiddenLegacySystemTheme || missing.length) {
            throw new Error('iPad Edition CSS structure audit failed.');
          }
          NODE
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Unit tests
        run: npm test -- --reporter=dot
      - name: Production build
        env:
          PASSWORD: ci-test-password
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
