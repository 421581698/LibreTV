name: LibreTV iPad Edition Verify

on:
  push:
    branches:
      - feature/libretv-ipad-edition-foundation
    paths:
      - "src/app/ipad-edition/**"
      - "src/components/ipad-edition/**"
      - "src/lib/ipad-edition/**"
      - "docs/ipad-edition/**"
      - "src/app/layout.tsx"
      - ".github/workflows/ipad-edition-verify.yml"
  pull_request:
    branches:
      - main
    paths:
      - "src/app/ipad-edition/**"
      - "src/components/ipad-edition/**"
      - "src/lib/ipad-edition/**"
      - "docs/ipad-edition/**"
      - "src/app/layout.tsx"
      - ".github/workflows/ipad-edition-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ipad-edition-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify iPad Edition foundation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Unit tests
        run: npm test -- --reporter=dot
      - name: Production build
        env:
          PASSWORD: ci-test-password
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
