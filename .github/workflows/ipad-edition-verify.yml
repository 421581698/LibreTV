permissions:
  contents: read

concurrency:
  group: ipad-edition-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify iPad Edition foundation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: iPad Edition CSS structure audit
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import postcss from 'postcss';

          const path = 'src/app/ipad-edition/ipad-edition.css';
          const css = fs.readFileSync(path, 'utf8');
          const heroCss = fs.readFileSync('src/app/ipad-edition/hero.css', 'utf8');
          const allIpadStyles = css + '\\n' + heroCss;
          const root = postcss.parse(css, { from: path });
          let emptyMedia = 0;
          let emptyRules = 0;
          let legacyHeroSelectors = 0;
          const layoutRoot = root.nodes.find(node => node.type === 'rule' && node.selector === '.ipad-edition');
          const shadowedRootThemeTokens = (layoutRoot?.nodes ?? [])
            .filter(node => node.type === 'decl' && /^--ipad-(page|surface|surface-solid|text|muted|line|accent|glass-blur)$/.test(node.prop))
            .map(node => node.prop);
          const hasEffectiveNodes = node => (node.nodes ?? []).some(child =>
            child.type === 'decl' || child.type === 'rule' ||
            (child.type === 'atrule' && hasEffectiveNodes(child))
          );
          root.walkRules(rule => {
            if (/\.ipad-edition__hero(?:-[\w-]+)?(?![\w-])/.test(rule.selector)) legacyHeroSelectors += 1;
            if (!hasEffectiveNodes(rule)) emptyRules += 1;
          });
          root.walkAtRules('media', rule => {
            if (!hasEffectiveNodes(rule)) emptyMedia += 1;
          });
          const importantCount = (css.match(/!important/g) || []).length;
          const importantBudget = 251;
          const forbiddenLegacySystemTheme = /@media\s*\(\s*prefers-color-scheme/i.test(css);
          const requiredSelectors = [
            '.ipad-edition__cinema-hero',
            '.ipad-edition[data-environment="light"]',
            '.ipad-edition[data-environment="dark"] .ipad-edition__category-grid button',
          ];
          const missing = requiredSelectors.filter(selector => !allIpadStyles.includes(selector));
          console.log(JSON.stringify({ emptyMedia, emptyRules, legacyHeroSelectors, shadowedRootThemeTokens, importantCount, importantBudget, forbiddenLegacySystemTheme, missing }));
          if (emptyMedia || emptyRules || legacyHeroSelectors || shadowedRootThemeTokens.length || importantCount > importantBudget || forbiddenLegacySystemTheme || missing.length) {
            throw new Error('iPad Edition CSS structure audit failed.');
          }
          NODE
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Unit tests
        run: npm test -- --reporter=dot
      - name: Two-instance isolated cancellation protocol integration smoke
        run: node scripts/ipad-edition-two-instance-cancel-smoke.mjs
      - name: AV1 decoded-frame timing extractor regression
        run: node --test --test-name-pattern='matches decoded AV1 MP4 frame PTS' scripts/dolby-vision/extract-av1-rpu.test.mjs
      - name: Install FFmpeg for Dolby audio codec smoke
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -hide_banner -version | head -n 1
          ffprobe -hide_banner -version | head -n 1
      - name: AC-3 and E-AC-3 real FFmpeg encode/decode regression
        run: node scripts/dolby/audio-codec-ffmpeg-smoke.mjs
      - name: HEVC frame mapper regression
        run: node --test scripts/dolby-vision/hevc-frame-mapper.test.mjs
      - name: Parser service syntax checks
        run: |
          node --check services/dolby-vision-parser/server.mjs
          node --check scripts/dolby-vision/hevc-frame-mapper.mjs
      - name: Production build
        env:
          PASSWORD: ci-test-password
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
