name: Deploy PR #61 Resource Verification Preview

on:
  push:
    branches:
      - feat/resource-playback-verification-v1
    paths:
      - ".github/workflows/deploy-pr61-resource-preview.yml"
      - "wrangler.pr61-resource-preview.toml"
      - "render.yaml"
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.*"
      - "open-next.config.*"
      - "services/scrapling-collector/**"
      - "docker-compose.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: libretv-pr61-resource-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    name: Build and deploy isolated PR #61 Preview
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: preview
    steps:
      - name: Checkout exact PR #61 commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript verification
        run: npm run typecheck

      - name: ESLint verification
        run: npm run lint

      - name: Unit tests
        run: npm test -- --reporter=dot

      - name: Verify isolated Preview configuration and credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          grep -Eq '^[[:space:]]*name[[:space:]]*=[[:space:]]*"libretv-pr61-resource-preview"' wrangler.pr61-resource-preview.toml
          grep -Eq '^[[:space:]]*AUTH_DISABLED[[:space:]]*=[[:space:]]*"true"' wrangler.pr61-resource-preview.toml
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing preview secret: CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing preview secret: CLOUDFLARE_ACCOUNT_ID" && exit 1)

      - name: Build isolated PR #61 Preview
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npx opennextjs-cloudflare build

      - name: Deploy isolated PR #61 Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.pr61-resource-preview.toml

      - name: Provision optional Scrapling Collector credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR61_SCRAPLING_API_BASE: ${{ secrets.PR61_SCRAPLING_API_BASE }}
          PR61_SCRAPLING_API_TOKEN: ${{ secrets.PR61_SCRAPLING_API_TOKEN }}
        run: |
          if [[ -n "$PR61_SCRAPLING_API_BASE" && -n "$PR61_SCRAPLING_API_TOKEN" ]]; then
            printf '%s' "$PR61_SCRAPLING_API_BASE" | npx wrangler secret put SCRAPLING_API_BASE --config wrangler.pr61-resource-preview.toml
            printf '%s' "$PR61_SCRAPLING_API_TOKEN" | npx wrangler secret put SCRAPLING_API_TOKEN --config wrangler.pr61-resource-preview.toml
          elif [[ -z "$PR61_SCRAPLING_API_BASE" && -z "$PR61_SCRAPLING_API_TOKEN" ]]; then
            echo "Scrapling Collector is not connected yet; keeping the Preview integration disabled."
          else
            echo "Both PR61_SCRAPLING_API_BASE and PR61_SCRAPLING_API_TOKEN must be configured together." >&2
            exit 1
          fi

      - name: Verify PR #61 Preview isolation and public access
        run: |
          node --input-type=module <<'NODE'
          const base = "https://libretv-pr61-resource-preview.bggdbh.workers.dev";
          async function request(path) {
            const response = await fetch(base + path, {
              redirect: "manual",
              headers: { "cache-control": "no-cache" },
              signal: AbortSignal.timeout(20000),
            });
            const body = await response.text();
            console.log(path + ": HTTP " + response.status + " " + (response.headers.get("content-type") || ""));
            return { response, body };
          }
          const [home, statusResult, collector] = await Promise.all([
            request("/"),
            request("/api/status"),
            request("/api/resource-collector"),
          ]);
          if (!(home.response.headers.get("content-type") || "").includes("text/html")) {
            throw new Error("PR #61 Preview homepage is not HTML.");
          }
          let status;
          try { status = JSON.parse(statusResult.body); }
          catch { throw new Error("/api/status did not return JSON."); }
          if (status.passwordRequired !== false || status.verified !== true) {
            throw new Error("PR #61 Preview must be public: passwordRequired=" + status.passwordRequired + ", verified=" + status.verified);
          }
          if (collector.response.status === 401 || collector.response.status === 403) {
            throw new Error("Public Preview Collector must not require the website password; got HTTP " + collector.response.status + ": " + collector.body.slice(0, 300));
          }
          if (collector.response.status === 503 && collector.body.includes("COLLECTOR_NOT_CONFIGURED")) {
            console.log("Collector route is reachable without a website password; Scrapling HTTPS URL and Token still need configuration.");
          } else {
            console.log("Collector route is reachable without a website password; upstream HTTP " + collector.response.status + ".");
          }
          console.log("PR #61 Preview verified: public homepage and password-independent Collector access.");
          NODE
