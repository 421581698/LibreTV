name: Deploy KKPhim Isolated Preview

on:
  push:
    branches:
      - feature/kkphim-full-integration-2026-11-12
    paths:
      - ".github/workflows/deploy-kkphim-preview.yml"
      - "wrangler.kkphim-preview.toml"
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.*"
      - "open-next.config.*"

permissions:
  contents: read

concurrency:
  group: libretv-kkphim-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    name: Build and deploy isolated KKPhim Preview
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: preview
    steps:
      - name: Checkout exact KKPhim commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --reporter=dot

      - name: Verify isolated Preview config and credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_GATE_KEY: ${{ secrets.LIBRETV_FRIDAY_V3_PREVIEW_GATE_KEY }}
        run: |
          grep -Eq '^[[:space:]]*name[[:space:]]*=[[:space:]]*"libretv-kkphim-preview"' wrangler.kkphim-preview.toml
          grep -Eq '^[[:space:]]*AUTH_DISABLED[[:space:]]*=[[:space:]]*"false"' wrangler.kkphim-preview.toml
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing preview secret: CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing preview secret: CLOUDFLARE_ACCOUNT_ID" && exit 1)
          test -n "$PREVIEW_GATE_KEY" || (echo "Missing preview secret: LIBRETV_FRIDAY_V3_PREVIEW_GATE_KEY" && exit 1)
          test "${#PREVIEW_GATE_KEY}" -ge 24 || (echo "Preview gate key must contain at least 24 characters" && exit 1)

      - name: Build isolated KKPhim Preview
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npx opennextjs-cloudflare build

      - name: Deploy isolated KKPhim Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.kkphim-preview.toml

      - name: Provision Preview password without logging its value
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_GATE_KEY: ${{ secrets.LIBRETV_FRIDAY_V3_PREVIEW_GATE_KEY }}
        run: printf '%s' "$PREVIEW_GATE_KEY" | npx wrangler secret put PASSWORD --config wrangler.kkphim-preview.toml

      - name: Verify deployed Preview gate and endpoints
        run: |
          node --input-type=module <<'NODE'
          const base = "https://libretv-kkphim-preview.bggdbh.workers.dev";
          const statusResponse = await fetch(base + "/api/status", {
            headers: { "cache-control": "no-cache" },
            signal: AbortSignal.timeout(20000),
          });
          if (!statusResponse.ok) throw new Error("/api/status returned " + statusResponse.status);
          const status = await statusResponse.json();
          if (status.passwordRequired !== true || status.verified !== false) {
            throw new Error("KKPhim Preview must remain password-protected.");
          }
          const homeResponse = await fetch(base + "/", {
            headers: { "cache-control": "no-cache" },
            redirect: "manual",
            signal: AbortSignal.timeout(20000),
          });
          const type = homeResponse.headers.get("content-type") || "";
          if (!type.includes("text/html")) {
            throw new Error("Preview homepage did not return HTML: " + homeResponse.status + " " + type);
          }
          const invalidAuth = await fetch(base + "/api/auth", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ password: "__invalid_kkphim_preview_password__" }),
            signal: AbortSignal.timeout(20000),
          });
          if (invalidAuth.status !== 401) {
            throw new Error("Invalid Preview password should return 401, got " + invalidAuth.status);
          }
          console.log("Verified isolated Preview: homepage reachable, password gate enabled, invalid password rejected.");
          console.log("Preview URL: " + base);
          NODE
