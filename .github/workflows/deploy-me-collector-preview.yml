name: Deploy My Space Intelligent Collector Preview

on:
  push:
    branches:
      - feature/me-intelligent-collector-entry
    paths:
      - ".github/workflows/deploy-me-collector-preview.yml"
      - "wrangler.me-collector-preview.toml"
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.*"
      - "open-next.config.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: libretv-me-collector-preview
  cancel-in-progress: false

jobs:
  deploy-preview:
    name: Build and deploy isolated password-protected preview
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: preview
    steps:
      - name: Checkout exact stacked PR commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript verification
        run: npm run typecheck

      - name: ESLint verification
        run: npm run lint

      - name: Unit tests
        run: npm test -- --reporter=dot

      - name: Verify isolated preview configuration and credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LIBRETV_FRIDAY_V3_PREVIEW_GATE_KEY: ${{ secrets.LIBRETV_FRIDAY_V3_PREVIEW_GATE_KEY }}
        run: |
          grep -Eq '^[[:space:]]*name[[:space:]]*=[[:space:]]*"libretv-me-collector-preview"' wrangler.me-collector-preview.toml
          grep -Eq '^[[:space:]]*AUTH_DISABLED[[:space:]]*=[[:space:]]*"false"' wrangler.me-collector-preview.toml
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing preview secret: CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing preview secret: CLOUDFLARE_ACCOUNT_ID" && exit 1)
          test -n "$LIBRETV_FRIDAY_V3_PREVIEW_GATE_KEY" || (echo "Missing preview secret: LIBRETV_FRIDAY_V3_PREVIEW_GATE_KEY" && exit 1)
          test "${#LIBRETV_FRIDAY_V3_PREVIEW_GATE_KEY}" -ge 24 || (echo "LIBRETV_FRIDAY_V3_PREVIEW_GATE_KEY must contain at least 24 characters" && exit 1)

      - name: Build isolated preview
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npx opennextjs-cloudflare build

      - name: Deploy isolated Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.me-collector-preview.toml

      - name: Provision preview password as Worker secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LIBRETV_FRIDAY_V3_PREVIEW_GATE_KEY: ${{ secrets.LIBRETV_FRIDAY_V3_PREVIEW_GATE_KEY }}
        run: printf '%s' "$LIBRETV_FRIDAY_V3_PREVIEW_GATE_KEY" | npx wrangler secret put PASSWORD --config wrangler.me-collector-preview.toml

      - name: Verify preview homepage and collector access boundary
        run: |
          node --input-type=module <<'NODE'
          const base = "https://libretv-me-collector-preview.bggdbh.workers.dev";
          async function request(path) {
            let lastError;
            for (let attempt = 1; attempt <= 8; attempt += 1) {
              try {
                const response = await fetch(base + path, {
                  redirect: "manual",
                  headers: { "cache-control": "no-cache" },
                  signal: AbortSignal.timeout(15000),
                });
                const body = await response.text();
                console.log(path + ": HTTP " + response.status + " " + (response.headers.get("content-type") || ""));
                if (response.status < 500) return { response, body };
                lastError = new Error(path + " returned " + response.status + ": " + body.slice(0, 400));
              } catch (error) {
                lastError = error;
              }
              if (attempt < 8) await new Promise((resolve) => setTimeout(resolve, 5000));
            }
            throw lastError;
          }
          const [home, statusResult, collector, studio] = await Promise.all([
            request("/"),
            request("/api/status"),
            request("/api/resource-collector"),
            request("/resource-studio"),
          ]);
          if (!(home.response.headers.get("content-type") || "").includes("text/html")) {
            throw new Error("Preview homepage did not return HTML.");
          }
          let status;
          try { status = JSON.parse(statusResult.body); }
          catch { throw new Error("/api/status did not return JSON."); }
          if (status.passwordRequired !== true || status.verified !== false) {
            throw new Error("Preview password gate is not active.");
          }
          if (collector.response.status !== 401) {
            throw new Error("Unauthenticated collector API must return 401, got " + collector.response.status);
          }
          if (![200, 302, 307, 401].includes(studio.response.status)) {
            throw new Error("Resource Studio route unexpected status: " + studio.response.status);
          }
          console.log("Preview smoke checks passed: homepage reachable, password gate active, collector API protected, Resource Studio route responds.");
          NODE
