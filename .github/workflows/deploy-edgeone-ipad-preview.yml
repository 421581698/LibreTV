name: Verify EdgeOne GitHub Preview readiness
# Existing nks GitHub integration owns deployment; this workflow verifies readiness only.
# It does not trigger or attest an external deployment.

on:
  push:
    branches:
      - feature/libretv-ipad-edition-product
  workflow_dispatch:
    inputs:
      confirm_preview_deploy:
        description: "Type yes to verify this branch for nks GitHub Preview"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: edgeone-ipad-preview
  cancel-in-progress: true

jobs:
  verify-readiness:
    if: ${{ github.ref == 'refs/heads/feature/libretv-ipad-edition-product' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.confirm_preview_deploy == 'yes')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout PR #99 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Require all five successful PR checks for this exact commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
          GH_BRANCH: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          const required = [
            "LibreTV iPad Edition Verify",
            "Resource Playback Verification",
            "HLS Browser Playback Smoke",
            "HLS External Stream Smoke",
            "Scrapling Collector",
          ];
          const url = new URL(`https://api.github.com/repos/${process.env.GH_REPOSITORY}/actions/runs`);
          url.searchParams.set("branch", process.env.GH_BRANCH);
          url.searchParams.set("head_sha", process.env.GH_SHA);
          url.searchParams.set("event", "pull_request");
          url.searchParams.set("per_page", "100");
          const headers = {
            accept: "application/vnd.github+json",
            authorization: `Bearer ${process.env.GH_TOKEN}`,
            "x-github-api-version": "2022-11-28",
          };
          for (let attempt = 1; attempt <= 144; attempt += 1) {
            const response = await fetch(url, { headers });
            if (!response.ok) throw new Error(`Cannot inspect CI runs: HTTP ${response.status}`);
            const payload = await response.json();
            const runs = (payload.workflow_runs ?? []).filter(run =>
              run.head_sha === process.env.GH_SHA &&
              run.head_branch === process.env.GH_BRANCH &&
              run.event === "pull_request"
            );
            const latest = required.map(name => runs.filter(run => run.name === name)
              .sort((a, b) => b.run_number - a.run_number || b.id - a.id)[0]);
            console.log(JSON.stringify(required.map((name, i) => ({
              name, id: latest[i]?.id, status: latest[i]?.status ?? "missing",
              conclusion: latest[i]?.conclusion ?? null
            }))));
            if (latest.every(run => run?.status === "completed" && run.conclusion === "success")) {
              console.log("All five required PR checks passed for " + process.env.GH_SHA);
              process.exit(0);
            }
            if (latest.some(run => run?.status === "completed" && run.conclusion !== "success")) {
              throw new Error("A required CI check did not pass; Preview deployment blocked.");
            }
            if (attempt < 144) await new Promise(resolve => setTimeout(resolve, 15000));
          }
          throw new Error("Timed out waiting for all five exact-SHA PR checks; Preview deployment blocked.");
          NODE

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.11.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Record GitHub integration handoff
        run: |
          echo "## EdgeOne GitHub Preview readiness" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "All required CI checks and local build passed." >> "$GITHUB_STEP_SUMMARY"
          echo "Existing nks GitHub integration must deploy this branch as Preview." >> "$GITHUB_STEP_SUMMARY"
          echo "External deployment is NOT verified by this workflow." >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Verify nks Preview branch configuration and matching deployment SHA in EdgeOne console."
