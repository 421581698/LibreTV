name: Deploy LibreTV iPad Edition Preview to EdgeOne
# PR #99 pushes deploy only after all five exact-SHA PR checks succeed.
# Re-run after repository deployment secret refresh; Preview only.

on:
  push:
    branches:
      - feature/libretv-ipad-edition-product
  workflow_dispatch:
    inputs:
      confirm_preview_deploy:
        description: "Type yes to deploy this branch to the nks Preview environment (never Production)"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: edgeone-ipad-preview
  cancel-in-progress: true

jobs:
  verify-and-deploy:
    if: ${{ github.ref == 'refs/heads/feature/libretv-ipad-edition-product' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.confirm_preview_deploy == 'yes')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout PR #99 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Require all five successful PR checks for this exact commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
          GH_BRANCH: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          const required = [
            "LibreTV iPad Edition Verify",
            "Resource Playback Verification",
            "HLS Browser Playback Smoke",
            "HLS External Stream Smoke",
            "Scrapling Collector",
          ];
          const url = new URL(`https://api.github.com/repos/${process.env.GH_REPOSITORY}/actions/runs`);
          url.searchParams.set("branch", process.env.GH_BRANCH);
          url.searchParams.set("head_sha", process.env.GH_SHA);
          url.searchParams.set("event", "pull_request");
          url.searchParams.set("per_page", "100");
          const headers = {
            accept: "application/vnd.github+json",
            authorization: `Bearer ${process.env.GH_TOKEN}`,
            "x-github-api-version": "2022-11-28",
          };
          for (let attempt = 1; attempt <= 144; attempt += 1) {
            const response = await fetch(url, { headers });
            if (!response.ok) throw new Error(`Cannot inspect CI runs: HTTP ${response.status}`);
            const payload = await response.json();
            const runs = (payload.workflow_runs ?? []).filter(run =>
              run.head_sha === process.env.GH_SHA &&
              run.head_branch === process.env.GH_BRANCH &&
              run.event === "pull_request"
            );
            const latest = required.map(name => runs.filter(run => run.name === name)
              .sort((a, b) => b.run_number - a.run_number || b.id - a.id)[0]);
            console.log(JSON.stringify(required.map((name, i) => ({
              name, id: latest[i]?.id, status: latest[i]?.status ?? "missing",
              conclusion: latest[i]?.conclusion ?? null
            }))));
            if (latest.every(run => run?.status === "completed" && run.conclusion === "success")) {
              console.log("All five required PR checks passed for " + process.env.GH_SHA);
              process.exit(0);
            }
            if (latest.some(run => run?.status === "completed" && run.conclusion !== "success")) {
              throw new Error("A required CI check did not pass; Preview deployment blocked.");
            }
            if (attempt < 144) await new Promise(resolve => setTimeout(resolve, 15000));
          }
          throw new Error("Timed out waiting for all five exact-SHA PR checks; Preview deployment blocked.");
          NODE

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.11.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      # Install the CLI before exposing the deployment credential to any process.
      - name: Install EdgeOne Makers CLI
        env:
          PAGES_SOURCE: skills
        run: |
          npm install --global edgeone@latest
          CLI_VERSION="$(edgeone -v | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)"
          if [ -z "$CLI_VERSION" ]; then
            echo "::error::Unable to determine EdgeOne CLI version."
            exit 1
          fi
          node - "$CLI_VERSION" <<'NODE'
          const [major, minor, patch] = process.argv[2].split('.').map(Number);
          const actual = [major, minor, patch];
          const minimum = [1, 7, 0];
          const lower = actual.some((value, index) => value < minimum[index] &&
            actual.slice(0, index).every((part, prior) => part === minimum[prior]));
          if (lower) {
            console.error(`EdgeOne CLI ${process.argv[2]} is below required 1.7.0.`);
            process.exit(1);
          }
          NODE

      # Separate authentication from deployment to identify token/workspace failures.
      # Login output is suppressed so the credential can never appear in Actions logs.
      - name: Authenticate and identify EdgeOne Workspace
        env:
          EDGEONE_PAGES_API_TOKEN: ${{ secrets.EDGEONE_PAGES_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${EDGEONE_PAGES_API_TOKEN:-}" ]; then
            echo "::error::Missing repository secret EDGEONE_PAGES_API_TOKEN."
            exit 1
          fi
          if ! edgeone login --site china -t "$EDGEONE_PAGES_API_TOKEN" >/dev/null 2>&1; then
            echo "::error::EdgeOne token authentication failed. Check the existing repository secret and its Makers Workspace/site; do not create another token yet."
            exit 1
          fi
          echo "EdgeOne token authentication succeeded."
          echo "Authenticated Workspace:"
          edgeone whoami
          echo "Workspace associations:"
          edgeone workspace ls

      - name: Deploy to EdgeOne nks Preview only
        id: deploy
        env:
          EDGEONE_PAGES_API_TOKEN: ${{ secrets.EDGEONE_PAGES_API_TOKEN }}
          EDGEONE_PAGES_API_REGION: china
          PAGES_SOURCE: skills
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${EDGEONE_PAGES_API_TOKEN:-}" ]; then
            echo "::error::Missing repository secret EDGEONE_PAGES_API_TOKEN."
            exit 1
          fi
          set +e
          OUTPUT="$(edgeone makers deploy ./.next -n nks -e preview --site china --json -t "$EDGEONE_PAGES_API_TOKEN" 2>&1)"
          DEPLOY_EXIT=$?
          set -e
          LAST_LINE="$(printf '%s\n' "$OUTPUT" | tail -n 1)"
          if [ "$DEPLOY_EXIT" -ne 0 ]; then
            EDGEONE_SAFE_TOKEN="$EDGEONE_PAGES_API_TOKEN" node - "$LAST_LINE" <<'NODE'
          let result;
          try { result = JSON.parse(process.argv[2] || ''); } catch {}
          const token = process.env.EDGEONE_SAFE_TOKEN || '';
          let message = String(result?.error || result?.message || 'EdgeOne CLI returned a non-zero exit code.');
          if (token) message = message.split(token).join('[REDACTED]');
          console.error(`EdgeOne deploy error: ${message}`);
          if (result?.errorCode || result?.code) console.error(`Error code: ${result.errorCode || result.code}`);
          NODE
            exit "$DEPLOY_EXIT"
          fi
          node - "$LAST_LINE" "$GITHUB_OUTPUT" "$GITHUB_STEP_SUMMARY" <<'NODE'
          const fs = require('node:fs');
          let result;
          try { result = JSON.parse(process.argv[2]); }
          catch { console.error('EdgeOne CLI did not return valid JSON.'); process.exit(1); }
          if (result.status !== 'success' || !result.url) {
            console.error(result.error || 'EdgeOne did not confirm a successful Preview deployment.');
            process.exit(1);
          }
          const url = result.url;
          process.stdout.write(`::add-mask::${url}\\n`);
          const output = process.argv[3];
          const summary = process.argv[4];
          fs.appendFileSync(output, `preview_url=${url}\\nproject_id=${result.projectId || ''}\\nconsole_url=${result.consoleUrl || ''}\\n`);
          fs.appendFileSync(summary, `## EdgeOne Preview deployment\\n\\n- Project: \`nks\`\\n- Environment: **Preview**\\n- URL: ${url}\\n- Project ID: ${result.projectId || 'not returned'}\\n`);
          console.log('EdgeOne confirmed a successful Preview deployment for project nks.');
          NODE
