name: Deploy Friday Spatial OS V4 Public Preview

on:
  push:
    branches:
      - feature/friday-spatial-os-v4
  workflow_dispatch:
    inputs:
      confirm_preview_deploy:
        description: "确认部署 V4 到独立的公开 Preview Worker（不会部署生产）"
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"

permissions:
  contents: read

concurrency:
  group: friday-spatial-os-v4-public-preview
  cancel-in-progress: false

jobs:
  deploy-preview:
    if: ${{ github.event_name == 'push' || inputs.confirm_preview_deploy == 'yes' }}
    name: Build and deploy isolated V4 preview
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: preview
    steps:
      - name: Checkout V4 branch
        uses: actions/checkout@v4
        with:
          ref: feature/friday-spatial-os-v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build V4 Preview
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npx opennextjs-cloudflare build

      - name: Deploy isolated V4 Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.preview.toml

      - name: Verify deployed public Preview access
        run: |
          node --input-type=module <<'NODE'
          const base = "https://libretv-homepage-preview.bggdbh.workers.dev";
          const statusResponse = await fetch(base + "/api/status");
          if (!statusResponse.ok) throw new Error("Preview status endpoint returned " + statusResponse.status);
          const status = await statusResponse.json();
          if (status.passwordRequired !== false || status.verified !== true) {
            throw new Error("Preview access is not public: passwordRequired=" + status.passwordRequired + ", verified=" + status.verified);
          }
          console.log("V4 Preview deployed; public access verified without login.");
          NODE
