name: Deploy Standalone Public Preview

on:
  push:
    branches:
      - feat/pr60-standalone-preview-2026-11-10
    paths:
      - ".github/workflows/deploy-standalone-preview.yml"
      - "wrangler.standalone-preview.toml"
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.*"
      - "open-next.config.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: libretv-standalone-public-preview
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy isolated public preview
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: preview
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript verification
        run: npm run typecheck

      - name: ESLint verification
        run: npm run lint

      - name: Unit tests
        run: npm test -- --reporter=dot

      - name: Verify isolated public preview configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          grep -Eq '^[[:space:]]*name[[:space:]]*=[[:space:]]*"libretv-standalone-preview"' wrangler.standalone-preview.toml
          grep -Eq '^[[:space:]]*AUTH_DISABLED[[:space:]]*=[[:space:]]*"true"' wrangler.standalone-preview.toml
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing preview secret: CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing preview secret: CLOUDFLARE_ACCOUNT_ID" && exit 1)

      - name: Build standalone preview
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npx opennextjs-cloudflare build

      - name: Deploy standalone preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.standalone-preview.toml

      - name: Verify public homepage and disabled private collector
        run: |
          node --input-type=module <<'NODE'
          const base = "https://libretv-standalone-preview.bggdbh.workers.dev";
          async function request(path) {
            const response = await fetch(base + path, {
              redirect: "manual",
              headers: { "cache-control": "no-cache" },
              signal: AbortSignal.timeout(20000),
            });
            const body = await response.text();
            console.log(path + ": HTTP " + response.status + " " + (response.headers.get("content-type") || ""));
            return { response, body };
          }
          const [home, collector] = await Promise.all([
            request("/"),
            request("/api/resource-collector"),
          ]);
          if (!home.response.ok || !(home.response.headers.get("content-type") || "").includes("text/html")) {
            throw new Error("Standalone Preview homepage did not return successful HTML.");
          }
          if (collector.response.status !== 403) {
            throw new Error("Private Collector operations must remain disabled in the public preview; expected 403, got " + collector.response.status + ": " + collector.body.slice(0, 300));
          }
          console.log("Standalone public Preview verified: homepage reachable; private Collector operations remain disabled.");
          NODE
