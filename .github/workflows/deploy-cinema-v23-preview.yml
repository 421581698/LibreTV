name: Deploy Cinema Engine V2.3 Isolated Preview

on:
  push:
    branches:
      - feature/cinema-engine-v2-3-integration
    paths:
      - ".github/workflows/deploy-cinema-v23-preview.yml"
      - "wrangler.cinema-v23-preview.toml"
      - "scripts/pr84-preview-player-smoke.mjs"
      - "scripts/cinema-v23-mobile-emulation-smoke.mjs"
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.*"
      - "open-next.config.*"
      - "docs/player/CINEMA-ENGINE-V2-3-INTEGRATION-TRACKER.md"

permissions:
  contents: read

concurrency:
  group: libretv-cinema-v23-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    if: contains(github.event.head_commit.message, '[cinema-v2.3-preview]')
    name: Build, deploy and browser-smoke-test isolated Cinema V2.3 Preview
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: preview
    steps:
      - name: Checkout exact feature commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript verification
        run: npm run typecheck

      - name: ESLint verification
        run: npm run lint

      - name: Unit tests
        run: npm test -- --reporter=dot

      - name: Prepare self-hosted ASS renderer assets
        run: npm run prepare:jassub-assets

      - name: Verify isolated Worker config and Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          grep -Eq '^[[:space:]]*name[[:space:]]*=[[:space:]]*"libretv-cinema-v23-preview"' wrangler.cinema-v23-preview.toml
          grep -Eq '^[[:space:]]*AUTH_DISABLED[[:space:]]*=[[:space:]]*"true"' wrangler.cinema-v23-preview.toml
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing preview secret: CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing preview secret: CLOUDFLARE_ACCOUNT_ID" && exit 1)

      - name: Build isolated Preview
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npx opennextjs-cloudflare build

      - name: Deploy isolated Preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.cinema-v23-preview.toml

      - name: Verify deployed Preview endpoints
        env:
          CINEMA_PREVIEW_URL: https://libretv-cinema-v23-preview.bggdbh.workers.dev
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.CINEMA_PREVIEW_URL;
          for (const path of ["/", "/watch", "/api/status"]) {
            const response = await fetch(base + path, {
              redirect: "follow",
              headers: { "cache-control": "no-cache" },
              signal: AbortSignal.timeout(30000),
            });
            const body = await response.text();
            if (response.status !== 200) {
              throw new Error(path + " returned HTTP " + response.status + ": " + body.slice(0, 500));
            }
            if (path === "/api/status") {
              const status = JSON.parse(body);
              if (status.passwordRequired !== false || status.verified !== true) {
                throw new Error("Isolated Preview auth/status invariant failed: " + JSON.stringify(status));
              }
            } else if (!(response.headers.get("content-type") || "").includes("text/html")) {
              throw new Error(path + " did not return HTML");
            }
            console.log("PASS " + path + " HTTP 200");
          }
          NODE

      - name: Install Playwright and Chrome for actual PlayerShell acceptance
        timeout-minutes: 12
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chrome

      - name: Verify PlayerShell fMP4 playback, controls, seek and source switching
        env:
          PR84_PREVIEW_URL: https://libretv-cinema-v23-preview.bggdbh.workers.dev
          PR84_BROWSER_CHANNEL: chrome
        run: node scripts/pr84-preview-player-smoke.mjs

      - name: Verify iPhone/iPad viewport, rotation and split-view emulation
        env:
          CINEMA_PREVIEW_URL: https://libretv-cinema-v23-preview.bggdbh.workers.dev
        run: node scripts/cinema-v23-mobile-emulation-smoke.mjs

      - name: Upload PlayerShell acceptance screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinema-v23-preview-player-acceptance
          path: |
            /tmp/pr84-preview-player.png
            /tmp/cinema-v23-*.png
          if-no-files-found: ignore
