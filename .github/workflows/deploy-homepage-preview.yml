name: Deploy LibreTV Eight-Screen Glass Preview

on:
  workflow_dispatch:
    inputs:
      confirm_preview_deploy:
        description: "确认部署到独立的受密码保护 Preview Worker（不会部署正式环境）"
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"

permissions:
  contents: read

concurrency:
  group: libretv-homepage-preview
  cancel-in-progress: false

jobs:
  deploy-preview:
    if: ${{ github.ref == 'refs/heads/feature/libretv-eight-screen-glass-2026-11-09' && inputs.confirm_preview_deploy == 'yes' }}
    name: Build and deploy isolated password-protected preview Worker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: preview
    steps:
      - name: Checkout exact feature commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build eight-screen preview
        env:
          NEXT_PUBLIC_HOME_V2: "true"
          NEXT_TELEMETRY_DISABLED: "1"
        run: npx opennextjs-cloudflare build

      - name: Verify Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing preview secret: CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing preview secret: CLOUDFLARE_ACCOUNT_ID" && exit 1)

      - name: Deploy isolated password-protected preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.preview.toml

      - name: Verify preview password protection is active
        run: |
          node --input-type=module <<'NODE'
          const base = "https://libretv-homepage-preview.bggdbh.workers.dev";
          const statusResponse = await fetch(base + "/api/status", { redirect: "manual" });
          if (!statusResponse.ok) throw new Error("Preview status endpoint returned " + statusResponse.status);
          const status = await statusResponse.json();
          if (status.passwordRequired !== true || status.verified === true) {
            throw new Error("Preview authentication is not enabled or is unexpectedly bypassed.");
          }
          const authResponse = await fetch(base + "/api/auth", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: "{}"
          });
          if (authResponse.status !== 401) {
            throw new Error("Preview PASSWORD secret is missing or auth is misconfigured (expected 401, got " + authResponse.status + ").");
          }
          console.log("Preview password gate verified; no password value was exposed.");
          NODE
