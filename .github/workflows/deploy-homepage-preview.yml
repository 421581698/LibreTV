name: Deploy LibreTV Eight-Screen Glass Preview

on:
  push:
    branches:
      - feature/libretv-eight-screen-glass-2026-11-09
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: libretv-homepage-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    if: ${{ github.ref == 'refs/heads/feature/libretv-eight-screen-glass-2026-11-09' }}
    name: Build and deploy protected isolated preview Worker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: preview
    steps:
      - name: Checkout exact feature commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript verification
        run: npm run typecheck

      - name: ESLint verification
        run: npm run lint

      - name: Unit tests
        run: npm test -- --reporter=dot

      - name: Verify preview authentication configuration
        env:
          PREVIEW_GATE_KEY: ${{ secrets.LIBRETV_FRIDAY_V3_PREVIEW_GATE_KEY }}
        run: |
          grep -Eq '^[[:space:]]*AUTH_DISABLED[[:space:]]*=[[:space:]]*"false"' wrangler.preview.toml
          if grep -Eq '^[[:space:]]*AUTH_DISABLED[[:space:]]*=[[:space:]]*"true"' wrangler.preview.toml; then
            echo "Preview must remain password-protected"
            exit 1
          fi
          test -n "$PREVIEW_GATE_KEY" || (echo "Missing preview secret: LIBRETV_FRIDAY_V3_PREVIEW_GATE_KEY" && exit 1)
          test "${#PREVIEW_GATE_KEY}" -ge 24 || (echo "Preview gate key must contain at least 24 characters" && exit 1)

      - name: Build eight-screen preview
        env:
          NEXT_PUBLIC_HOME_V2: "true"
          NEXT_TELEMETRY_DISABLED: "1"
        run: npx opennextjs-cloudflare build

      - name: Verify Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing preview secret: CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing preview secret: CLOUDFLARE_ACCOUNT_ID" && exit 1)

      - name: Deploy password-protected isolated preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.preview.toml

      - name: Set Preview Worker password without logging its value
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_GATE_KEY: ${{ secrets.LIBRETV_FRIDAY_V3_PREVIEW_GATE_KEY }}
        run: printf '%s' "$PREVIEW_GATE_KEY" | npx wrangler secret put PASSWORD --config wrangler.preview.toml

      - name: Verify deployed homepage and password gate
        run: |
          node --input-type=module <<'NODE'
          const base = "https://libretv-homepage-preview.bggdbh.workers.dev";
          const checks = [
            { path: "/", expected: 200, contentType: "text/html" },
            { path: "/api/status", expected: 200, contentType: "application/json" },
          ];
          for (const check of checks) {
            let response;
            for (let attempt = 1; attempt <= 6; attempt += 1) {
              response = await fetch(base + check.path, {
                redirect: "follow",
                headers: { "cache-control": "no-cache" },
              });
              if (response.status === check.expected) break;
              const body = (await response.clone().text()).slice(0, 600);
              if (attempt === 6) {
                throw new Error(check.path + " returned HTTP " + response.status +
                  " (expected " + check.expected + "); content-type=" +
                  response.headers.get("content-type") + "; body=" + body);
              }
              await new Promise((resolve) => setTimeout(resolve, attempt * 3000));
            }
            const type = response.headers.get("content-type") ?? "";
            if (!type.includes(check.contentType)) throw new Error(check.path + " unexpected content-type: " + type);
            const body = await response.text();
            if (check.path === "/" && !body.toLowerCase().includes("libretv")) throw new Error("Homepage did not contain LibreTV markup");
            if (check.path === "/api/status") {
              const status = JSON.parse(body);
              if (status.passwordRequired !== true || status.verified !== false) {
                throw new Error("Preview gate is not active: passwordRequired=" + status.passwordRequired + ", verified=" + status.verified);
              }
            }
            console.log("Verified " + check.path + ": HTTP " + response.status + " (" + type + ")");
          }
          const authResponse = await fetch(base + "/api/auth", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ password: "__invalid_preview_smoke_password__" }),
          });
          if (authResponse.status !== 401) {
            throw new Error("Expected invalid Preview password to return 401, got " + authResponse.status);
          }
          console.log("Preview authentication gate verified.");
          NODE
