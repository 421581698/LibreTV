name: Scrapling Engine CI

on:
  push:
    branches:
      - feature/scrapling-engine-phase1
      - feature/fmhy-resource-directory-phase2
    paths:
      - "scrapling-engine/**"
      - ".github/workflows/scrapling-engine.yml"
  pull_request:
    paths:
      - "scrapling-engine/**"
      - ".github/workflows/scrapling-engine.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scrapling-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scrapling-engine/pyproject.toml
      - name: Install engine and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: Public HTTP and Spider smoke test
        run: |
          python - <<'PY'
          import asyncio

          from app.robots import ensure_robots_allowed
          from app.scraper import ScraplingAdapter
          from app.security import validate_public_http_url
          from app.spider import ScraplingSpiderAdapter

          target = validate_public_http_url("https://example.com/")
          ensure_robots_allowed(target, timeout=15)
          page = ScraplingAdapter.fetch_page(target, timeout=15)
          assert page.status == 200, f"Unexpected HTTP status: {page.status}"
          assert "Example Domain" in page.get_all_text(strip=True)

          spider_result = asyncio.run(
              ScraplingSpiderAdapter.crawl_async([target])
          )
          assert spider_result["items"], "Spider returned no items"
          assert "Example Domain" in spider_result["items"][0]["text"]
          print("Public Fetcher and Spider smoke tests passed.")
          PY
