name: Scrapling Engine CI

on:
  push:
    branches:
      - feature/scrapling-engine-phase1
      - feature/ai-scrapling-autonomous-integration
    paths:
      - "scrapling-engine/**"
      - "docker-compose.yml"
      - "scripts/verify-crawler-containers.sh"
      - ".github/workflows/scrapling-engine.yml"
  pull_request:
    paths:
      - "scrapling-engine/**"
      - "docker-compose.yml"
      - "scripts/verify-crawler-containers.sh"
      - ".github/workflows/scrapling-engine.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scrapling_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d scrapling_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/scrapling_test
    defaults:
      run:
        working-directory: scrapling-engine
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scrapling-engine/pyproject.toml
      - name: Install engine and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Check formatting for changed Python files
        run: |
          changed_files="$(git diff --name-only HEAD^ HEAD -- 'scrapling-engine/*.py' 'scrapling-engine/**/*.py' | sed 's#^scrapling-engine/##')"
          if [ -n "$changed_files" ]; then
            printf '%s\\n' "$changed_files" | xargs ruff format --check
          else
            echo "No changed Scrapling Python files to format-check."
          fi
      - name: Enforce outbound client import boundary
        working-directory: .
        run: python scripts/check-egress-client-boundary.py
      - name: Test
        run: pytest -q
      - name: Real crawler container runtime acceptance
        working-directory: .
        env:
          PASSWORD: ci-password
          SCRAPLING_API_KEY: ci-scrapling-api-key-0123456789abcdef
          SCRAPLING_DB_PASSWORD: ci-db-password
        run: bash scripts/verify-crawler-containers.sh
      - name: Public HTTP and Spider smoke test
        run: |
          python - <<'PY'
          import asyncio

          from app.robots import ensure_robots_allowed
          from app.scraper import ScraplingAdapter
          from app.security import validate_public_http_url
          from app.spider import ScraplingSpiderAdapter

          target = validate_public_http_url("https://example.com/")
          ensure_robots_allowed(target, timeout=15)
          page = ScraplingAdapter.fetch_page(target, timeout=15)
          assert page.status == 200, f"Unexpected HTTP status: {page.status}"
          assert "Example Domain" in page.get_all_text(strip=True)

          spider_result = asyncio.run(
              ScraplingSpiderAdapter.crawl_async([target])
          )
          assert spider_result["items"], "Spider returned no items"
          assert "Example Domain" in spider_result["items"][0]["text"]
          print("Public Fetcher and Spider smoke tests passed.")
          PY
