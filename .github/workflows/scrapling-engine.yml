name: Scrapling Engine CI

on:
  push:
    branches:
      - feature/scrapling-engine-phase1
      - feature/fmhy-resource-directory-phase2
    paths:
      - "scrapling-engine/**"
      - ".github/workflows/scrapling-engine.yml"
  pull_request:
    paths:
      - "scrapling-engine/**"
      - ".github/workflows/scrapling-engine.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scrapling-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scrapling-engine/pyproject.toml
      - name: Install engine and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: Public HTTP and Spider smoke test
        run: |
          python - <<'PY'
          import asyncio

          from app.robots import ensure_robots_allowed
          from app.scraper import ScraplingAdapter
          from app.security import validate_public_http_url
          from app.spider import ScraplingSpiderAdapter

          target = validate_public_http_url("https://example.com/")
          ensure_robots_allowed(target, timeout=15)
          page = ScraplingAdapter.fetch_page(target, timeout=15)
          assert page.status == 200, f"Unexpected HTTP status: {page.status}"
          assert "Example Domain" in page.get_all_text(strip=True)

          spider_result = asyncio.run(
              ScraplingSpiderAdapter.crawl_async([target])
          )
          assert spider_result["items"], "Spider returned no items"
          assert "Example Domain" in spider_result["items"][0]["text"]
          print("Public Fetcher and Spider smoke tests passed.")
          PY
      - name: FMHY official source import smoke test
        run: |
          python - <<'PY'
          import asyncio
          import tempfile
          from pathlib import Path

          from app.catalog_store import CatalogStore
          from app.fmhy_catalog import (
              FMHY_SOURCE_FILES,
              fetch_official_fmhy_sources,
              parse_fmhy_markdown,
          )

          async def main():
              sources, revision = await fetch_official_fmhy_sources()
              assert len(sources) == len(FMHY_SOURCE_FILES) == 25
              assert set(sources) == set(FMHY_SOURCE_FILES)
              entries = [
                  entry
                  for source_file, markdown in sources.items()
                  for entry in parse_fmhy_markdown(source_file, markdown)
              ]
              assert entries, "FMHY parser returned no catalog entries"
              with tempfile.TemporaryDirectory() as directory:
                  store = CatalogStore(str(Path(directory) / "catalog.sqlite3"))
                  store.initialize()
                  snapshot = store.import_snapshot(
                      entries,
                      source_repository="fmhy/edit",
                      source_branch="main",
                      source_revision=revision,
                      source_count=len(sources),
                  )
                  assert snapshot["entry_count"] == len(entries)
                  assert snapshot["unique_domain_count"] > 0
                  print(
                      "FMHY import passed:",
                      revision,
                      snapshot["entry_count"],
                      "entries /",
                      snapshot["unique_domain_count"],
                      "domains",
                  )

          asyncio.run(main())
          PY
