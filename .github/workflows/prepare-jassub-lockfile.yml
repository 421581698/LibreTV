name: Prepare JASSUB lockfile

on:
  push:
    branches:
      - feature/cinema-engine-v2-3-integration
    paths:
      - package.json

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cinema-engine-v2-3-integration
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Generate the exact npm lockfile without running package scripts
        run: npm install --package-lock-only --ignore-scripts --save-exact jassub@2.5.38
      - name: Commit lockfile
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No lockfile changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(subtitles): lock JASSUB runtime dependencies"
          git push origin HEAD:feature/cinema-engine-v2-3-integration
