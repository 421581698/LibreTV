name: scrapling-collector-checks

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - feat/iphone-inline-play-top-search-2026-11-09
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/scrapling-collector/requirements.txt
      - name: Install Scrapling collector dependencies
        run: python -m pip install -r services/scrapling-collector/requirements.txt
      - name: Run collector security and discovery tests
        env:
          SCRAPLING_API_TOKEN: collector-ci-test-token
        run: python -m unittest discover -s services/scrapling-collector -p 'test_*.py' -v
