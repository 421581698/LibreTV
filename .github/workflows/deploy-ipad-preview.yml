name: Deploy Isolated iPad Cinema Preview

on:
  workflow_dispatch:
    inputs:
      confirm_preview_deploy:
        description: "确认仅部署到已启用 Cloudflare Access 的独立 libretv-ipad-preview Worker"
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"
  push:
    branches:
      - feature/ipad-cinema-preview-deploy
    paths:
      - .github/workflows/deploy-ipad-preview.yml

permissions:
  contents: read

concurrency:
  group: libretv-ipad-preview-deploy
  cancel-in-progress: false

jobs:
  deploy-preview:
    if: ${{ github.ref == 'refs/heads/feature/ipad-cinema-preview-deploy' && ((github.event_name == 'workflow_dispatch' && inputs.confirm_preview_deploy == 'yes') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-ipad-preview]'))) }}
    name: Build and deploy isolated iPad preview
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: preview
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify source commit and isolated target
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git merge-base --is-ancestor "cbc3d0e35b29a81719fcb8bb376fa89b1768302e" "$SOURCE_SHA" || (echo "Deployment commit does not descend from the visually accepted iPad baseline" && exit 1)
          grep -Eq '^[[:space:]]*name[[:space:]]*=[[:space:]]*"libretv-ipad-preview"' wrangler.ipad-preview.toml
          grep -Eq '^[[:space:]]*AUTH_DISABLED[[:space:]]*=[[:space:]]*"true"' wrangler.ipad-preview.toml

      - name: Verify Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing preview secret: CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing preview secret: CLOUDFLARE_ACCOUNT_ID" && exit 1)

      # Fail closed: do not deploy until the dedicated workers.dev hostname is
      # already protected by Cloudflare Access and anonymous requests redirect to login.
      - name: Verify Cloudflare Access gate before deployment
        run: |
          node --input-type=module <<'NODE'
          const url = "https://libretv-ipad-preview.bggdbh.workers.dev/";
          const response = await fetch(url, { redirect: "manual", headers: { "cache-control": "no-cache" } });
          const location = response.headers.get("location") || "";
          const accessRedirect =
            response.status === 302 &&
            (location.includes("cloudflareaccess.com") || location.includes("/cdn-cgi/access/login"));
          if (!accessRedirect) {
            throw new Error("Cloudflare Access is not verified on the dedicated Preview hostname; deployment blocked. HTTP " + response.status);
          }
          console.log("Cloudflare Access login redirect verified before deployment.");
          NODE

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript verification
        run: npm run typecheck

      - name: ESLint verification
        run: npm run lint

      - name: Unit tests
        run: npm test -- --reporter=dot

      - name: Build iPad preview
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npx opennextjs-cloudflare build

      - name: Deploy to dedicated iPad Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.ipad-preview.toml

      - name: Verify deployed Cloudflare Access gate
        run: |
          node --input-type=module <<'NODE'
          const url = "https://libretv-ipad-preview.bggdbh.workers.dev/";
          const response = await fetch(url, { redirect: "manual", headers: { "cache-control": "no-cache" } });
          const location = response.headers.get("location") || "";
          const accessRedirect =
            response.status === 302 &&
            (location.includes("cloudflareaccess.com") || location.includes("/cdn-cgi/access/login"));
          if (!accessRedirect) {
            throw new Error("Deployed iPad Preview is not protected by the expected Cloudflare Access login redirect. HTTP " + response.status);
          }
          console.log("Verified dedicated iPad Preview is gated by Cloudflare Access.");
          NODE
