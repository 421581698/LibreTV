name: Deploy Isolated iPad Cinema Preview
# Public Preview rollout: no application access-code gate.

on:
  workflow_dispatch:
    inputs:
      confirm_preview_deploy:
        description: "确认仅部署到不需要访问码的独立 libretv-ipad-preview Worker"
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"
  push:
    branches:
      - feature/ipad-cinema-preview-deploy
    paths:
      - .github/workflows/deploy-ipad-preview.yml

permissions:
  contents: read

concurrency:
  group: libretv-ipad-preview-deploy
  cancel-in-progress: false

jobs:
  deploy-preview:
    if: ${{ github.ref == 'refs/heads/feature/ipad-cinema-preview-deploy' && ((github.event_name == 'workflow_dispatch' && inputs.confirm_preview_deploy == 'yes') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-ipad-preview]'))) }}
    name: Build and deploy isolated iPad preview
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: preview
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify source commit and isolated target
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git merge-base --is-ancestor "cbc3d0e35b29a81719fcb8bb376fa89b1768302e" "$SOURCE_SHA" || (echo "Deployment commit does not descend from the visually accepted iPad baseline" && exit 1)
          grep -Eq '^[[:space:]]*name[[:space:]]*=[[:space:]]*"libretv-ipad-preview"' wrangler.ipad-preview.toml
          grep -Eq '^[[:space:]]*AUTH_DISABLED[[:space:]]*=[[:space:]]*"true"' wrangler.ipad-preview.toml

      - name: Verify Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing preview secret: CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing preview secret: CLOUDFLARE_ACCOUNT_ID" && exit 1)

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript verification
        run: npm run typecheck

      - name: ESLint verification
        run: npm run lint

      - name: Unit tests
        run: npm test -- --reporter=dot

      - name: Build iPad preview
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npx opennextjs-cloudflare build

      - name: Deploy dedicated public Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.ipad-preview.toml

      - name: Verify Preview is publicly accessible without an access code
        run: |
          node --input-type=module <<'NODE'
          const base = "https://libretv-ipad-preview.bggdbh.workers.dev";
          let response;
          let lastStatus = "no response";
          for (let attempt = 1; attempt <= 12; attempt += 1) {
            try {
              response = await fetch(base + "/api/status", { cache: "no-store", redirect: "manual" });
              if (response.ok) break;
              lastStatus = "HTTP " + response.status;
            } catch (error) {
              lastStatus = String(error);
            }
            if (attempt < 12) await new Promise(resolve => setTimeout(resolve, 5000));
          }
          if (!response?.ok) {
            throw new Error("Preview did not become reachable after 60 seconds: " + lastStatus);
          }
          const status = await response.json();
          if (status.passwordRequired === true || status.verified === false) {
            throw new Error("Preview still requires an access code.");
          }
          const home = await fetch(base + "/", { cache: "no-store", redirect: "manual" });
          if (!home.ok) throw new Error("Preview homepage is not publicly accessible: HTTP " + home.status);
          const html = await home.text();
          if (!html.includes("<html") && !html.includes("<!DOCTYPE html>")) {
            throw new Error("Preview homepage did not return an HTML document.");
          }
          console.log("Dedicated iPad Preview homepage and status endpoint are publicly accessible without an access code.");
          NODE
