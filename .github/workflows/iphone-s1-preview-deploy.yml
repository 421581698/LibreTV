name: iPhone S1 Isolated Preview Deploy

on:
  push:
    branches:
      - ops/iphone-s1-preview
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iphone-s1-preview
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: --max-old-space-size=4096
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout exact S1 commit
        uses: actions/checkout@v4
        with:
          ref: 3a7ea81c54de96284651a2388eb727b76d868c66

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Require Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          echo "cloudflare credentials present"

      - name: Build OpenNext Worker
        run: |
          npm ci --no-audit --no-fund
          npx opennextjs-cloudflare build
          test -s .open-next/worker.js

      - name: Generate isolated preview config (not committed)
        run: |
          cat > wrangler.iphone-s1-preview.toml <<'EOF'
          name = "libretv-iphone-s1-preview"
          main = ".open-next/worker.js"
          compatibility_date = "2025-04-01"
          compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
          assets = { directory = ".open-next/assets" }
          workers_dev = true
          preview_urls = false

          [vars]
          AUTH_DISABLED = "true"
          CMS_SEARCH_API = "https://caiji.dyttzyapi.com/api.php/provide/vod"
          API_60S_BASE = "https://60s.bggdbh.workers.dev"
          LLM_MODEL = "glm-4-flash"
          EOF
          echo "--- isolated config ---"
          cat wrangler.iphone-s1-preview.toml
          echo "--- guard: production worker must not be target ---"
          grep -q 'name = "libretv-iphone-s1-preview"' wrangler.iphone-s1-preview.toml

      - name: Deploy to isolated worker only
        run: npx wrangler deploy --config wrangler.iphone-s1-preview.toml

      - name: Verify preview externally + scope
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const base = new URL('https://libretv-iphone-s1-preview.bggdbh.workers.dev');
          async function get(path, accept) {
            const url = new URL(path, base);
            let last;
            for (let attempt = 1; attempt <= 12; attempt++) {
              try {
                const r = await fetch(url, { method: 'GET', redirect: 'follow', cache: 'no-store',
                  headers: { accept }, signal: AbortSignal.timeout(15000) });
                if (r.status === 200) return r;
                last = new Error(`${path}: HTTP ${r.status}`);
              } catch (e) { last = e; }
              await new Promise(r => setTimeout(r, 5000));
            }
            throw last ?? new Error('preview not healthy: ' + path);
          }
          const home = await get('/', 'text/html');
          const html = await home.text();
          assert.ok(html.toLowerCase().includes('<html') || html.toLowerCase().includes('<!doctype html>'));
          const api = await get('/api/status', 'application/json');
          const status = await api.json();
          console.log(JSON.stringify({
            result: 'passed', preview: base.origin, homepage_http: home.status,
            api_status_http: api.status, app_version: status.version,
            edge: home.headers.get('cf-ray') ? 'Cloudflare' : (home.headers.get('server') || 'unknown'),
            target_worker: 'libretv-iphone-s1-preview',
            production_worker_touched: false, deployment_scope: 'preview only',
            commit: '3a7ea81c54de'
          }, null, 2));
          NODE
