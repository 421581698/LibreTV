name: prelaunch-checks

on:
  push:
    branches:
      - fix/prelaunch-security-voice-2026-11-03
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 仓库目前没有提交 package-lock.json；先生成 lock，再使用 npm ci。
      - name: Generate dependency lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit dependency lockfile
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build: commit npm dependency lockfile"
            git push
          fi
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        env:
          PASSWORD: ci-test-password
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build
