name: prelaunch-checks

on:
  push:
    branches:
      - feature/friday-playback-feedback-agent-2026-11-08
      - fix/prelaunch-security-voice-2026-11-03
      - feature/libretv-eight-screen-glass-2026-11-09
      - feature/auto-rank-best-vod-sources-2026-11-10
      - feature/hls-playback-regression-suite-2026-11-13
  pull_request:
    branches:
      - main
      - feature/friday-quality-aware-source-ranking-2026-11-08
      - feature/libretv-v4-pc-light-homepage-2026-11-09
      - feature/auto-rank-best-vod-sources-2026-11-10
      - feature/homepage-cinema-lobby-order-2026-11-11
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        env:
          PASSWORD: ci-test-password
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build
