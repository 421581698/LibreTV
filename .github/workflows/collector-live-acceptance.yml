name: Collector Live Acceptance

on:
  pull_request:
    branches:
      - integration/collector-quality-evidence-fix-2026-11-16
    paths:
      - ".github/workflows/collector-live-acceptance.yml"
      - "services/scrapling-collector/**"
      - "scripts/scrapling-egress-firewall.sh"
      - "scripts/test-scrapling-egress-firewall.sh"
      - "docker-compose.yml"
      - "README.md"
      - "services/scrapling-collector/README.md"
  workflow_dispatch:
    inputs:
      crawl_target:
        description: Number of approved live crawl jobs
        required: true
        type: choice
        options:
          - "1000"
          - "2000"
          - "5000"
          - "10000"
      media_seconds:
        description: Required continuous native-resolution decode duration
        required: true
        default: "60"
        type: choice
        options:
          - "60"
          - "120"
          - "300"

permissions:
  contents: read

jobs:
  live-acceptance:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.number == 92 && vars.COLLECTOR_LIVE_ACCEPTANCE_ENABLED == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: collector-acceptance
    env:
      PASSWORD: ci-only-acceptance-password
      SCRAPLING_API_TOKEN: ${{ secrets.SCRAPLING_API_TOKEN }}
      SCRAPLING_EGRESS_FIREWALL_CONFIRMED: "1"
      COLLECTOR_WORKER_CONCURRENCY: "4"
      COLLECTOR_DAILY_SCHEDULER_ENABLED: "false"
      COLLECTOR_AI_GATEWAY_URL: ${{ secrets.COLLECTOR_AI_GATEWAY_URL }}
      COLLECTOR_AI_API_KEY: ${{ secrets.COLLECTOR_AI_API_KEY }}
      COLLECTOR_AI_MODEL: ${{ secrets.COLLECTOR_AI_MODEL }}
      COLLECTOR_AI_ALLOWED_HOSTS: ${{ secrets.COLLECTOR_AI_ALLOWED_HOSTS }}
      AI_RULE_ACCEPTANCE_URL: ${{ secrets.AI_RULE_ACCEPTANCE_URL }}
      AI_RULE_ACCEPTANCE_ALLOWED_HOSTS: ${{ secrets.AI_RULE_ACCEPTANCE_ALLOWED_HOSTS }}
      MEDIA_ACCEPTANCE_URL: ${{ secrets.MEDIA_ACCEPTANCE_URL }}
      MEDIA_ACCEPTANCE_ALLOWED_HOSTS: ${{ secrets.MEDIA_ACCEPTANCE_ALLOWED_HOSTS }}
      BROWSER_MEDIA_ACCEPTANCE_URL: ${{ secrets.BROWSER_MEDIA_ACCEPTANCE_URL }}
      BROWSER_MEDIA_ACCEPTANCE_ALLOWED_HOSTS: ${{ secrets.BROWSER_MEDIA_ACCEPTANCE_ALLOWED_HOSTS }}
      MEDIA_ACCEPTANCE_SECONDS: ${{ inputs.media_seconds || '60' }}
      LIVE_CRAWL_ALLOWED_HOSTS: ${{ secrets.LIVE_CRAWL_ALLOWED_HOSTS }}
      LIVE_CRAWL_URLS: ${{ secrets.LIVE_CRAWL_URLS }}
      LIVE_CRAWL_URLS_2: ${{ secrets.LIVE_CRAWL_URLS_2 }}
      LIVE_CRAWL_URLS_3: ${{ secrets.LIVE_CRAWL_URLS_3 }}
      LIVE_CRAWL_URLS_4: ${{ secrets.LIVE_CRAWL_URLS_4 }}
      LIVE_CRAWL_URLS_5: ${{ secrets.LIVE_CRAWL_URLS_5 }}
      LIVE_CRAWL_URLS_6: ${{ secrets.LIVE_CRAWL_URLS_6 }}
      LIVE_CRAWL_URLS_7: ${{ secrets.LIVE_CRAWL_URLS_7 }}
      LIVE_CRAWL_URLS_8: ${{ secrets.LIVE_CRAWL_URLS_8 }}
      LIVE_CRAWL_URLS_9: ${{ secrets.LIVE_CRAWL_URLS_9 }}
      LIVE_CRAWL_URLS_10: ${{ secrets.LIVE_CRAWL_URLS_10 }}
      LIVE_CRAWL_URLS_11: ${{ secrets.LIVE_CRAWL_URLS_11 }}
      LIVE_CRAWL_URLS_12: ${{ secrets.LIVE_CRAWL_URLS_12 }}
      LIVE_CRAWL_URLS_13: ${{ secrets.LIVE_CRAWL_URLS_13 }}
      LIVE_CRAWL_URLS_14: ${{ secrets.LIVE_CRAWL_URLS_14 }}
      LIVE_CRAWL_URLS_15: ${{ secrets.LIVE_CRAWL_URLS_15 }}
      LIVE_CRAWL_URLS_16: ${{ secrets.LIVE_CRAWL_URLS_16 }}
      LIVE_CRAWL_URLS_17: ${{ secrets.LIVE_CRAWL_URLS_17 }}
      LIVE_CRAWL_URLS_18: ${{ secrets.LIVE_CRAWL_URLS_18 }}
      LIVE_CRAWL_URLS_19: ${{ secrets.LIVE_CRAWL_URLS_19 }}
      LIVE_CRAWL_URLS_20: ${{ secrets.LIVE_CRAWL_URLS_20 }}
      LIVE_CRAWL_URLS_21: ${{ secrets.LIVE_CRAWL_URLS_21 }}
      LIVE_CRAWL_URLS_22: ${{ secrets.LIVE_CRAWL_URLS_22 }}
      LIVE_CRAWL_URLS_23: ${{ secrets.LIVE_CRAWL_URLS_23 }}
      LIVE_CRAWL_URLS_24: ${{ secrets.LIVE_CRAWL_URLS_24 }}
      LIVE_CRAWL_URLS_25: ${{ secrets.LIVE_CRAWL_URLS_25 }}
      LIVE_CRAWL_URLS_26: ${{ secrets.LIVE_CRAWL_URLS_26 }}
      LIVE_CRAWL_URLS_27: ${{ secrets.LIVE_CRAWL_URLS_27 }}
      LIVE_CRAWL_URLS_28: ${{ secrets.LIVE_CRAWL_URLS_28 }}
      LIVE_CRAWL_URLS_29: ${{ secrets.LIVE_CRAWL_URLS_29 }}
      LIVE_CRAWL_URLS_30: ${{ secrets.LIVE_CRAWL_URLS_30 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate operator acceptance fixtures
        run: |
          test -n "$SCRAPLING_API_TOKEN"
          test -n "$MEDIA_ACCEPTANCE_URL"
          test -n "$MEDIA_ACCEPTANCE_ALLOWED_HOSTS"
          test -n "$BROWSER_MEDIA_ACCEPTANCE_URL"
          test -n "$BROWSER_MEDIA_ACCEPTANCE_ALLOWED_HOSTS"
          test -n "$LIVE_CRAWL_ALLOWED_HOSTS"
          test -n "$LIVE_CRAWL_URLS"
          test -n "$COLLECTOR_AI_GATEWAY_URL"
          test -n "$COLLECTOR_AI_API_KEY"
          test -n "$COLLECTOR_AI_MODEL"
          test -n "$COLLECTOR_AI_ALLOWED_HOSTS"
          test -n "$AI_RULE_ACCEPTANCE_URL"
          test -n "$AI_RULE_ACCEPTANCE_ALLOWED_HOSTS"
      - name: Build isolated stack
        run: docker compose --profile collector up -d --build
      - name: Install and verify current-boot host firewall
        run: sudo bash scripts/scrapling-egress-firewall.sh
      - name: Copy real acceptance harnesses into isolated Collector
        run: |
          docker exec -i libretv-scrapling-collector sh -c 'cat > /tmp/ai_rules_acceptance.py' < services/scrapling-collector/tests/ai_rules_acceptance.py
          docker exec -i libretv-scrapling-collector sh -c 'cat > /tmp/media_download.py' < services/scrapling-collector/tests/media_download.py
          docker exec -i libretv-scrapling-collector sh -c 'cat > /tmp/browser_playback_acceptance.py' < services/scrapling-collector/tests/browser_playback_acceptance.py
          docker exec -i libretv-scrapling-collector sh -c 'cat > /tmp/live_crawl_scale.py' < services/scrapling-collector/tests/live_crawl_scale.py
          printf '%s\n' "$LIVE_CRAWL_URLS" "$LIVE_CRAWL_URLS_2" "$LIVE_CRAWL_URLS_3" "$LIVE_CRAWL_URLS_4" "$LIVE_CRAWL_URLS_5" "$LIVE_CRAWL_URLS_6" "$LIVE_CRAWL_URLS_7" "$LIVE_CRAWL_URLS_8" "$LIVE_CRAWL_URLS_9" "$LIVE_CRAWL_URLS_10" "$LIVE_CRAWL_URLS_11" "$LIVE_CRAWL_URLS_12" "$LIVE_CRAWL_URLS_13" "$LIVE_CRAWL_URLS_14" "$LIVE_CRAWL_URLS_15" "$LIVE_CRAWL_URLS_16" "$LIVE_CRAWL_URLS_17" "$LIVE_CRAWL_URLS_18" "$LIVE_CRAWL_URLS_19" "$LIVE_CRAWL_URLS_20" "$LIVE_CRAWL_URLS_21" "$LIVE_CRAWL_URLS_22" "$LIVE_CRAWL_URLS_23" "$LIVE_CRAWL_URLS_24" "$LIVE_CRAWL_URLS_25" "$LIVE_CRAWL_URLS_26" "$LIVE_CRAWL_URLS_27" "$LIVE_CRAWL_URLS_28" "$LIVE_CRAWL_URLS_29" "$LIVE_CRAWL_URLS_30" > /tmp/collector-approved-live-urls.txt
          docker exec -i libretv-scrapling-collector sh -c 'cat > /tmp/approved-live-urls.txt' < /tmp/collector-approved-live-urls.txt
      - name: Verify AI rule generation, versioning and automatic repair
        run: |
          docker exec \
            -e SCRAPLING_API_BASE="http://127.0.0.1:8000" \
            -e SCRAPLING_API_TOKEN="$SCRAPLING_API_TOKEN" \
            -e AI_RULE_ACCEPTANCE_URL="$AI_RULE_ACCEPTANCE_URL" \
            -e AI_RULE_ACCEPTANCE_ALLOWED_HOSTS="$AI_RULE_ACCEPTANCE_ALLOWED_HOSTS" \
            libretv-scrapling-collector python /tmp/ai_rules_acceptance.py
      - name: Fetch bounded public media fixture behind the egress firewall
        run: |
          docker exec \
            -e MEDIA_ACCEPTANCE_URL="$MEDIA_ACCEPTANCE_URL" \
            -e MEDIA_ACCEPTANCE_ALLOWED_HOSTS="$MEDIA_ACCEPTANCE_ALLOWED_HOSTS" \
            -e MEDIA_ACCEPTANCE_SECONDS="$MEDIA_ACCEPTANCE_SECONDS" \
            libretv-scrapling-collector python /tmp/media_download.py --output /tmp/media-acceptance-sample.mkv
          docker cp libretv-scrapling-collector:/tmp/media-acceptance-sample.mkv "$RUNNER_TEMP/media-acceptance-sample.mkv"
          docker exec libretv-scrapling-collector rm -f /tmp/media-acceptance-sample.mkv
      - name: Decode 4K in a no-network FFprobe and FFmpeg sandbox
        run: |
          docker run --rm --network none --read-only --user 10001:10001 --cap-drop ALL \
            --security-opt no-new-privileges \
            --security-opt seccomp="$GITHUB_WORKSPACE/services/scrapling-collector/seccomp-no-socket.json" \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=128m \
            --mount type=bind,src="$RUNNER_TEMP/media-acceptance-sample.mkv",dst=/input/media-acceptance-sample.mkv,readonly \
            --mount type=bind,src="$GITHUB_WORKSPACE/services/scrapling-collector/tests/media_acceptance.py",dst=/opt/media_acceptance.py,readonly \
            --memory 2g --cpus 2 --pids-limit 128 -e HOME=/tmp \
            --entrypoint python libretv-scrapling-collector:ci \
            /opt/media_acceptance.py --input /input/media-acceptance-sample.mkv --requested-seconds "$MEDIA_ACCEPTANCE_SECONDS"
      - name: Verify real Chromium 4K continuous playback
        run: |
          docker exec \
            -e BROWSER_MEDIA_ACCEPTANCE_URL="$BROWSER_MEDIA_ACCEPTANCE_URL" \
            -e BROWSER_MEDIA_ACCEPTANCE_ALLOWED_HOSTS="$BROWSER_MEDIA_ACCEPTANCE_ALLOWED_HOSTS" \
            -e MEDIA_ACCEPTANCE_SECONDS="$MEDIA_ACCEPTANCE_SECONDS" \
            libretv-scrapling-collector python /tmp/browser_playback_acceptance.py
      - name: Verify live network crawl scale
        run: |
          docker exec \
            -e SCRAPLING_API_BASE="http://127.0.0.1:8000" \
            -e SCRAPLING_API_TOKEN="$SCRAPLING_API_TOKEN" \
            -e LIVE_CRAWL_ALLOWED_HOSTS="$LIVE_CRAWL_ALLOWED_HOSTS" \
            libretv-scrapling-collector python /tmp/live_crawl_scale.py \
              --urls /tmp/approved-live-urls.txt --target "${{ inputs.crawl_target || vars.COLLECTOR_LIVE_CRAWL_TARGET || '1000' }}"
      - name: Collect isolated stack diagnostics
        if: always()
        run: |
          docker compose --profile collector ps
          docker logs libretv-scrapling-collector 2>&1 | tail -200 || true
          docker logs libretv-scrapling-worker 2>&1 | tail -200 || true
      - name: Tear down isolated stack
        if: always()
        run: docker compose --profile collector down -v
