name: Resource Playback Verification

on:
  push:
    branches:
      - feat/resource-playback-verification-v1
      - feat/resource-intelligence-center-v2
      - integration/**
    paths:
      - "src/components/player-shell.tsx"
      - "src/lib/dolby-vision/**"
      - "docs/dolby-vision/**"
      - "scripts/dolby-vision/**"
      - "src/components/source-manager.tsx"
      - "src/components/home/home-inline-play.test.ts"
      - "src/lib/resource-collector-workflow.ts"
      - "src/lib/resource-collector-workflow.test.ts"
      - "src/lib/media-playback.ts"
      - "src/lib/media-playback.test.ts"
      - "src/lib/collector-playback-eligibility.ts"
      - "src/lib/collector-playback-eligibility.test.ts"
      - "src/lib/playback-verification.ts"
      - "src/lib/playback-verification.test.ts"
      - "src/app/api/resource-collector/candidates/[candidateId]/playback/route.ts"
      - "services/scrapling-collector/app.py"
      - "services/scrapling-collector/tests/test_collector.py"
      - ".github/workflows/resource-playback-verification.yml"
      - "src/lib/api-guard.ts"
      - "src/lib/api-guard.test.ts"
      - "src/app/api/auth-guard.test.ts"
      - "src/lib/resource-collector-client.ts"
      - "src/lib/resource-collector-client.test.ts"
  workflow_dispatch:

  pull_request:
    paths:
      - "src/components/player-shell.tsx"
      - "src/lib/dolby-vision/**"
      - "docs/dolby-vision/**"
      - "src/components/source-manager.tsx"
      - "src/lib/media-playback.ts"
      - "src/lib/media-playback.test.ts"
      - "src/lib/collector-playback-eligibility.ts"
      - "src/lib/collector-playback-eligibility.test.ts"
      - ".github/workflows/resource-playback-verification.yml"
      - "src/lib/api-guard.ts"
      - "src/lib/api-guard.test.ts"
      - "src/app/api/auth-guard.test.ts"
      - "src/lib/resource-collector-client.ts"
      - "src/lib/resource-collector-client.test.ts"

permissions:
  contents: read

jobs:
  web-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        env:
          PASSWORD: ci-test-password
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  dolby-vision-rpu-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pinned dovi_tool 2.3.4
        run: |
          curl -fsSL https://github.com/quietvoid/dovi_tool/releases/download/2.3.4/dovi_tool-2.3.4-x86_64-unknown-linux-musl.tar.gz -o /tmp/dovi_tool.tar.gz
          mkdir -p /tmp/dovi_tool
          tar -xzf /tmp/dovi_tool.tar.gz -C /tmp/dovi_tool
          binary="$(find /tmp/dovi_tool -type f -name dovi_tool -print -quit)"
          test -n "$binary"
          install -m 0755 "$binary" /usr/local/bin/dovi_tool
          dovi_tool --version
      - name: Fetch upstream parser RPU fixture
        run: |
          curl -fsSL https://raw.githubusercontent.com/quietvoid/dovi_tool/2.3.4/assets/tests/profile8.bin -o /tmp/dolby-vision-profile8.rpu
          test -s /tmp/dolby-vision-profile8.rpu
      - name: Run LibreTV RPU adapter against real parser fixture
        run: |
          DOVI_TOOL_BIN=/usr/local/bin/dovi_tool node scripts/dolby-vision/analyze-rpu.mjs --input /tmp/dolby-vision-profile8.rpu --kind rpu > /tmp/dolby-vision-report.json
          node --input-type=module -e "import fs from 'node:fs'; const r=JSON.parse(fs.readFileSync('/tmp/dolby-vision-report.json','utf8')); if(r.source!=='dovi_tool'||r.parserVersion!=='2.3.4'||r.rpuPresent!==true||r.profile!==8||!Number.isInteger(r.frameCount)||r.frameCount<1) throw new Error('RPU adapter acceptance failed: '+JSON.stringify(r)); console.log(JSON.stringify({parser:r.source,version:r.parserVersion,profile:r.profile,frames:r.frameCount,levels:r.metadataLevels,rpuSha256:r.rpuSha256},null,2));"

  collector-verification:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/scrapling-collector
    env:
      SCRAPLING_API_TOKEN: collector-ci-token
      SCRAPLING_DB_PATH: /tmp/libretv-scrapling-ci.sqlite3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/scrapling-collector/requirements.txt
      - name: Install collector dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile collector
        run: python -m py_compile app.py
      - name: Collector unit tests
        run: python -m unittest discover -s tests -v
