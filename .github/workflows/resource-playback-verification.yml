name: Resource Playback Verification

on:
  push:
    branches:
      - feat/resource-playback-verification-v1
      - feat/resource-intelligence-center-v2
      - integration/**
    paths:
      - "src/components/player-shell.tsx"
      - "src/components/dolby-vision-diagnostics-panel.tsx"
      - "services/scrapling-collector/**"
      - "docker-compose.yml"
      - "src/app/api/dolby-vision/**"
      - "src/lib/dolby-vision/**"
      - "docs/dolby-vision/**"
      - "scripts/dolby-vision/**"
      - "services/dolby-vision-parser/**"
      - "docker-compose.yml"
      - "services/dolby-vision-parser/**"
      - "src/components/source-manager.tsx"
      - "src/components/home/home-inline-play.test.ts"
      - "src/lib/resource-collector-workflow.ts"
      - "src/lib/resource-collector-workflow.test.ts"
      - "src/lib/media-playback.ts"
      - "src/lib/media-playback.test.ts"
      - "src/lib/collector-playback-eligibility.ts"
      - "src/lib/collector-playback-eligibility.test.ts"
      - "src/lib/playback-verification.ts"
      - "src/lib/playback-verification.test.ts"
      - "src/app/api/resource-collector/candidates/[candidateId]/playback/route.ts"
      - "services/scrapling-collector/app.py"
      - "services/scrapling-collector/tests/test_collector.py"
      - ".github/workflows/resource-playback-verification.yml"
      - "src/lib/api-guard.ts"
      - "src/lib/api-guard.test.ts"
      - "src/app/api/auth-guard.test.ts"
      - "src/lib/resource-collector-client.ts"
      - "src/lib/resource-collector-client.test.ts"
  workflow_dispatch:

  pull_request:
    paths:
      - "src/components/player-shell.tsx"
      - "src/components/dolby-vision-diagnostics-panel.tsx"
      - "services/scrapling-collector/**"
      - "docker-compose.yml"
      - "src/app/api/dolby-vision/**"
      - "src/lib/dolby-vision/**"
      - "docs/dolby-vision/**"
      - "scripts/dolby-vision/**"
      - "services/dolby-vision-parser/**"
      - "src/components/source-manager.tsx"
      - "src/lib/media-playback.ts"
      - "src/lib/media-playback.test.ts"
      - "src/lib/collector-playback-eligibility.ts"
      - "src/lib/collector-playback-eligibility.test.ts"
      - ".github/workflows/resource-playback-verification.yml"
      - "src/lib/api-guard.ts"
      - "src/lib/api-guard.test.ts"
      - "src/app/api/auth-guard.test.ts"
      - "src/lib/resource-collector-client.ts"
      - "src/lib/resource-collector-client.test.ts"

permissions:
  contents: read

jobs:
  web-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        env:
          PASSWORD: ci-test-password
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  dolby-vision-rpu-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pinned dovi_tool 2.3.4
        run: |
          curl -fsSL https://github.com/quietvoid/dovi_tool/releases/download/2.3.4/dovi_tool-2.3.4-x86_64-unknown-linux-musl.tar.gz -o /tmp/dovi_tool.tar.gz
          mkdir -p /tmp/dovi_tool
          tar -xzf /tmp/dovi_tool.tar.gz -C /tmp/dovi_tool
          binary="$(find /tmp/dovi_tool -type f -name dovi_tool -print -quit)"
          test -n "$binary"
          install -m 0755 "$binary" /usr/local/bin/dovi_tool
          dovi_tool --version
      - name: Fetch upstream parser RPU fixture
        run: |
          curl -fsSL https://raw.githubusercontent.com/quietvoid/dovi_tool/2.3.4/assets/tests/profile8.bin -o /tmp/dolby-vision-profile8.rpu
          test -s /tmp/dolby-vision-profile8.rpu
      - name: Install project dependencies for report-contract validation
        run: npm ci
      - name: Verify private parser service signing and request primitives
        run: node --test services/dolby-vision-parser/server.test.mjs
      - name: Build private parser service container
        run: docker build -f services/dolby-vision-parser/Dockerfile -t libretv-dolby-vision-parser:ci .
      - name: Validate isolated Dolby Vision Compose profile
        run: |
          openssl genpkey -algorithm ED25519 -out /tmp/dv-signing-private-key.pem
          PASSWORD=ci-placeholder DV_SERVICE_TOKEN=ci-token DV_SIGNING_KEY_ID=ci-key DV_SIGNING_PRIVATE_KEY_FILE=/tmp/dv-signing-private-key.pem docker compose --profile dolby-vision config --quiet
      - name: Run LibreTV RPU adapter against real parser fixture
        run: |
          DOVI_TOOL_BIN=/usr/local/bin/dovi_tool node scripts/dolby-vision/analyze-rpu.mjs --input /tmp/dolby-vision-profile8.rpu --kind rpu > /tmp/dolby-vision-report.json
          node --input-type=module -e "import fs from 'node:fs'; const r=JSON.parse(fs.readFileSync('/tmp/dolby-vision-report.json','utf8')); if(r.source!=='dovi_tool'||r.parserVersion!=='2.3.4'||r.rpuPresent!==true||r.profile!==8||!Number.isInteger(r.frameCount)||r.frameCount<1) throw new Error('RPU adapter acceptance failed: '+JSON.stringify(r)); console.log(JSON.stringify({parser:r.source,version:r.parserVersion,profile:r.profile,frames:r.frameCount,levels:r.metadataLevels,rpuSha256:r.rpuSha256},null,2));"
          DOLBY_VISION_REPORT_PATH=/tmp/dolby-vision-report.json npx vitest run src/lib/dolby-vision/rpu-evidence-contract.test.ts
      - name: Install FFmpeg for real MP4 demux integration
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Fetch pinned upstream HEVC and Matroska integration fixtures
        run: |
          curl -fsSL https://raw.githubusercontent.com/quietvoid/dovi_tool/2.3.4/assets/hevc_tests/regular.hevc -o /tmp/dolby-vision-regular.hevc
          curl -fsSL https://raw.githubusercontent.com/quietvoid/dovi_tool/2.3.4/assets/hevc_tests/regular.mkv -o /tmp/dolby-vision-regular.mkv
          test "$(git hash-object /tmp/dolby-vision-regular.hevc)" = "0435ca7d75348ed3fe5362b7188fd59849413721"
          test "$(git hash-object /tmp/dolby-vision-regular.mkv)" = "4e7c735e42dcfddb5232d5b44acb1f2fff56ab5b"
          ffmpeg -nostdin -v error -f hevc -i /tmp/dolby-vision-regular.hevc -map 0:v:0 -c:v copy -tag:v dvhe -movflags +faststart /tmp/dolby-vision-regular.mp4
          test -s /tmp/dolby-vision-regular.mp4
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=noprint_wrappers=1:nokey=1 /tmp/dolby-vision-regular.mp4)" = "hevc"
      - name: Verify full RPU extraction from pinned real HEVC fixture
        run: |
          DOVI_TOOL_BIN=/usr/local/bin/dovi_tool node scripts/dolby-vision/analyze-rpu.mjs --input /tmp/dolby-vision-regular.hevc > /tmp/dolby-vision-hevc-report.json
          node scripts/dolby-vision/assert-full-rpu-report.mjs --report /tmp/dolby-vision-hevc-report.json --input /tmp/dolby-vision-regular.hevc --expected-frames 259
          DOLBY_VISION_REPORT_PATH=/tmp/dolby-vision-hevc-report.json npx vitest run src/lib/dolby-vision/rpu-evidence-contract.test.ts
      - name: Verify full RPU extraction from pinned real Matroska fixture
        run: |
          DOVI_TOOL_BIN=/usr/local/bin/dovi_tool node scripts/dolby-vision/analyze-rpu.mjs --input /tmp/dolby-vision-regular.mkv > /tmp/dolby-vision-mkv-report.json
          node scripts/dolby-vision/assert-full-rpu-report.mjs --report /tmp/dolby-vision-mkv-report.json --input /tmp/dolby-vision-regular.mkv --expected-frames 259
          DOLBY_VISION_REPORT_PATH=/tmp/dolby-vision-mkv-report.json npx vitest run src/lib/dolby-vision/rpu-evidence-contract.test.ts
      - name: Verify real MP4 upload, HEVC demux, full RPU scan and signed evidence
        env:
          DOVI_TOOL_BIN: /usr/local/bin/dovi_tool
        run: node scripts/dolby-vision/verify-parser-service-fixture.mjs /tmp/dolby-vision-regular.mp4

  collector-verification:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/scrapling-collector
    env:
      SCRAPLING_API_TOKEN: collector-ci-token
      SCRAPLING_DB_PATH: /tmp/libretv-scrapling-ci.sqlite3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/scrapling-collector/requirements.txt
      - name: Install collector dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile collector
        run: python -m py_compile app.py
      - name: Collector unit tests
        run: python -m unittest discover -s tests -v
