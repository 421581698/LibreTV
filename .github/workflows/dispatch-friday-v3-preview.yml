name: Dispatch Friday V3 Open Preview

on:
  workflow_dispatch:
    inputs:
      confirm_preview_deploy:
        description: "确认部署 Friday V3 到独立的非公开 Preview Worker"
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"

permissions:
  contents: read

concurrency:
  group: friday-v3-private-preview
  cancel-in-progress: false

jobs:
  deploy-preview:
    if: ${{ inputs.confirm_preview_deploy == 'yes' }}
    name: Build and deploy isolated Friday V3 preview
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: preview
    steps:
      - name: Checkout Friday V3 runtime branch
        uses: actions/checkout@v4
        with:
          ref: feature/friday-v3-runtime

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build isolated preview
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npx opennextjs-cloudflare build

      - name: Verify Cloudflare preview credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing preview secret: CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing preview secret: CLOUDFLARE_ACCOUNT_ID" && exit 1)

      - name: Deploy isolated Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.preview.toml

