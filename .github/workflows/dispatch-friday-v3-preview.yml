name: Dispatch Friday V3 Open Preview

on:
  workflow_dispatch:
    inputs:
      confirm_preview_deploy:
        description: "确认部署 Friday V3 到独立的非公开 Preview Worker"
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"

permissions:
  contents: read

concurrency:
  group: friday-v3-private-preview
  cancel-in-progress: false

jobs:
  deploy-preview:
    if: ${{ github.ref == 'refs/heads/feature/friday-v3-integrated-acceptance-2026-11-08' && inputs.confirm_preview_deploy == 'yes' }}
    name: Build and deploy isolated Friday V3 preview
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: preview
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript verification
        run: npm run typecheck

      - name: ESLint verification
        run: npm run lint

      - name: Unit tests
        run: npm test -- --reporter=dot

      - name: Verify preview authentication configuration
        run: |
          grep -Eq '^[[:space:]]*AUTH_DISABLED[[:space:]]*=[[:space:]]*"false"' wrangler.preview.toml
          if grep -Eq '^[[:space:]]*AUTH_DISABLED[[:space:]]*=[[:space:]]*"true"' wrangler.preview.toml; then
            echo "Preview must remain password-protected"
            exit 1
          fi

      - name: Verify Cloudflare preview credentials and gate key
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_GATE_KEY: ${{ secrets.LIBRETV_FRIDAY_V3_PREVIEW_GATE_KEY }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing preview secret: CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing preview secret: CLOUDFLARE_ACCOUNT_ID" && exit 1)
          test -n "$PREVIEW_GATE_KEY" || (echo "Missing preview secret: LIBRETV_FRIDAY_V3_PREVIEW_GATE_KEY" && exit 1)
          test "${#PREVIEW_GATE_KEY}" -ge 24 || (echo "LIBRETV_FRIDAY_V3_PREVIEW_GATE_KEY must contain at least 24 characters" && exit 1)

      - name: Build isolated preview
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npx opennextjs-cloudflare build

      - name: Deploy isolated Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.preview.toml

      - name: Set Worker PASSWORD secret without logging its value
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_GATE_KEY: ${{ secrets.LIBRETV_FRIDAY_V3_PREVIEW_GATE_KEY }}
        run: printf '%s' "$PREVIEW_GATE_KEY" | npx wrangler secret put PASSWORD --config wrangler.preview.toml

      - name: Verify deployed preview password gate
        run: |
          node --input-type=module <<'NODE'
          const base = "https://libretv-homepage-preview.bggdbh.workers.dev";
          const statusResponse = await fetch(base + "/api/status");
          if (!statusResponse.ok) throw new Error("Preview status endpoint returned " + statusResponse.status);
          const status = await statusResponse.json();
          if (status.passwordRequired !== true || status.verified !== false) {
            throw new Error("Preview is not locked: passwordRequired=" + status.passwordRequired + ", verified=" + status.verified);
          }
          const authResponse = await fetch(base + "/api/auth", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ password: "__invalid_preview_smoke_password__" }),
          });
          if (authResponse.status !== 401) {
            throw new Error("Expected invalid password to return 401, got " + authResponse.status);
          }
          console.log("Preview gate verified: anonymous session is unverified and invalid password is rejected.");
          NODE
