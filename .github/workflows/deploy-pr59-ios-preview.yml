name: Deploy PR #59 iPhone Safe-Area Preview

on:
  push:
    branches:
      - fix/ios-native-fullscreen-safe-area-2026-11-09
    paths:
      - ".github/workflows/deploy-pr59-ios-preview.yml"
      - "wrangler.pr59-preview.toml"
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.*"
      - "open-next.config.*"
  workflow_dispatch:
    inputs:
      confirm_preview_deploy:
        description: "确认部署公开、无需密码的 PR #59 Preview Worker"
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"

permissions:
  contents: read

concurrency:
  group: libretv-pr59-ios-preview
  cancel-in-progress: false

jobs:
  deploy-preview:
    if: ${{ github.event_name == 'push' || inputs.confirm_preview_deploy == 'yes' }}
    name: Build and deploy isolated PR #59 preview
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: preview
    steps:
      - name: Checkout exact PR #59 commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript verification
        run: npm run typecheck

      - name: ESLint verification
        run: npm run lint

      - name: Unit tests
        run: npm test -- --reporter=dot

      - name: Verify isolated preview configuration
        run: |
          grep -Eq '^[[:space:]]*name[[:space:]]*=[[:space:]]*"libretv-pr59-ios-preview"' wrangler.pr59-preview.toml
          grep -Eq '^[[:space:]]*AUTH_DISABLED[[:space:]]*=[[:space:]]*"true"' wrangler.pr59-preview.toml

      - name: Build isolated preview
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npx opennextjs-cloudflare build

      - name: Deploy isolated PR #59 Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.pr59-preview.toml

      - name: Verify deployed public PR #59 Preview
        run: |
          node --input-type=module <<'NODE'
          const base = "https://libretv-pr59-ios-preview.bggdbh.workers.dev";
          const home = await fetch(base + "/", { redirect: "follow", headers: { "cache-control": "no-cache" } });
          if (!home.ok || !(home.headers.get("content-type") || "").includes("text/html")) {
            throw new Error("Preview homepage failed: HTTP " + home.status);
          }
          const statusResponse = await fetch(base + "/api/status", { cache: "no-store" });
          if (!statusResponse.ok) throw new Error("Preview status endpoint returned " + statusResponse.status);
          const status = await statusResponse.json();
          if (status.passwordRequired !== false || status.verified !== true) {
            throw new Error("Preview should be public: passwordRequired=" + status.passwordRequired + ", verified=" + status.verified);
          }
          console.log("PR #59 Preview verified: homepage responds without a password; authentication is disabled for this isolated preview.");
          NODE
