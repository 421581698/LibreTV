<!doctype html>
<html lang="zh-CN" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><title>Friday · Golden Sigil</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:system-ui,-apple-system,sans-serif;color:var(--fg);background:radial-gradient(ellipse at 50% 45%,#17243a,#080c14 70%)}html[data-theme=light] body{background:radial-gradient(ellipse at 50% 45%,#fff,#edf2f8 75%)}:root{--fg:#edf1f8;--panel:rgba(15,22,35,.76)}html[data-theme=light]{--fg:#29364a;--panel:rgba(255,255,255,.78)}main{height:100%;height:100svh;display:grid;place-items:center;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}canvas{width:min(94vw,78vh,720px);height:min(94vw,78vh,720px);max-width:100%;max-height:100%;touch-action:pan-y}header{position:absolute;top:max(16px,env(safe-area-inset-top));font-size:11px;letter-spacing:.32em;opacity:.7}footer{position:absolute;bottom:max(16px,env(safe-area-inset-bottom));display:flex;gap:8px;flex-wrap:wrap;justify-content:center}button{border:1px solid #8896aa55;border-radius:99px;background:var(--panel);backdrop-filter:blur(12px);color:var(--fg);padding:10px 14px;min-height:40px;font:600 12px system-ui}#status{position:absolute;bottom:calc(max(16px,env(safe-area-inset-bottom)) + 52px);font-size:10px;opacity:.65;text-align:center}
</style></head><body><main><header>FRIDAY · GOLDEN SIGIL</header><canvas id="c" aria-label="三色全息丝带能量场"></canvas><div id="status" role="status">30 FPS · 6 秒周期 · 触碰画面触发冲击波</div><footer><button id="theme">切换昼夜</button><button id="shock">能量冲击</button><button id="webm">导出 WebM 测试</button><button id="mp4">导出 MP4（当前主题）</button></footer></main>
<script>
(()=>{'use strict';const c=document.querySelector('#c'),x=c.getContext('2d',{alpha:true}),status=document.querySelector('#status'),root=document.documentElement,T=Math.PI*2;let w=1,h=1,d=1,t=0,last=0,shown=!document.hidden,mode='dark',shock=-1,busy=false;
const rnd=(i,s)=>{let n=Math.sin(i*127.1+s*311.7)*43758.5453;return n-Math.floor(n)};
function size(){let r=c.getBoundingClientRect();d=Math.min(devicePixelRatio||1,2);w=r.width;h=r.height;c.width=Math.round(w*d);c.height=Math.round(h*d);x.setTransform(d,0,0,d,0,0)}new ResizeObserver(size).observe(c);size();
function draw(time){let light=mode==='light',R=Math.min(w*.39,h*.39),cx=w/2,cy=h*.49,p=time/6*T,g=light?.5:.82;x.clearRect(0,0,w,h);
 // 1 atmosphere
 let a=x.createRadialGradient(cx,cy,0,cx,cy,R*1.3);a.addColorStop(0,light?'rgba(225,190,125,.14)':'rgba(90,130,180,.14)');a.addColorStop(1,'transparent');x.fillStyle=a;x.fillRect(0,0,w,h);
 // 2 seven spiral particle streams
 x.save();x.globalCompositeOperation='lighter';for(let s=0;s<7;s++)for(let i=0;i<26;i++){let q=i/25,z=p*(s%2?-1:1)+s*.83+q*5.2,r=R*(.2+q*.84);x.globalAlpha=Math.sin(Math.PI*q)*(.2+rnd(i,s)*.35)*g;x.fillStyle=s%3?'#9ddcff':'#f2d49a';x.beginPath();x.arc(cx+Math.cos(z)*r,cy+Math.sin(z)*r*.43,.6+rnd(s,i)*1.2,0,T);x.fill()}x.restore();
 // 3 eight 3D metallic ribbon orbits
 x.save();x.globalCompositeOperation='lighter';for(let k=0;k<8;k++){let tilt=-.66+k*.185,spin=p*(k%3===0?-1:1)*(.72+k*.035)+k*.71,rx=R*(.73+k%4*.105),ry=R*(.24+k%3*.105),path=new Path2D();for(let i=0;i<=180;i++){let u=i/180*T,wave=Math.sin(u*2+spin)*R*.055,X=Math.cos(u+spin)*rx,Y=Math.sin(u+spin)*ry+wave,px=cx+X*Math.cos(tilt)-Y*Math.sin(tilt)*.22,py=cy+X*Math.sin(tilt)*.42+Y*Math.cos(tilt);i?path.lineTo(px,py):path.moveTo(px,py)}let grad=x.createLinearGradient(cx-rx,cy-ry,cx+rx,cy+ry);grad.addColorStop(0,light?'#68a9d5':'#9ddcff');grad.addColorStop(.34,'#fffdf6');grad.addColorStop(.68,light?'#b98735':'#f5d99a');grad.addColorStop(1,'#b9a4dc');x.lineCap='round';x.globalAlpha=.65*g;x.strokeStyle=grad;x.shadowColor='#9ddcff';x.shadowBlur=9;x.lineWidth=6+k%3;x.stroke(path);x.globalAlpha=.95*g;x.shadowBlur=2;x.lineWidth=2.5+k%3;x.stroke(path);x.globalAlpha=.4*g;x.shadowBlur=0;x.strokeStyle='#fff';x.lineWidth=.7;x.stroke(path)}x.restore();
 // 4 orbital glints
 x.save();x.globalCompositeOperation='lighter';for(let i=0;i<54;i++){let z=rnd(i,8)*T+p*(i%2?.2:-.17),r=R*(.58+rnd(i,2)*.54);x.globalAlpha=(.15+rnd(i,5)*.4)*g;x.fillStyle=i%3?'#9ddcff':'#f0cf8e';x.beginPath();x.arc(cx+Math.cos(z)*r,cy+Math.sin(z)*r*.55,.6+rnd(i,9),0,T);x.fill()}x.restore();
 // 5 light pillars
 x.save();x.globalCompositeOperation='lighter';for(let i=0;i<35;i++){let z=i/35*T+p*.08,r1=R*(i%7===0?.12:.42),r2=R*(i%7===0?1:.78),x1=cx+Math.cos(z)*r1,y1=cy+Math.sin(z)*r1*.56,x2=cx+Math.cos(z)*r2,y2=cy+Math.sin(z)*r2*.56,gr=x.createLinearGradient(x1,y1,x2,y2);gr.addColorStop(0,'transparent');gr.addColorStop(.6,i%2?'#9ddcff':'#f0cf8e');gr.addColorStop(1,'transparent');x.globalAlpha=(i%7===0?.3:.1)*g;x.strokeStyle=gr;x.lineWidth=i%7===0?1.4:.55;x.beginPath();x.moveTo(x1,y1);x.lineTo(x2,y2);x.stroke()}x.restore();
 // 6 core and horizontal flash
 x.save();x.globalCompositeOperation='lighter';let core=x.createRadialGradient(cx,cy,0,cx,cy,R*.4);core.addColorStop(0,'rgba(255,255,255,.98)');core.addColorStop(.18,'rgba(255,235,190,.72)');core.addColorStop(1,'transparent');x.globalAlpha=g;x.fillStyle=core;x.beginPath();x.arc(cx,cy,R*.4,0,T);x.fill();let flare=x.createLinearGradient(cx-R*.58,cy,cx+R*.58,cy);flare.addColorStop(0,'transparent');flare.addColorStop(.45,'#9ddcff');flare.addColorStop(.5,'#fff');flare.addColorStop(.57,'#f5d99a');flare.addColorStop(1,'transparent');x.fillStyle=flare;x.fillRect(cx-R*.58,cy-1.1,R*1.16,2.2);x.restore();
 // 7 deterministic star dust + bokeh
 x.save();x.globalCompositeOperation='lighter';for(let i=0;i<(w<420?430:820);i++){let z=rnd(i,17)*T+p*(.025+rnd(i,6)*.07),r=R*(.18+rnd(i,3)*1.05),tw=.2+.8*Math.abs(Math.sin(p*(.7+rnd(i,12))+i));x.globalAlpha=(.12+rnd(i,7)*.42)*tw*g;x.fillStyle=i%11===0?'#f5d99a':i%3?'#9ddcff':'#fff';x.beginPath();x.arc(cx+Math.cos(z)*r,cy+Math.sin(z)*r*.68,.35+rnd(i,10),0,T);x.fill()}for(let i=0;i<28;i++){let z=rnd(i,28)*T+p*.035,r=R*(.35+rnd(i,31)*.82);x.globalAlpha=.055*g;x.fillStyle=i%2?'#9ddcff':'#f5d99a';x.beginPath();x.arc(cx+Math.cos(z)*r,cy+Math.sin(z)*r*.65,2+rnd(i,33)*4,0,T);x.fill()}x.restore();
 // 8 touch shockwave
 let age=shock<0?9:(performance.now()-shock)/1000;if(age<1.5){let q=1-age/1.5;x.save();x.globalCompositeOperation='lighter';x.globalAlpha=q*.72;x.strokeStyle='#fff';x.shadowColor='#9ddcff';x.shadowBlur=15;x.lineWidth=1.5+q*2;x.beginPath();x.ellipse(cx,cy,R*(.2+(1-q)*1.9),R*(.2+(1-q)*1.9)*.58,0,0,T);x.stroke();x.restore()}}
function frame(now){if(!shown){last=0;return}let dt=last?Math.min(.05,(now-last)/1000):0;last=now;t=(t+dt)%6;draw(t);requestAnimationFrame(frame)}function pulse(){shock=performance.now()}c.addEventListener('pointerdown',pulse);document.querySelector('#shock').onclick=pulse;document.querySelector('#theme').onclick=()=>{mode=mode==='dark'?'light':'dark';root.dataset.theme=mode};
document.addEventListener('visibilitychange',()=>{shown=!document.hidden;last=0;if(shown)requestAnimationFrame(frame)});
async function record(kind){if(busy)return;let stream=c.captureStream(30),types=kind==='webm'?['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm']:['video/mp4;codecs=avc1.42E01E','video/mp4'],mime=types.find(v=>MediaRecorder.isTypeSupported(v));if(!mime){status.textContent='当前浏览器不支持此录制格式';stream.getTracks().forEach(v=>v.stop());return}busy=true;status.textContent='录制 6 秒中，请保持页面前台…';let parts=[],rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:9000000});rec.ondataavailable=e=>{if(e.data.size)parts.push(e.data)};rec.onstop=()=>{let blob=new Blob(parts,{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=kind==='webm'?'golden-sigil-alpha-test.webm':'golden-sigil-'+mode+'-fallback.mp4';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);stream.getTracks().forEach(v=>v.stop());busy=false;status.textContent=kind==='webm'?'WebM 测试文件已导出：正式交付前必须验证 Alpha 通道':'MP4 已导出：H.264 兜底不含透明通道，当前主题背景已烘焙'};rec.start(100);setTimeout(()=>{if(rec.state==='recording')rec.stop()},6000)}
document.querySelector('#webm').onclick=()=>record('webm');document.querySelector('#mp4').onclick=()=>record('mp4');requestAnimationFrame(frame)})();
</script></body></html>
