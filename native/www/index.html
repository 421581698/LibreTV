<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080b12" />
    <title>Friday iOS</title>
    <style>
      :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #080b12; color: #f4f7ff; }
      main { width: min(86vw, 440px); text-align: center; }
      .orb { width: 112px; height: 112px; margin: 0 auto 28px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff 0 2%, #78e8ff 8%, #9b6dff 34%, #f04cba 62%, #101526 78%); box-shadow: 0 0 36px #a64dff88, inset -12px -16px 28px #080b12aa; }
      h1 { font-size: 28px; margin: 0 0 10px; }
      p { color: #aab4c8; line-height: 1.6; }
      code { color: #9deaff; }
    </style>
  </head>
  <body>
    <main>
      <div class="orb" aria-hidden="true"></div>
      <h1>Friday iOS Native Shell</h1>
      <p>原生语音插件与云构建验证入口。</p>
      <p>下一步可在 GitHub Actions 的 <code>FRIDAY_WEB_URL</code> 输入项中指定现有 LibreTV Preview 地址。</p>
    </main>
  </body>
</html>
